<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Good Parts</title>
<meta name="description" content="A claw machine necromancer game: win body parts from the claw, stitch them into monsters, send them to fight, and get the parts back.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230e0b16%27/%3E%3Cpath fill=%27%23fff6e3%27 d=%27M4 2h8v2h2v6h-2v2h-1v2H5v-2H4v-2H2V4h2z%27/%3E%3Cpath fill=%27%230e0b16%27 d=%27M5 6h2v2H5zM9 6h2v2H9zM7 10h2v2H7z%27/%3E%3C/svg%3E">
<style>
/* The Good Parts: one deliberate dark world (a night-time arcade), so no light theme.
   Layout: a single canvas centred in the viewport; overlays (tuning panel, report) slide over it. */
:root {
  --bg: #0e0b16; --panel: #1b1526; --panel-2: #26203a; --ink: #ecdcbc; --muted: #8a7aa8; --accent: #ff8ac6; --line: #3b3654;
  --gutter: 0px; --gutter-y: 0px;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); overflow: hidden; box-sizing: border-box;
  padding-inline: var(--gutter); padding-block: var(--gutter-y);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; cursor: default; outline: none; flex: none;
  box-shadow: 0 0 0 1px #000, 0 20px 80px rgba(0, 0, 0, .6); }
#game:focus-visible { box-shadow: 0 0 0 2px var(--accent), 0 20px 80px rgba(0, 0, 0, .6); }
#under { flex: none; display: flex; gap: 10px; align-items: center; justify-content: center; max-width: 100%; }
#hint { margin: 0; color: var(--muted); text-align: center; font-size: 11px; }
#menuBtn { flex: none; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 4px 9px; cursor: pointer; border-radius: 3px; min-height: 28px; }
#menuBtn:hover { border-color: var(--accent); }
#menuBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
#crash { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 9; display: none; background: #3a1424ee; border: 1px solid #e8405a; color: var(--ink); padding: 7px 10px; border-radius: 3px; }
#crash.open { display: block; }
#crash button, #copybox { font: inherit; }
#crash button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); padding: 3px 8px; margin-left: 4px; cursor: pointer; border-radius: 3px; }
#crash button:hover, #crash button:focus-visible { border-color: var(--accent); }
#copybox { position: fixed; left: 8px; right: 8px; bottom: 8px; height: 30vh; z-index: 10; display: none; background: var(--bg); color: var(--ink); border: 1px solid var(--accent); }
#copybox.open { display: block; }
#hint kbd { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
#dbgToggle { position: fixed; left: 8px; bottom: 8px; z-index: 5; background: #1b1526cc; color: var(--muted); border: 1px solid var(--line);
  font: inherit; padding: 3px 7px; cursor: pointer; border-radius: 3px; opacity: .55; }
#dbgToggle:hover, #dbgToggle:focus-visible { opacity: 1; color: var(--ink); }
#debug { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 92vw); z-index: 6; background: #120e1cf2; border-left: 1px solid var(--line);
  overflow-y: auto; transform: translateX(105%); transition: transform .18s ease; padding: 8px 10px 30px; box-sizing: border-box; }
#debug.open { transform: none; }
#debug .dbg-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
#debug .dbg-head span { color: var(--muted); flex: 1; }
#debug button, #report button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 3px 6px; margin: 2px 2px 2px 0; cursor: pointer; border-radius: 3px; }
#debug button:hover, #report button:hover, #debug button:focus-visible, #report button:focus-visible { border-color: var(--accent); }
#debug details { margin: 6px 0; border-top: 1px solid var(--line); padding-top: 4px; }
#debug summary { cursor: pointer; color: var(--accent); font-weight: bold; }
#debug label { display: grid; grid-template-columns: 1fr 92px 38px; gap: 6px; align-items: center; margin: 3px 0; }
#debug label span { color: #cdb892; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#debug input[type=range] { width: 92px; accent-color: var(--accent); }
#debug output { text-align: right; color: var(--ink); }
#dbgText { width: 100%; box-sizing: border-box; height: 110px; margin: 4px 0; background: var(--bg); color: var(--ink); border: 1px solid var(--accent); font: 11px/1.3 ui-monospace, monospace; }
#report { position: fixed; inset: 5vh 5vw; z-index: 7; background: #120e1cf7; border: 1px solid var(--line); display: none; flex-direction: column; }
#report.open { display: flex; }
#report .rep-head { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); align-items: center; }
#report .rep-head b { flex: 1; }
#report pre { margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap; color: var(--ink); min-width: 0; }
#boot { position: fixed; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { #debug { transition: none; } }
</style>
</head>
<body>
<div id="boot">loading…</div>
<canvas id="game" width="480" height="270" tabindex="0" role="application" aria-label="The Good Parts, a claw machine necromancer game. Menus and the Reaper's lines are read out."></canvas>
<div id="under"><p id="hint"></p><button id="menuBtn" type="button" title="Pause and settings">☰ Menu</button></div>
<div id="sr" class="sr-only" aria-live="polite" role="status"></div>
<button id="dbgToggle" title="Tuning panel ( ` )">⚙ tune</button>
<div id="debug"></div>
