// ==== 36_menu.js ====
// ---------------------------------------------------------------------------
// MENUS — title, pause, settings, controls and how-to-play, drawn on the canvas like the rest of the game.
//
// ListMenu is one widget (rows you can move through, flip, slide and press) with three ways in that all do
// the same things: keys (whatever the player bound), mouse, touch. Overlays are what Engine.open() stacks on
// top of the game; a non-live overlay freezes the scene under it, and while it is up no game action works.
// That is the pause rule in docs/DESIGN.md: you cannot ZAP, retreat, stitch or steer the claw while paused.
// ---------------------------------------------------------------------------
class ListMenu {
  // items: { label, kind: 'button'|'toggle'|'slider'|'choice'|'header'|'info', get(), set(v), choices:[[value,text]], onClick(), disabled(), hint }
  constructor({ title, items, x = 130, y = 40, w = 220, rows = 11, onBack, footer }) {
    Object.assign(this, { title, items, x, y, w, rows, onBack, footer });
    this.sel = this.items.findIndex((i) => this.pickable(i));
    this.top = 0;
    this.drag = null;
  }
  pickable(i) { return i.kind !== 'header' && i.kind !== 'info' && !(i.hidden && i.hidden()); }
  visible() { return this.items.filter((i) => !(i.hidden && i.hidden())); }
  rowY(idx) { return this.y + 16 + (idx - this.top) * 13; }
  sound(n, o) { if (typeof Sfx !== 'undefined') Sfx.play(n, o); }

  move(d) {
    const v = this.visible();
    let i = v.indexOf(this.items[this.sel]);
    for (let n = 0; n < v.length; n++) { i = (i + d + v.length) % v.length; if (this.pickable(v[i])) break; }
    this.select(this.items.indexOf(v[i]));
    this.sound('ui_hover');
  }
  select(idx) {
    this.sel = idx;
    const v = this.visible(), vi = v.indexOf(this.items[idx]);
    if (vi < this.top) this.top = vi;
    if (vi >= this.top + this.rows) this.top = vi - this.rows + 1;
    if (typeof Announce !== 'undefined') { const it = this.items[idx]; Announce.say(it.label + (it.get ? ', ' + this.valueText(it) : '') + (it.hint ? '. ' + it.hint : '')); }
  }
  valueText(it) {
    if (it.kind === 'toggle') return it.get() ? 'ON' : 'OFF';
    if (it.kind === 'slider') return Math.round(it.get() * 100) + '%';
    if (it.kind === 'choice') { const c = it.choices.find(([v]) => v === it.get()); return c ? c[1] : ''; }
    return it.text ? it.text() : '';
  }
  adjust(it, d) {
    if (!it || it.disabled && it.disabled()) return;
    if (it.kind === 'slider') { it.set(clamp(Math.round((it.get() + d * 0.1) * 10) / 10, 0, 1)); this.sound('ui_click'); }
    else if (it.kind === 'toggle') { it.set(!it.get()); this.sound('ui_click'); }
    else if (it.kind === 'choice') {
      const i = it.choices.findIndex(([v]) => v === it.get());
      it.set(it.choices[(i + d + it.choices.length) % it.choices.length][0]); this.sound('ui_click');
    }
    if (typeof Announce !== 'undefined') Announce.say(it.label + ', ' + this.valueText(it));
  }
  activate(it) {
    if (!it) return;
    if (it.disabled && it.disabled()) { this.sound('ui_deny'); return; }
    if (it.kind === 'button') { this.sound(it.sound || 'ui_click'); it.onClick(); }
    else if (it.kind !== 'slider') this.adjust(it, 1);
  }

  update() {
    UI.set([]); // the menu handles its own pointer; nothing underneath may react
    const v = this.visible();
    if (Input.hit('up')) this.move(-1);
    if (Input.hit('down')) this.move(1);
    const it = this.items[this.sel];
    if (Input.hit('left')) this.adjust(it, -1);
    if (Input.hit('right')) this.adjust(it, 1);
    if (Input.hit('a')) this.activate(it);
    if (Input.hit('b') && this.onBack) { this.sound('ui_back'); this.onBack(); return; }
    // pointer: hover selects, press activates, dragging a slider sets it
    const m = Input.mouse;
    if (m.x >= 0) {
      const inX = m.x >= this.x && m.x < this.x + this.w;
      const row = inX ? Math.floor((m.y - this.rowY(this.top)) / 13) + this.top : -1;
      const hov = row >= this.top && row < this.top + this.rows && row < v.length ? v[row] : null;
      if (m.moved && hov && this.pickable(hov) && this.items.indexOf(hov) !== this.sel) { this.select(this.items.indexOf(hov)); this.sound('ui_hover'); }
      if (m.pressed && hov && this.pickable(hov)) {
        this.select(this.items.indexOf(hov));
        if (hov.kind === 'slider') this.drag = hov; else this.activate(hov);
      }
      if (m.pressed && inX && m.y < this.y + 14 + 2 && this.top > 0) this.top--; // click the ▲
      if (m.pressed && inX && m.y > this.rowY(this.top + this.rows) - 2 && this.top + this.rows < v.length && m.y < this.rowY(this.top + this.rows) + 12) this.top++; // click the ▼
    }
    if (this.drag) {
      if (m.down) { const k = clamp((m.x - (this.x + this.w - 84)) / 60, 0, 1); const nv = Math.round(k * 10) / 10; if (nv !== this.drag.get()) { this.drag.set(nv); this.sound('ui_hover', { pitch: 0.8 + nv * 0.6 }); } }
      else this.drag = null;
    }
  }

  draw(ctx) {
    const v = this.visible(), h = 26 + Math.min(this.rows, v.length) * 13 + (this.footer ? 12 : 0);
    Draw.panel(ctx, this.x - 8, this.y - 6, this.w + 16, h + 6, 'slate');
    Font.draw(ctx, this.title, this.x + this.w / 2, this.y, { align: 'center', color: '#fff6e3', shadow: PAL.k });
    if (this.top > 0) Font.draw(ctx, '↑', this.x + this.w - 4, this.y + 4, { font: 'small', color: '#7a6a9a', align: 'right' });
    const sel = this.items[this.sel];
    for (let i = this.top; i < Math.min(v.length, this.top + this.rows); i++) {
      const it = v[i], y = this.rowY(i), on = it === sel, off = it.disabled && it.disabled();
      if (it.kind === 'header') { Font.draw(ctx, it.label, this.x, y + 3, { font: 'small', color: '#ff8ac6' }); Draw.rect(ctx, this.x + Font.measure(it.label, 'small') + 4, y + 6, this.w - Font.measure(it.label, 'small') - 4, 1, '#3b3654'); continue; }
      if (on) { Draw.rect(ctx, this.x - 2, y - 1, this.w + 4, 12, '#2d3344'); Draw.frame(ctx, this.x - 2, y - 1, this.w + 4, 12, '#ff8ac6'); Font.draw(ctx, '▶', this.x + 1, y + 2, { color: '#fff6e3' }); }
      const col = off ? '#5b4a78' : on ? '#fff6e3' : '#cdb892';
      Font.draw(ctx, it.label, this.x + 11, y + 2, { color: col, shadow: on ? PAL.k : null });
      if (it.kind === 'slider') {
        const bx = this.x + this.w - 84, k = it.get();
        Draw.rect(ctx, bx, y + 4, 62, 4, PAL.k); Draw.rect(ctx, bx + 1, y + 5, 60, 2, '#33274a');
        Draw.rect(ctx, bx + 1, y + 5, Math.round(60 * k), 2, off ? '#5b4a78' : '#9be38f');
        Draw.rect(ctx, bx + Math.round(60 * k) - 1, y + 2, 3, 8, '#fff6e3');
        Font.draw(ctx, Math.round(k * 100) + '%', this.x + this.w - 2, y + 3, { font: 'small', color: col, align: 'right' });
      } else if (it.kind === 'toggle') {
        Font.draw(ctx, this.valueText(it), this.x + this.w - 2, y + 2, { color: it.get() ? '#9be38f' : '#7a6a9a', align: 'right' });
      } else if (it.kind === 'choice') {
        Font.draw(ctx, (on ? '◀ ' : '') + this.valueText(it) + (on ? ' ▶' : ''), this.x + this.w - 2, y + 2, { color: '#9be38f', align: 'right' });
      } else if (it.text) Font.draw(ctx, it.text(), this.x + this.w - 2, y + 2, { color: '#7a6a9a', align: 'right' });
    }
    if (this.top + this.rows < v.length) Font.draw(ctx, '↓', this.x + this.w - 4, this.rowY(this.top + this.rows) + 1, { font: 'small', color: '#7a6a9a', align: 'right' });
    // the hint for the highlighted row, then the key reminder
    const foot = this.y + 18 + Math.min(this.rows, v.length) * 13;
    if (sel && sel.hint) Font.drawWrapped(ctx, sel.hint, this.x, foot - 1, this.w, { font: 'small', color: '#a6aec2' });
    else if (this.footer) Font.draw(ctx, typeof this.footer === 'function' ? this.footer() : this.footer, this.x + this.w / 2, foot, { font: 'small', color: '#7a6a9a', align: 'center' });
  }
}

const dimBackdrop = (ctx, a = 0.72) => { ctx.fillStyle = `rgba(14,11,22,${a})`; ctx.fillRect(0, 0, W, H); };
const keyLine = () => `${Settings.hint('up')} ${Settings.hint('down')} select   ${Settings.hint('left')} ${Settings.hint('right')} change   ${Settings.hint('a')} ok   ${Settings.hint('b')} back`;

// -------------------------------------------------------------------- overlays
const Overlays = (() => {
  const persist = () => { Settings.apply(); Save.soon(); };
  const S = () => Settings.v;

  // A message with two choices. Default is the SAFE one (No), so a stray Enter cannot delete a run.
  function confirm(text, yes, { yesLabel = 'YES', noLabel = 'NO', danger = false } = {}) {
    const menu = new ListMenu({ title: '', x: 150, y: 128, w: 180, rows: 2, onBack: () => Engine.close(), items: [
      { label: noLabel, kind: 'button', onClick: () => Engine.close() },
      { label: yesLabel, kind: 'button', onClick: () => { Engine.close(); yes(); } },
    ] });
    menu.sel = 0;
    Engine.open({
      update() { menu.update(); },
      draw(ctx) {
        dimBackdrop(ctx, 0.55);
        Draw.panel(ctx, 110, 84, 260, 40, danger ? 'red' : 'slate');
        Font.drawWrapped(ctx, text, 122, 94, 236, { color: '#fff6e3' });
        menu.draw(ctx);
      },
    });
    if (typeof Announce !== 'undefined') Announce.say(text);
  }

  function help() {
    Engine.open({
      update() { UI.set([]); if (Input.anyPressed) { Sfx.play('ui_back'); Engine.close(); } }, // any key or tap closes it
      draw(ctx) {
        dimBackdrop(ctx, 0.82);
        Draw.panel(ctx, 40, 14, 400, 242, 'slate');
        Font.draw(ctx, 'HOW TO PLAY', 240, 22, { align: 'center', color: '#fff6e3', shadow: PAL.k });
        const K = (a) => Settings.hint(a);
        const lines = [
          ['THE IDEA', '#ff8ac6'],
          ['Win body parts from the claw machine. Stitch them into monsters on the slab. Send them to fight the shades in the graveyard. Every part they lose goes back in the machine.', '#ecdcbc'],
          ['THE CLAW', '#ff8ac6'],
          [`${K('left')} ${K('right')} steer.  ${K('a')} drops the claw, and again to let go over the chute.  Hold the mouse or a finger on the glass to steer toward it. Carrying: hold a direction to speed up, ease off to steady it. Fast carries swing, and swinging parts slip.`, '#ecdcbc'],
          ['THE RIG', '#ff8ac6'],
          [`Bad luck fills your LUCK. Spend it on the levers beside the glass: ${K('nudgeL')} ${K('nudgeR')} nudge (free, but do not TILT it), ${K('quake')} quake, ${K('grip')} iron grip, ${K('order')} order a part, ${K('redo')} redo a failed grab.`, '#ecdcbc'],
          ['THE FIGHT', '#ff8ac6'],
          [`Once you press FIGHT it is live. ZAP heals and hastes (it recharges). RETREAT keeps everyone alive and pays for the damage you did. ${K('pause')} pauses, and nothing can be done while paused.`, '#ecdcbc'],
          ['THE RUN', '#ff8ac6'],
          ['Fifteen stages in three acts. Every fifth is a boss; the last one is the Landlord. The Reaper tells you what is coming: build for it.', '#ecdcbc'],
        ];
        let y = 34;
        for (const [t, c] of lines) {
          if (c === '#ff8ac6') { Font.draw(ctx, t, 54, y, { font: 'small', color: c }); y += 10; }
          else { const r = Font.drawWrapped(ctx, t, 54, y, 372, { color: c }); y += Math.max(1, (Font.wrap(t, 372).length)) * 10 + 6; }
        }
        Font.draw(ctx, 'press any key or click to close', 240, 244, { font: 'small', color: '#7a6a9a', align: 'center' });
      },
    });
    if (typeof Announce !== 'undefined') Announce.say('How to play. Win parts from the claw, stitch monsters, fight. Press any key to close.');
  }

  // ---------------------------------------------------------------- controls
  function controls() {
    let row = 0, slot = 0, capturing = null, msg = '';
    const rows = KEY_ACTIONS.length + 1; // + reset
    const ROW0 = 40, RH = 12; // first row's y and the row pitch: fifteen actions plus RESET fit above the message line
    const open = (r, s) => {
      capturing = { r, s };
      msg = '';
      Input.capture = (code) => {
        capturing = null;
        const a = KEY_ACTIONS[r];
        if (code === 'Escape') { Sfx.play('ui_back'); return; }
        if (code === 'Backspace' || code === 'Delete') { msg = Settings.unbind(a.id, s) ? a.label + ' cleared.' : 'Every action needs at least one key.'; Sfx.play(msg.endsWith('.') && msg !== 'Every action needs at least one key.' ? 'ui_click' : 'ui_deny'); persist(); return; }
        if (/^F\d+$|^Tab$|^ContextMenu$|^Meta|^Control|^Alt|^Shift/.test(code)) { msg = 'That key is not available.'; Sfx.play('ui_deny'); return; }
        const strands = Settings.wouldStrand(a.id, code);
        if (strands) { msg = Settings.keyName(code) + ' is the only key for "' + KEY_ACTIONS.find((x) => x.id === strands).label + '". Give that another key first.'; Sfx.play('ui_deny'); return; }
        const stolen = Settings.bind(a.id, s, code);
        const from = stolen && stolen !== a.id ? KEY_ACTIONS.find((x) => x.id === stolen).label : null;
        msg = Settings.keyName(code) + ' → ' + a.label + (from ? ' (was ' + from + ')' : '');
        Sfx.play('ui_click');
        persist();
      };
    };
    Engine.open({
      update() {
        UI.set([]);
        if (capturing) { // a tap cancels too: a phone has no Escape
          if (Input.mouse.pressed) { capturing = null; Input.capture = null; Sfx.play('ui_back'); }
          return;
        }
        if (Input.hit('up')) { row = (row + rows - 1) % rows; Sfx.play('ui_hover'); }
        if (Input.hit('down')) { row = (row + 1) % rows; Sfx.play('ui_hover'); }
        if (Input.hit('left')) { slot = 0; Sfx.play('ui_hover'); }
        if (Input.hit('right')) { slot = 1; Sfx.play('ui_hover'); }
        if (Input.hit('a')) { if (row === KEY_ACTIONS.length) { Settings.resetKeys(); msg = 'Keys reset to their defaults.'; Sfx.play('ui_click'); persist(); } else open(row, slot); }
        if (Input.hit('b')) { Sfx.play('ui_back'); Engine.close(); return; }
        const m = Input.mouse;
        if (m.x >= 0) {
          const r = Math.floor((m.y - ROW0 + 1) / RH);
          if (r >= 0 && r <= KEY_ACTIONS.length && m.x > 100 && m.x < 380) {
            const s = m.x > 290 ? 1 : 0;
            if (m.moved && (r !== row || (r < KEY_ACTIONS.length && s !== slot))) { row = r; if (r < KEY_ACTIONS.length && m.x > 210) slot = s; }
            if (m.pressed) { row = r; if (r === KEY_ACTIONS.length) { Settings.resetKeys(); msg = 'Keys reset to their defaults.'; Sfx.play('ui_click'); persist(); } else if (m.x > 210) { slot = s; open(r, s); } }
          }
        }
      },
      exit() { Input.capture = null; },
      draw(ctx) {
        dimBackdrop(ctx, 0.85);
        Draw.panel(ctx, 90, 14, 300, 242, 'slate');
        Font.draw(ctx, 'KEY BINDINGS', 240, 22, { align: 'center', color: '#fff6e3', shadow: PAL.k });
        Font.draw(ctx, 'Two keys per action. Pad: d-pad, A, B, LB RB nudge, X quake, Y grip.', 240, 31, { align: 'center', font: 'small', color: '#7a6a9a' });
        KEY_ACTIONS.forEach((a, i) => {
          const y = ROW0 + i * RH, on = i === row;
          if (on) { Draw.rect(ctx, 98, y - 1, 284, RH, '#2d3344'); Draw.frame(ctx, 98, y - 1, 284, RH, '#ff8ac6'); }
          Font.draw(ctx, a.label, 106, y + 1, { color: on ? '#fff6e3' : '#cdb892' });
          for (let s = 0; s < 2; s++) {
            const x = 214 + s * 82, sel = on && slot === s, cap = capturing && capturing.r === i && capturing.s === s;
            Draw.panel(ctx, x, y - 1, 76, RH - 1, cap ? 'red' : sel ? 'green' : 'dark');
            Font.draw(ctx, cap ? 'PRESS A KEY' : Settings.keyName(Settings.v.keys[a.id][s]), x + 38, y + 1, { align: 'center', color: cap ? '#fff6e3' : sel ? '#fff6e3' : '#ecdcbc' });
          }
        });
        const ry = ROW0 + KEY_ACTIONS.length * RH, ron = row === KEY_ACTIONS.length;
        if (ron) { Draw.rect(ctx, 98, ry - 1, 284, RH, '#2d3344'); Draw.frame(ctx, 98, ry - 1, 284, RH, '#ff8ac6'); }
        Font.draw(ctx, 'RESET TO DEFAULTS', 240, ry + 1, { align: 'center', color: ron ? '#fff6e3' : '#cdb892' });
        Font.drawWrapped(ctx, capturing ? 'Press the new key. ESC cancels, BACKSPACE clears this slot.' : msg || `${Settings.hint('left')} ${Settings.hint('right')} pick a slot   ${Settings.hint('a')} rebind   ${Settings.hint('b')} back`, 106, ry + RH + 3, 268, { font: 'small', color: capturing ? '#ff8ac6' : '#a6aec2' });
      },
    });
    if (typeof Announce !== 'undefined') Announce.say('Key bindings. Up and down choose an action, then press to rebind.');
  }

  // ---------------------------------------------------------------- settings
  function settings() {
    const on = (k) => ({ get: () => S()[k], set: (v) => { S()[k] = v; persist(); } });
    const menu = new ListMenu({ title: 'SETTINGS', x: 100, y: 20, w: 280, rows: 14, onBack: () => { Save.flush(); Engine.close(); }, footer: keyLine, items: [
      { label: 'AUDIO', kind: 'header' },
      { label: 'Master volume', kind: 'slider', ...on('master') },
      { label: 'Music volume', kind: 'slider', ...on('music') },
      { label: 'Effects volume', kind: 'slider', ...on('sfx') },
      { label: 'Mute', kind: 'toggle', get: () => S().muted, set: (v) => { S().muted = v; persist(); }, hint: `Also on the ${Settings.hint('mute')} key.` },
      { label: 'COMFORT', kind: 'header' },
      { label: 'Screen shake', kind: 'choice', choices: [[0, 'Off'], [0.5, 'Low'], [1, 'Full']], ...on('shake') },
      { label: 'Reduce flashing', kind: 'toggle', ...on('reduceFlash'), hint: 'No full-screen flashes, and nothing blinks faster than 1.5 times a second.' },
      { label: 'Slow-motion on rare catches', kind: 'toggle', ...on('slowmo') },
      { label: 'THE CLAW', kind: 'header' },
      { label: 'Drop guide', kind: 'toggle', ...on('dropGuide'), hint: 'The dotted line that shows where the claw will land.' },
      { label: 'Auto-carry assist', kind: 'toggle', ...on('autoCarry'), hint: 'The machine carries a part to the chute for you at a steady speed. Where you drop the claw is still up to you.' },
      { label: 'Carry time', kind: 'choice', choices: [[8, '8 s'], [16, '16 s'], [0, 'No limit']], ...on('carryTime'), hint: 'How long you get to bring a part to the chute.' },
      { label: 'Steering', kind: 'choice', choices: [['hold', 'Hold key'], ['toggle', 'Tap to toggle']], ...on('steering'), hint: 'Tap to toggle: tap a direction to start moving, tap again to stop. Nothing needs holding.' },
      { label: 'CONTROLS', kind: 'header' },
      { label: 'Key bindings…', kind: 'button', onClick: () => controls(), hint: 'Change any key. Every action has two slots.' },
      { label: 'THIS DEVICE', kind: 'header' },
      { label: 'Saving', kind: 'info', text: () => (Store.persistent ? 'on' : 'off in this window') },
      { label: 'Copy debug info', kind: 'button', onClick: () => { Platform.copy(CrashLog.text('Debug info'), (ok) => Overlays.toast(ok ? 'Copied. Paste it into a bug report.' : 'Could not copy: it is shown in the report window.')); }, hint: 'Version, browser and the last few errors, ready to paste into a bug report.' },
      { label: 'Report a problem…', kind: 'button', onClick: () => Platform.open(BUILD.issues), hint: BUILD.issues.replace('https://', '') },
      { label: 'Delete saved run and records…', kind: 'button', onClick: () => confirm('Delete your saved run, records and settings? This cannot be undone.', () => { Save.wipe(); Settings.apply(); Engine.closeAll(); Game.newGame(); Engine.go('shop', { title: true }, 'cut'); Overlays.title(); }, { yesLabel: 'DELETE EVERYTHING', noLabel: 'KEEP', danger: true }) },
      { label: 'About', kind: 'info', text: () => BUILD.name + ' ' + BUILD.version },
    ] });
    Engine.open({ update() { menu.update(); }, draw(ctx) { dimBackdrop(ctx, 0.85); menu.draw(ctx); } });
    if (typeof Announce !== 'undefined') Announce.say('Settings.');
  }

  // ------------------------------------------------------------------- pause
  function pause() {
    const back = () => { Sfx.play('ui_back'); Engine.close(); };
    const menu = new ListMenu({ title: 'PAUSED', x: 160, y: 84, w: 160, rows: 4, onBack: back, footer: () => `${Settings.hint('pause')} or ${Settings.hint('b')} to resume`, items: [
      { label: 'RESUME', kind: 'button', onClick: back },
      { label: 'SETTINGS', kind: 'button', onClick: settings },
      { label: 'HOW TO PLAY', kind: 'button', onClick: help },
      { label: 'QUIT TO TITLE', kind: 'button', onClick: () => confirm('Back to the title screen? Your run is saved.', () => { Save.flush(); Engine.closeAll(); Engine.go('shop', { title: true }, 'cut'); Overlays.title(); }, { yesLabel: 'QUIT', noLabel: 'STAY' }) },
    ] });
    Engine.open({
      pausePanel: true,
      update() {
        menu.update();
        if (Input.hit('pause') && Engine.top === this) back();
      },
      resume() { UI.set([]); },
      draw(ctx) {
        dimBackdrop(ctx, 0.6);
        menu.draw(ctx);
        Font.draw(ctx, 'The clock is stopped. Nothing can be done while paused.', 240, 176, { font: 'small', color: '#a6aec2', align: 'center' });
      },
    });
    if (typeof Announce !== 'undefined') Announce.say('Paused.');
  }

  // ------------------------------------------------------------------- title
  function title() {
    const cont = () => {
      try { Game.fromSave(Save.data.run); }
      catch (e) { // a save we cannot read must not brick the title: report it, keep the file, and leave the title up
        CrashLog.report(e, 'continue');
        Game.newGame();
        Overlays.toast('That saved run could not be loaded. Nothing was changed. Start a new run to play.');
        return;
      }
      Engine.close(); Save.runActive = true; Scenes.shop.open(true);
      if (Save.notes.length) { Overlays.toast(Save.notes.join(' ')); Save.notes = []; }
    };
    const fresh = () => { Engine.close(); Game.newGame(); Save.data.records.runs++; Save.reset(); Scenes.shop.open(false); };
    let t = 0;
    const has = Save.hasRun();
    const summary = has ? (() => { const r = Save.data.run; return 'Stage ' + r.stage + ' · ' + (r.party || []).length + ' creature' + ((r.party || []).length === 1 ? '' : 's') + ' · ' + (r.inventory || []).length + ' parts'; })() : '';
    const items = [];
    if (has) items.push({ label: 'CONTINUE', kind: 'button', onClick: cont, hint: summary });
    items.push({ label: has ? 'NEW RUN' : 'START', kind: 'button', onClick: has ? () => confirm('Start a new run? The run you have saved will be lost.', fresh, { yesLabel: 'NEW RUN', noLabel: 'KEEP MY RUN', danger: true }) : fresh });
    items.push({ label: 'SETTINGS', kind: 'button', onClick: settings });
    items.push({ label: 'HOW TO PLAY', kind: 'button', onClick: help });
    const menu = new ListMenu({ title: '', x: 170, y: 150, w: 140, rows: 5, items, footer: () => `${Settings.hint('a')} to choose` });
    Engine.open({
      live: true,
      update(dt) {
        t += dt;
        menu.update();
      },
      draw(ctx) {
        ctx.fillStyle = 'rgba(14,11,22,0.5)'; ctx.fillRect(0, 0, W, H);
        const k = clamp(t / 0.8, 0, 1);
        Font.draw(ctx, 'THE GOOD PARTS', 240, 60 - Math.round((1 - easeOutBack(k)) * 30), { scale: 4, color: '#fff1d6', outline: '#3a0c20', shadow: '#b0224a', align: 'center', alpha: k });
        Font.draw(ctx, 'Collect · Reanimate · Conquer', 240, 100, { color: '#cdb892', align: 'center', alpha: k, outline: PAL.k });
        menu.draw(ctx);
        // things the player should know before they invest in a run
        let ny = 236;
        const note = (s, c) => { Font.draw(ctx, s, 240, ny, { font: 'small', color: c, align: 'center', outline: PAL.k }); ny -= 9; };
        if (Save.problem === 'corrupt') note('Your save could not be read. A copy is kept, and this is a fresh start.', '#ff7d8a');
        if (Save.problem === 'newer') note('This save is from a newer version. It will not be overwritten.', '#f6c64b');
        if (!Store.persistent) note('Progress cannot be saved in this window (storage is blocked).', '#f6c64b');
        for (const n of Save.notes) note(n, '#f6c64b');
        Font.draw(ctx, BUILD.version, W - 4, H - 8, { font: 'small', color: '#5b4a78', align: 'right' });
      },
    });
    if (typeof Announce !== 'undefined') Announce.say('The Good Parts. ' + (has ? 'Continue, or start a new run.' : 'Start.'));
  }

  // --------------------------------------------------------- a line of feedback
  let toastText = '', toastT = 0;
  function toast(s) { toastText = s; toastT = 3; if (typeof Announce !== 'undefined') Announce.say(s); }
  function drawToast(ctx, dt) {
    if (toastT <= 0) return;
    toastT -= dt;
    Draw.panel(ctx, 240 - Font.measure(toastText) / 2 - 8, 246, Font.measure(toastText) + 16, 16, 'dark');
    Font.draw(ctx, toastText, 240, 251, { align: 'center', color: '#fff6e3' });
  }

  return { confirm, help, controls, settings, pause, title, toast, drawToast };
})();

// ------------------------------------------------------------ stage preview
// "Next: stage 4. 2 Shades, 1 Wisp. Armoured: big hits work." Drawn in the shop and on the slab so the claw
// has a shopping list (pillar 4). It reads STAGES, so it can never disagree with the fight.
const HELPS = { wisp: 'armour, health', shade: 'big hits', wraith: 'health, burst' };
function drawStagePreview(ctx, x, y, w, stage) {
  if (Game.won) return;
  const P = stagePreview(Math.min(stage, FINAL_STAGE));
  const kinds = [...new Set(P.kinds)];
  let helps = kinds.map((k) => HELPS[k]).join(' / ');
  while (Font.measure('Helps: ' + helps, 'small') > w - 12 && kinds.length > 1) { kinds.pop(); helps = kinds.map((k) => HELPS[k]).join(' / '); }
  Draw.panel(ctx, x, y, w, 36, 'dark');
  Font.draw(ctx, 'NEXT  STAGE ' + P.n + (P.final ? '  ·  THE LANDLORD' : P.boss ? '  ·  BOSS' : ''), x + 6, y + 5, { color: P.boss ? '#f6c64b' : '#ecdcbc', shadow: PAL.k });
  Font.draw(ctx, P.text + '  (' + [...new Set(P.kinds)].map((k) => ENEMY_KINDS[k].tag).join(', ') + ')', x + 6, y + 16, { font: 'small', color: '#a6aec2', shadow: PAL.k });
  Font.draw(ctx, 'Helps: ' + helps, x + 6, y + 26, { font: 'small', color: '#9be38f', shadow: PAL.k });
}

// ==== 37_scene_end.js ====
// ---------------------------------------------------------------------------
// END SCENE — the run is over: the Landlord is down. Shows what the run was (time, grabs, creatures) and
// how it compares with your records. There is no endless mode on purpose (docs/DESIGN.md): it ends, you
// take a bow, you start again if you want to.
// ---------------------------------------------------------------------------
Scenes.end = (() => {
  const S = {};
  const fx = new Particles();
  let t = 0, sel = 0, records = null, newBest = false, mins = 0;
  const FALL = ['p_skull', 'p_ribcage', 'p_bonearm', 'p_heart', 'p_boneleg', 'p_wolfskull', 'p_goldheart', 'p_crownskull', 'p_tentacle', 'p_wings', 'p_fleshArm', 'p_ogrearm'];
  S.pausable = false; // nothing to pause: the run is over
  S.tracksTime = false;

  S.enter = function () {
    t = 0; sel = 0; fx.list = [];
    mins = Math.max(1, Math.round(Game.playTime / 60));
    const r = Save.data && Save.data.records;
    newBest = !!(r && r.wins <= 1) || !!(r && r.bestWinMinutes && mins <= r.bestWinMinutes);
    records = r ? Object.assign({}, r) : null;
    Music.play('shop');
    Game.talk.say('That is the last of the rent. I may cry. Or rattle. Hard to tell.', 4);
    Telemetry.log('runWon', { minutes: mins });
    if (typeof Announce !== 'undefined') Announce.say(`The Landlord is down. You won in ${mins} minutes. ${Game.stats.grabs} grabs, ${Game.stats.creatures} creatures made.`);
  };
  S.exit = function () {};

  // NEW RUN starts at once; TITLE leaves no finished run behind and shows the title with START
  function again() { Game.newGame(); Save.data.records.runs++; Save.reset(); Engine.go('shop', {}); setTimeout(() => Game.talk.say('Again? The machine restocked itself. Funny, that.', 3), 400); }
  function toTitle() { Save.data.run = null; Save.runActive = false; Save.flush(); Game.newGame(); Engine.go('shop', { title: true }, 'cut'); Overlays.title(); }

  S.update = function (dt) {
    t += dt;
    fx.update(dt);
    Game.talk.update(dt);
    if (chanceTick(dt)) {
      const spr = vpick(FALL);
      if (SPR.has(spr)) fx.add({ kind: 'spr', spr, x: vrand(10, 470), y: -12, vx: vrand(-14, 14), vy: vrand(30, 60), ay: 10, vr: vrand(-2, 2), life: 6, fade: false, solid: undefined });
    }
    const items = [{ label: 'NEW RUN', act: again }, { label: 'TITLE', act: toTitle }];
    if (Input.hit('left') || Input.hit('up')) { sel = (sel + items.length - 1) % items.length; Sfx.play('ui_hover'); }
    if (Input.hit('right') || Input.hit('down')) { sel = (sel + 1) % items.length; Sfx.play('ui_hover'); }
    if (Input.hit('a') && t > 0.8) { Sfx.play('ui_click'); items[sel].act(); return; }
    UI.set(items.map((it, i) => ({ id: 'end' + i, x: 150 + i * 100, y: 238, w: 80, h: 18, label: it.label, style: i === 0 ? 'green' : 'dark', onClick: () => { sel = i; if (t > 0.8) it.act(); } })));
    S.items = items;
  };
  // parts fall at about 3 a second
  let acc = 0;
  function chanceTick(dt) { acc += dt * 3; if (acc >= 1) { acc -= 1; return true; } return false; }

  S.draw = function (ctx) {
    BG.graveyard(ctx, t);
    ctx.fillStyle = 'rgba(14,11,22,0.55)'; ctx.fillRect(0, 0, W, H);
    fx.draw(ctx);
    const k = clamp(t / 0.6, 0, 1);
    Font.draw(ctx, 'THE LANDLORD IS DOWN', 240, 22 - Math.round((1 - easeOutBack(k)) * 24), { scale: 3, color: '#f6c64b', outline: PAL.k, shadow: '#80501c', align: 'center', alpha: k });
    Font.draw(ctx, 'The graveyard is yours. The rent, at long last, is paid.', 240, 56, { color: '#ecdcbc', outline: PAL.k, align: 'center', alpha: k });
    // the run in numbers
    Draw.panel(ctx, 100, 74, 280, 128, 'slate');
    const st = Game.stats, tries = st.grabs || 1;
    const rows = [
      ['TIME', mins + ' min'],
      ['GRABS', st.grabs + '  (' + Math.round((100 * st.parts) / tries) + '% brought a part home)'],
      ['PARTS WON', String(st.parts)],
      ['CREATURES', st.creatures + '  (' + st.lost + ' fell apart)'],
      ['FIGHTS', st.fightsWon + ' won, ' + st.fightsLost + ' lost, ' + st.retreats + ' retreats'],
      ['ZAPS', String(st.zaps)],
    ];
    rows.forEach(([a, b], i) => { Font.draw(ctx, a, 116, 84 + i * 14, { font: 'small', color: '#a6aec2' }); Font.draw(ctx, b, 190, 83 + i * 14, { color: '#fff6e3', shadow: PAL.k }); });
    if (records) {
      Draw.rect(ctx, 112, 170, 256, 1, '#3b3654');
      Font.draw(ctx, `RUNS WON ${records.wins}    FASTEST ${records.bestWinMinutes || mins} MIN` + (newBest ? '    ★ NEW BEST' : ''), 240, 178, { font: 'small', color: newBest ? '#f6c64b' : '#7a6a9a', align: 'center' });
      Font.draw(ctx, 'Times are for you; there is no board. Nobody is watching. Well. The Reaper is.', 240, 190, { font: 'small', color: '#5b4a78', align: 'center' });
    }
    for (const b of UI.buttons) if (b.id && b.id.startsWith('end')) UI.drawButton(ctx, b);
    const b = UI.buttons.find((x) => x.id === 'end' + sel);
    if (b) Draw.frame(ctx, b.x - 2, b.y - 2, b.w + 4, b.h + 4, '#fff6e3');
    if (Game.talk.visible()) Game.talk.drawBubble(ctx, 90, 204, 300, null, null, {});
  };

  return S;
})();

// ==== 39_crashlog.js ====
// ---------------------------------------------------------------------------
// CRASH LOG — when something breaks, keep the evidence and keep playing.
//
// Errors are de-duplicated, kept in a short list, written to storage (so the NEXT launch can offer them) and
// formatted as a paste-able report: version, browser, graphics, what the game was doing, the last events.
// There is no server. The player copies the text or opens a prefilled GitHub issue; nothing is sent
// anywhere unless they choose to. No names, no account info, nothing beyond what is listed below.
// The DOM half (the toast, window error hooks) lives in 42_dom.js; this half also runs in Node for tests.
// ---------------------------------------------------------------------------
const CrashLog = {
  list: [],
  max: 6,
  gpu: '', // filled in by 42_dom.js (the WebGL renderer string), so reports say what graphics card ran it
  previous: null, // what the last session left behind, if it crashed
  onReport: null, // set by 42_dom.js to show the toast

  init() { this.previous = Store.get('thegoodparts.crash'); },

  report(err, where) {
    const msg = String((err && err.message) || err || 'unknown error').slice(0, 300);
    const stack = String((err && err.stack) || '').split('\n').slice(0, 6).join('\n').slice(0, 900);
    const key = where + '|' + msg + '|' + (stack.split('\n')[1] || '');
    let e = this.list.find((x) => x.key === key);
    if (e) { e.count++; e.last = Math.round(Telemetry.now()); return e; }
    e = { key, where, msg, stack, count: 1, first: Math.round(Telemetry.now()), last: Math.round(Telemetry.now()) };
    this.list.push(e);
    if (this.list.length > this.max) this.list.shift();
    try { Store.set('thegoodparts.crash', this.text('Crash')); } catch (x) { /* storage is best effort */ }
    if (typeof console !== 'undefined') console.error(err);
    if (this.onReport) { try { this.onReport(e); } catch (x) { /* never let the reporter break the game */ } }
    return e;
  },

  // Everything a bug report needs, in plain text.
  text(heading = 'Report') {
    const nav = typeof navigator !== 'undefined' ? navigator : {};
    const scr = typeof screen !== 'undefined' ? screen : {};
    const G = typeof Game !== 'undefined' ? Game : null;
    const lines = [
      `${BUILD.name} ${BUILD.version}: ${heading}`,
      `when: ${new Date().toISOString()}   session: ${Math.round(Telemetry.now())}s`,
      `browser: ${nav.userAgent || 'n/a'}`,
      `screen: ${scr.width || '?'}x${scr.height || '?'} @${typeof devicePixelRatio !== 'undefined' ? devicePixelRatio : '?'}x   game scale: ${typeof Engine !== 'undefined' ? Engine.scale.toFixed(2) : '?'}`,
      `graphics: ${this.gpu || 'unknown'}`,
      `in a frame: ${typeof window !== 'undefined' && window.top !== window.self ? 'yes' : 'no'}   storage: ${Store.persistent ? 'works' : 'blocked'}   audio: ${typeof AudioSys !== 'undefined' && AudioSys.ctx ? AudioSys.ctx.state : 'not started'}`,
      G ? `game: scene ${typeof Engine !== 'undefined' ? Engine.sceneName : '?'}, stage ${G.stage}, tokens ${G.tokens}, bag ${G.inventory.length}, party ${G.party.length}, play ${Math.round(G.playTime || 0)}s, won ${!!G.won}` : 'game: not started',
      typeof Settings !== 'undefined' ? `settings: ${JSON.stringify(Object.assign({}, Settings.v, { keys: undefined }))}` : '',
      '',
    ];
    if (this.list.length) {
      lines.push('errors this session:');
      for (const e of this.list) lines.push(`  x${e.count} [${e.where}] ${e.msg}`, ...e.stack.split('\n').slice(1, 4).map((s) => '      ' + s.trim()));
      lines.push('');
    } else lines.push('errors this session: none', '');
    if (this.previous) lines.push('left behind by the previous session:', ...String(this.previous).split('\n').slice(0, 14).map((s) => '  ' + s), '');
    lines.push('last events:', ...Telemetry.events.slice(-14).map((e) => `  ${e.t}s ${e.type} ${Object.entries(e).filter(([k]) => k !== 't' && k !== 'type').map(([k, v]) => k + '=' + v).join(' ')}`));
    return lines.join('\n');
  },

  // a prefilled GitHub issue, kept under URL length limits
  issueUrl() {
    const body = this.text('Bug report').slice(0, 3500);
    return BUILD.issues + '?title=' + encodeURIComponent(`Bug: ${this.list.length ? this.list[this.list.length - 1].msg.slice(0, 70) : 'describe what happened'}`) + '&body=' + encodeURIComponent('**What happened?**\n\n\n<details><summary>Debug info</summary>\n\n```\n' + body + '\n```\n</details>');
  },
};

// ==== 40_telemetry.js ====
// ---------------------------------------------------------------------------
// TELEMETRY — lightweight playtest log. Watch someone play, then press P (or
// the report button in the debug panel) to see what they actually did:
// grab odds, slips, "one more try" retries, time per scene, battles.
// ---------------------------------------------------------------------------
const Telemetry = {
  t0: (typeof performance !== 'undefined' ? performance.now() : 0),
  events: [],
  sceneTime: {},
  cur: null, curT: 0,
  c: {
    grabs: 0, wins: 0, slips: 0, misses: 0, doubles: 0, freebies: 0, nearMiss: 0, sets: 0, homecomings: 0, speedToggles: 0, fastSecs: 0,
    gripSolid: 0, gripOk: 0, gripLoose: 0, clipped: 0, slipping: 0, saves: 0, // the soul grip's catches (and closes that only clipped a part), strained carries that slid vs held on
    retryFast: 0, retrySlow: 0, quitAfterFail: 0,
    bySlipWhy: {}, wonRarity: { common: 0, uncommon: 0, rare: 0, legendary: 0 },
    creatures: 0, unstitched: 0, battles: 0, victories: 0, defeats: 0, retreats: 0, zaps: 0,
    bestStage: 0, pity: 0, tokensSpent: 0,
    // the Rig (docs/RNG_LAYER.md)
    luckEarned: 0, luckSpent: 0, luckWasted: 0, luckBy: {},
    quakes: 0, nudges: 0, tilts: 0, irons: 0, ironDisarmed: 0, orders: 0, redos: 0,
    riggedGrabs: 0, riggedWins: 0, plainGrabs: 0, plainWins: 0, ironGrabs: 0, ironWins: 0,
  },
  curRigged: false, curIron: false,
  lastFailT: null,
  now() { return ((typeof performance !== 'undefined' ? performance.now() : 0) - this.t0) / 1000; },
  log(type, data) {
    const e = { t: +this.now().toFixed(1), type };
    if (data) Object.assign(e, data);
    this.events.push(e);
    if (this.events.length > 800) this.events.shift();
  },
  scene(name) {
    const n = this.now();
    if (this.cur) this.sceneTime[this.cur] = (this.sceneTime[this.cur] || 0) + (n - this.curT);
    // leaving the claw right after a failed grab (with tokens left) = frustration signal
    if (this.cur === 'claw' && this.lastFailT != null && n - this.lastFailT < 4 && typeof Game !== 'undefined' && Game.tokens > 0) this.c.quitAfterFail++;
    this.cur = name; this.curT = n;
    this.log('scene', { name });
  },
  // rigged: a lever was used since the last drop. iron: this drop has Iron Grip.
  grabStart(rigged, iron) {
    const n = this.now();
    this.curRigged = !!rigged; this.curIron = !!iron;
    if (iron) this.c.ironGrabs++;
    if (rigged || iron) this.c.riggedGrabs++; else this.c.plainGrabs++;
    this.c.grabs++;
    this.c.tokensSpent++;
    if (this.lastFailT != null) {
      if (n - this.lastFailT < 6) this.c.retryFast++; else this.c.retrySlow++;
    }
    this.lastFailT = null;
    this.log('grab');
  },
  grabEnd(result, won) {
    if (result === 'win') {
      this.c.wins++; if (won.length > 1) this.c.doubles++;
      if (this.curIron) this.c.ironWins++;
      if (this.curRigged || this.curIron) this.c.riggedWins++; else this.c.plainWins++;
    }
    else if (result === 'slip') this.c.slips++;
    else this.c.misses++;
    if (result !== 'win') this.lastFailT = this.now();
    this.log('grabEnd', { result, parts: won.map((p) => p.type).join(',') });
  },
  report() {
    const c = this.c;
    const st = Object.assign({}, this.sceneTime);
    if (this.cur) st[this.cur] = (st[this.cur] || 0) + (this.now() - this.curT);
    const pct = (a, b) => (b ? Math.round((100 * a) / b) + '%' : '-');
    const fails = c.slips + c.misses;
    const lines = [
      'THE GOOD PARTS — playtest report',
      `session ${Math.round(this.now() / 60)} min ${Math.round(this.now() % 60)} s`,
      '',
      `grabs ${c.grabs}   wins ${c.wins} (${pct(c.wins, c.grabs)})   slips ${c.slips}   misses ${c.misses}   doubles ${c.doubles}   free chute drops ${c.freebies}`,
      `won by rarity: ${Object.entries(c.wonRarity).map(([k, v]) => k + ' ' + v).join(', ')}`,
      `near misses (slipped within a claw-length of the chute): ${c.nearMiss}`,
      `grip when it closed: solid ${c.gripSolid}, ok ${c.gripOk}, loose ${c.gripLoose}, only clipped a part ${c.clipped}   carries that started slipping ${c.slipping}, held on ${c.saves}`,
      `slip causes: ${Object.entries(c.bySlipWhy).map(([k, v]) => k + ' ' + v).join(', ') || '-'}`,
      `after a failed grab: retried within 6s ${c.retryFast}, retried later ${c.retrySlow}, left the machine ${c.quitAfterFail}   (one-more-try rate ${pct(c.retryFast, fails)})`,
      `creatures stitched ${c.creatures}   unstitched ${c.unstitched}   sets completed ${c.sets}   remains won back ${c.homecomings}`,
      `battles ${c.battles}   won ${c.victories}   lost ${c.defeats}   retreats ${c.retreats}   zaps used ${c.zaps}   speed toggles ${c.speedToggles}   seconds at x2 ${Math.round(c.fastSecs)}   best stage ${c.bestStage}`,
      `pity tokens given ${c.pity}`,
      `THE RIG: luck earned ${c.luckEarned} (${Object.entries(c.luckBy).map(([k, v]) => k + ' ' + v).join(', ') || '-'})  spent ${c.luckSpent}  wasted at cap ${c.luckWasted}`,
      `  levers: quakes ${c.quakes}  nudges ${c.nudges}  tilts ${c.tilts}  iron grips ${c.irons} (taken back ${c.ironDisarmed})  orders ${c.orders}  redos ${c.redos}`,
      `  grabs after a lever: ${c.riggedGrabs} (wins ${pct(c.riggedWins, c.riggedGrabs)})   plain grabs: ${c.plainGrabs} (wins ${pct(c.plainWins, c.plainGrabs)})   iron grabs: ${c.ironGrabs} (wins ${pct(c.ironWins, c.ironGrabs)})`,
      `time: ${Object.entries(st).map(([k, v]) => k + ' ' + Math.round(v) + 's').join(', ')}`,
      '',
      'last events:',
      ...this.events.slice(-40).map((e) => `  ${e.t}s ${e.type} ${Object.entries(e).filter(([k]) => k !== 't' && k !== 'type').map(([k, v]) => k + '=' + v).join(' ')}`),
    ];
    return lines.join('\n');
  },
};

// ==== 42_dom.js ====
// ---------------------------------------------------------------------------
// DOM — the parts of the game that live outside the canvas. Only loaded in a real page (tools/test.mjs skips
// it), and nothing else depends on it: every caller checks `typeof Platform` / `typeof Announce` first.
//
//   Platform   fullscreen, clipboard and links, each written to fail quietly inside a sandboxed frame
//   Announce   an aria-live region so a screen reader hears the Reaper and the menus
//   crash toast, error hooks, save-on-hide, auto-pause when the tab is hidden, the on-page Menu button
// ---------------------------------------------------------------------------
const Platform = {
  fullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (err) { /* not allowed here (a frame without allow=fullscreen): fine */ }
  },
  // cb(true) if it landed on the clipboard. When the clipboard is blocked, show the text selected instead.
  copy(text, cb) {
    const fallback = () => {
      let ta = document.getElementById('copybox');
      if (!ta) {
        ta = document.createElement('textarea');
        ta.id = 'copybox'; ta.readOnly = true; ta.setAttribute('aria-label', 'Debug info: select all and copy');
        document.body.appendChild(ta);
        ta.addEventListener('blur', () => ta.classList.remove('open'));
      }
      ta.value = text; ta.classList.add('open'); ta.focus(); ta.select();
      cb && cb(false);
    };
    try { navigator.clipboard.writeText(text).then(() => cb && cb(true), fallback); } catch (err) { fallback(); }
  },
  open(url) {
    try { const w = window.open(url, '_blank', 'noopener'); if (w) return; } catch (err) { /* blocked */ }
    Platform.copy(url, () => Overlays.toast('Could not open a tab. The link is on your clipboard.'));
  },
};

const Announce = {
  el: null,
  say(text) {
    if (!this.el) this.el = document.getElementById('sr');
    if (!this.el || !text) return;
    this.el.textContent = ''; // clearing first makes a repeated line get read again
    setTimeout(() => { if (this.el) this.el.textContent = text; }, 30);
  },
};

(function domLayer() {
  if (typeof document === 'undefined') return;

  // ---- a graphics card string for bug reports (what ran it, on which machine)
  try {
    const c = document.createElement('canvas'), gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
    CrashLog.gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl ? 'webgl (renderer hidden)' : 'no webgl';
  } catch (e) { CrashLog.gpu = 'unknown'; }

  // ---- the crash toast: small, dismissable, never blocks play
  let toast = null;
  CrashLog.onReport = (e) => {
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'crash'; toast.setAttribute('role', 'alert');
      toast.innerHTML = '<b>Something broke.</b> <span data-msg></span> The game is still running. <button data-a="copy">Copy report</button> <button data-a="issue">Report on GitHub</button> <button data-a="x" aria-label="Dismiss">×</button>';
      document.body.appendChild(toast);
      toast.addEventListener('click', (ev) => {
        const a = ev.target.dataset && ev.target.dataset.a;
        if (a === 'x') toast.classList.remove('open');
        if (a === 'copy') Platform.copy(CrashLog.text('Crash report'), (ok) => { ev.target.textContent = ok ? 'Copied' : 'Select and copy'; });
        if (a === 'issue') Platform.open(CrashLog.issueUrl());
      });
    }
    toast.querySelector('[data-msg]').textContent = '(' + e.msg.slice(0, 80) + ')';
    toast.classList.add('open');
  };
  window.addEventListener('error', (ev) => CrashLog.report(ev.error || ev.message, 'window'));
  window.addEventListener('unhandledrejection', (ev) => CrashLog.report(ev.reason, 'promise'));

  // ---- the run survives a closed tab, a refresh, a crash: save whenever the page is about to go away
  const flush = () => { try { Save.flush(); } catch (e) { /* nothing more to do */ } };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    flush();
    // a hidden tab pauses the game for you: come back to the pause menu, not to a fight that kept going
    if (typeof Engine !== 'undefined' && Engine.scene && !Engine.overlays.length && Engine.scene.pausable !== false && Engine.sceneName !== 'shop') Overlays.pause();
  });

  // ---- the on-page Menu button: the only way to pause on a phone
  const btn = document.getElementById('menuBtn');
  if (btn) btn.addEventListener('click', () => {
    try {
      if (typeof Engine === 'undefined' || !Engine.scene) return;
      if (Engine.overlays.length) { const t = Engine.top; if (t && t.pausePanel) Engine.close(); else if (Input.capture) { Input.capture = null; } return; }
      if (Engine.scene.pausable !== false && !Engine.trans) Overlays.pause();
    } finally {
      btn.blur(); // a focused button would eat the Space key that drops the claw
      const c = document.getElementById('game'); if (c) c.focus({ preventScroll: true });
    }
  });

  // ---- the hint line under the canvas follows the player's own keys
  window.refreshHint = () => {
    const el = document.getElementById('hint');
    if (!el) return;
    const k = (a) => `<kbd>${Settings.hint(a)}</kbd>`;
    const rig = typeof Rig !== 'undefined' && Rig.on ? ` · ${k('nudgeL')} ${k('nudgeR')} nudge · ${k('quake')} ${k('grip')} ${k('order')} ${k('redo')} the Rig` : '';
    el.innerHTML = `Click the game once so it gets your keys. ${k('left')} ${k('right')} steer · ${k('a')} drop${rig} · ${k('pause')} pause · ${k('mute')} mute · ${k('fullscreen')} fullscreen. Mouse and touch work too: hold on the glass to steer.`;
  };
})();

// ==== 99_main.js ====
// ---------------------------------------------------------------------------
// BOOT — load the save, build the world, show the title. In a dev build (dev.html) the URL can also jump
// straight in: ?scene=claw|slab|battle|shop, ?seed=123 for a fixed pile, ?parts=1, ?party=1, ?tokens=30,
// ?luck=8 sets Luck, ?rig=0 turns the Rig (the claw's RNG levers) off for A/B playtests.
// Those flags, the tuning panel and window.__game do not exist in the page players get (BUILD.dev is false).
// ---------------------------------------------------------------------------
(function boot() {
  const start = () => {
    const Q = new URLSearchParams(location.search);
    const dev = BUILD.dev;
    if (dev && Q.get('seed')) RNG = mulberry32(+Q.get('seed'));
    if (dev && Q.get('rig') === '0') CONFIG.rigOn = CONFIG_DEFAULTS.rigOn = 0; // the original claw (also survives the tuning panel's Reset)
    Save.load();
    CrashLog.init();
    Engine.init();
    Settings.apply();
    if (dev) Debug.build();
    if (BG.prebuild) BG.prebuild();
    Game.newGame();
    for (const k in Scenes) Engine.add(k, Scenes[k]);
    let first = null;
    if (dev) {
      if (Q.get('parts')) for (const t of ['skull', 'ribcage', 'bonearm', 'fleshArm', 'boneleg', 'goatleg', 'heart', 'wolfskull', 'tentacle', 'wings', 'ogrearm', 'pegleg']) Game.addPart(t);
      if (Q.get('party')) {
        Game.party.push(new Creature({ head: 'skull', torso: 'ribcage', armL: 'swordarm', armR: 'bonearm', legL: 'boneleg', legR: 'boneleg', heart: 'heart' }));
        Game.party.push(new Creature({ head: 'wolfskull', torso: 'ogregut', armL: 'ogrearm', armR: 'clawarm', legL: 'goatleg', legR: 'pegleg' }));
      }
      if (Q.get('tokens')) Game.tokens = +Q.get('tokens');
      if (Q.get('stage')) Game.stage = +Q.get('stage');
      if (Q.get('luck')) Rig.luck = clamp(+Q.get('luck') || 0, 0, CONFIG.luckMax);
      first = Q.get('scene');
      Save.enabled = !Q.get('nosave') && !first; // a jump-in URL must never overwrite a real save
      Save.runActive = Save.enabled && false; // a dev page still has to choose a run like anyone else
    }
    Engine.go(first && Scenes[first] ? first : 'shop', { skipIntro: !!first }, 'cut');
    if (!first) Overlays.title();
    const boot = document.getElementById('boot');
    if (boot) boot.remove();
    if (window.refreshHint) window.refreshHint();
    requestAnimationFrame((n) => Engine.loop(n));
    if (dev) window.__game = { Game, Engine, CONFIG, Scenes, Telemetry, Input, Save, Settings, Overlays, CrashLog, BUILD, Rig };
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
