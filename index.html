const SLOT_NAMES = { head: 'Head', torso: 'Torso', arm: 'Arm', leg: 'Leg', heart: 'Heart', back: 'Back' };
// creature layout: which slot keys exist and what part slot they take
const RIG_SLOTS = [
  ['head', 'head'], ['torso', 'torso'], ['armL', 'arm'], ['armR', 'arm'],
  ['legL', 'leg'], ['legR', 'leg'], ['heart', 'heart'], ['back', 'back'],
];
const RIG_SLOT_LABEL = { head: 'Head', torso: 'Torso', armL: 'Left Arm', armR: 'Right Arm', legL: 'Left Leg', legR: 'Right Leg', heart: 'Heart', back: 'Back' };

const RARITY_WEIGHT = { common: 60, uncommon: 26, rare: 11, legendary: 3 };

function randomPartType(opts = {}) {
  const boost = CONFIG.rareBoost * (opts.boost || 1);
  const w = [
    ['common', RARITY_WEIGHT.common],
    ['uncommon', RARITY_WEIGHT.uncommon * Math.sqrt(boost)],
    ['rare', RARITY_WEIGHT.rare * boost],
    ['legendary', RARITY_WEIGHT.legendary * boost],
  ];
  const bySlot = Object.keys(PART_DEFS).filter((k) => !opts.slot || PART_DEFS[k].slot === opts.slot);
  // only roll among rarities this slot actually has (there's no legendary torso, no common back part...)
  const avail = w.filter(([r]) => bySlot.some((k) => PART_DEFS[k].rarity === r));
  let rarity = opts.rarity && avail.some(([r]) => r === opts.rarity) ? opts.rarity : weightedPick(avail);
  const pool = bySlot.filter((k) => PART_DEFS[k].rarity === rarity);
  return pool.length ? pick(pool) : pick(bySlot);
}

let _partUid = 1;
function makePartItem(type) { return { uid: _partUid++, type }; }

// ==== 11_clawsim.js ====
// ---------------------------------------------------------------------------
// CLAW SIM — planck.js physics for the machine: walls, chute, pile, claw rig
// and the grab state machine. No rendering here; it emits events for juice.
// Headless-safe: tools/tune.mjs runs this in Node to measure grab odds.
// Coordinates are claw-scene pixels (y down); physics uses meters (PPM).
// ---------------------------------------------------------------------------
const PPM = 16;
const CAT = { WALL: 1, PART: 2, CLAW: 4 };
const MACHINE = {
  // world units are art pixels; the claw scene draws this world at 2x zoom
  left: 0, right: 180, top: 0, floor: 120, bottom: 132,
  guardX: 141, guardW: 3, lipY: 76, // acrylic guard in front of the chute
  chuteX0: 144, chuteX1: 180, // prize chute (open bottom)
  railY: 8, carMin: 14, carMax: 166, home: 162,
  topLen: 6, maxLen: 86,
  spawnX0: 8, spawnX1: 134,
};
const HULLS = {};
const getHull = (name) => HULLS[name] || (HULLS[name] = SPR.hull(name, 8, 0.45));

class ClawSim {
  constructor(opts = {}) {
    this.onEvent = opts.onEvent || (() => {});
    this.parts = [];
    this.pending = [];
    this.held = new Set();
    this.time = 0;
    this.acc = 0;
    this.pendingT = 0;
    this.input = { move: 0 };
    this.pressed = false;
    this.turn = null;
    this.turnCount = 0;
    this.grips = [];
    // The Rig (12_clawrig.js): drop lock, chute lid, active quake, armed Iron Grip, turn recording for REDO
    this.lockT = 0; this.lockWhy = null;
    this.sealAge = 0; this.lid = null;
    this.quakeS = null; this.settleS = null;
    this.iron = false;
    this.hist = null; this.redoHist = null; this.rw = null;
    this.build();
  }

  emit(type, data) { this.onEvent(type, data || {}); }

  build() {
    const pl = planck, V = pl.Vec2, M = MACHINE;
    const w = (this.world = new pl.World({ gravity: V(0, CONFIG.gravity) }));
    this.ground = w.createBody();
    const box = (x0, y0, x1, y1, fr = 0.5) => {
      this.ground.createFixture(
        pl.Box((x1 - x0) / 2 / PPM, (y1 - y0) / 2 / PPM, V((x0 + x1) / 2 / PPM, (y0 + y1) / 2 / PPM), 0),
        { friction: fr, filterCategoryBits: CAT.WALL });
    };
    box(M.left - 30, -60, M.left, M.bottom + 60); // left wall
    box(M.right, -60, M.right + 30, M.bottom + 60); // right wall
    box(M.left, M.floor, M.guardX + M.guardW, M.floor + 30, 0.7); // pile floor (ends at the chute)
    box(M.guardX, M.lipY, M.guardX + M.guardW, M.floor, 0.3); // acrylic guard
    box(M.left - 30, -40, M.right + 30, M.top); // glass ceiling

    // collision sound bookkeeping
    this.impacts = new Map();
    w.on('post-solve', (contact, impulse) => {
      const a = contact.getFixtureA().getBody(), b = contact.getFixtureB().getBody();
      const ni = impulse.normalImpulses[0] || 0;
      if (ni < 0.25) return;
      for (const body of [a, b]) {
        const ud = body.getUserData();
        if (!ud) continue;
        const other = body === a ? b : a;
        const prev = this.impacts.get(ud);
        const claw = other.getUserData() === 'claw' || (ud === 'claw');
        if (!prev || prev.imp < ni) this.impacts.set(ud, { imp: ni, body, claw });
      }
    });

    this.buildClaw(M.home);
  }

  buildClaw(x) {
    const pl = planck, V = pl.Vec2, M = MACHINE, G = CLAW_GEO, w = this.world;
    this.carX = x; this.carV = 0;
    this.carriage = w.createBody({ type: 'kinematic', position: V(x / PPM, M.railY / PPM) });
    const hubY = M.railY + M.topLen + G.hubH / 2;
    this.hub = w.createBody({ type: 'dynamic', position: V(x / PPM, hubY / PPM), angularDamping: 5, linearDamping: CONFIG.swayDamping });
    const area = (G.hubW * G.hubH) / (PPM * PPM);
    const clawFix = (density, friction) => ({ density, friction, filterCategoryBits: CAT.CLAW, filterMaskBits: CAT.WALL | CAT.PART, filterGroupIndex: -1 });
    this.hub.createFixture(pl.Box(G.hubW / 2 / PPM, G.hubH / 2 / PPM), clawFix(CONFIG.hubMass / area, 0.4));
    this.hub.setUserData('claw');
    this.rope = w.createJoint(pl.RopeJoint({ maxLength: M.topLen / PPM, localAnchorA: V(0, 0), localAnchorB: V(0, -G.hubH / 2 / PPM) }, this.carriage, this.hub));
    this.ropeLen = M.topLen;
    const mk = (side) => {
      const piv = side < 0 ? G.pivotL : G.pivotR;
      const pos = V((x + piv[0]) / PPM, (hubY + piv[1]) / PPM);
      const b = w.createBody({ type: 'dynamic', position: pos, angularDamping: 2 });
      for (const poly of G.prong) {
        b.createFixture(pl.Polygon(poly.map(([px, py]) => V((side < 0 ? px : -px) / PPM, py / PPM))), clawFix(2, CONFIG.prongFriction));
      }
      b.setUserData('claw');
      const j = w.createJoint(pl.RevoluteJoint({
        enableLimit: true,
        lowerAngle: side < 0 ? -0.1 : -0.85,
        upperAngle: side < 0 ? 0.85 : 0.1,
        enableMotor: true, maxMotorTorque: 60, motorSpeed: 0,
      }, this.hub, b, pos));
      return [b, j];
    };
    [this.prongL, this.jL] = mk(-1);
    [this.prongR, this.jR] = mk(1);
    // motors and rope changes don't wake sleeping bodies, so the rig never sleeps
    for (const b of [this.carriage, this.hub, this.prongL, this.prongR]) b.setSleepingAllowed(false);
    this.state = 'idle';
    this.stateT = 0;
  }

  // Move the whole claw instantly (tuner / debug)
  teleportClaw(x) {
    const V = planck.Vec2, M = MACHINE, G = CLAW_GEO;
    const dx = (x - this.carX) / PPM;
    for (const b of [this.carriage, this.hub, this.prongL, this.prongR]) {
      const p = b.getPosition();
      b.setTransform(V(p.x + dx, p.y), b.getAngle());
      b.setLinearVelocity(V(0, 0));
      b.setAngularVelocity(0);
    }
    this.carX = x; this.carV = 0;
  }

  // ------------------------------------------------------------ parts
  spawnPart(type, x, y, angle = 0, vel) {
    const pl = planck, V = pl.Vec2, def = PART_DEFS[type];
    const part = { uid: _partUid++, type, def, bodies: [], won: false, removed: false, liftY0: 0, bornT: this.time, glowT: RNG() * 10 };
    const fix = {
      density: (def.density || 1) * CONFIG.partDensity,
      friction: CONFIG.partFriction * (def.mat === 'squish' ? 0.55 : 1),
      restitution: def.restitution != null ? def.restitution : CONFIG.partRestitution,
      filterCategoryBits: CAT.PART, filterMaskBits: CAT.WALL | CAT.PART | CAT.CLAW,
    };
    if (def.chain) {
      const n = def.chain, seg = 4.6;
      let prev = null;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      for (let i = 0; i < n; i++) {
        const off = (i - (n - 1) / 2) * seg;
        const bx = x + ca * off, by = y + sa * off;
        const b = this.world.createBody({ type: 'dynamic', position: V(bx / PPM, by / PPM), angle, angularDamping: 0.6, linearDamping: 0.05 });
        b.createFixture(pl.Circle((i === n - 1 ? 2.1 : 2.8) / PPM), fix);
        b.setUserData(part);
        if (prev) {
          this.world.createJoint(pl.RevoluteJoint({ enableLimit: true, lowerAngle: -0.75, upperAngle: 0.75 }, prev, b,
            V((bx - (ca * seg) / 2) / PPM, (by - (sa * seg) / 2) / PPM)));
        }
        part.bodies.push(b);
        prev = b;
      }
    } else {
      const b = this.world.createBody({ type: 'dynamic', position: V(x / PPM, y / PPM), angle, angularDamping: 0.4, linearDamping: 0.05 });
      if (def.shape === 'circle') {
        const s = SPR.get(def.sprite);
        b.createFixture(pl.Circle((Math.min(s.w, s.h) / 2 - 0.4) / PPM), fix);
      } else {
        b.createFixture(pl.Polygon(getHull(def.sprite).map(([hx, hy]) => V(hx / PPM, hy / PPM))), fix);
      }
      b.setUserData(part);
      part.bodies.push(b);
    }
    part.body = part.bodies[Math.floor(part.bodies.length / 2)];
    if (vel) for (const b of part.bodies) b.setLinearVelocity(V(vel[0] / PPM, vel[1] / PPM));
    this.parts.push(part);
    return part;
  }

  removePart(p) {
    if (p.removed) return;
    p.removed = true;
    this.grips = this.grips.filter((g) => { if (g.part === p) { this.world.destroyJoint(g.joint); return false; } return true; });
    for (const b of p.bodies) this.world.destroyBody(b);
    this.held.delete(p);
    this.parts = this.parts.filter((q) => q !== p);
  }

  clearParts() { for (const p of this.parts.slice()) this.removePart(p); this.hist = null; this.redoHist = null; }

  partPos(p) { const q = p.body.getPosition(); return [q.x * PPM, q.y * PPM]; }

  // Fresh pile: guarantees one legendary, a couple of rares and every slot represented.
  fillPile(n = CONFIG.partCount) {
    const M = MACHINE;
    const types = [randomPartType({ rarity: 'legendary' }), randomPartType({ rarity: 'rare' }), randomPartType({ rarity: 'rare' })];
    const need = { head: 3, torso: 3, arm: 4, leg: 4, heart: 1 };
    for (const slot in need) for (let i = 0; i < need[slot]; i++) types.push(randomPartType({ slot, rarity: i === 0 ? 'common' : undefined }));
    while (types.length < n) types.push(randomPartType());
    shuffle(types);
    const cols = 5, cw = (M.spawnX1 - M.spawnX0) / cols;
    types.slice(0, Math.max(n, 5)).forEach((t, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      this.spawnPart(t, M.spawnX0 + cw * (col + 0.5) + rand(-3, 3), M.floor - 14 - row * 23 + rand(-2, 2), rand(-Math.PI, Math.PI));
    });
    this.settle(4.5);
    // anything that bounced into the chute goes back on top of the pile
    for (const p of this.parts.slice()) {
      const [x] = this.partPos(p);
      if (x > M.guardX - 2 || p.won) {
        const t = p.type;
        this.removePart(p);
        this.spawnPart(t, rand(M.spawnX0, 100), 20, rand(-3, 3));
      }
    }
    this.settle(1.5);
    for (const p of this.parts) p.won = false;
  }

  settle(seconds) {
    const h = 1 / 60;
    this.settling = true;
    for (let t = 0; t < seconds; t += h) { this.world.step(h, 8, 4); }
    this.settling = false;
    this.impacts.clear();
    for (const p of this.parts) if (!p.won) { const [x, y] = this.partPos(p); if (x > MACHINE.chuteX0 && y > MACHINE.lipY) p.won = true; }
  }

  queueSpawn(type, delay = 0) { this.pending.push({ type, t: delay }); }

  // ------------------------------------------------------------ control
  press() { this.pressed = true; }

  startDrop() {
    if (this.state !== 'idle' || this.lockT > 0) return false;
    this.unseal(); // a carried part would collide with the chute lid
    this.setState('drop');
    this.turn = { won: [], grabbed: new Set(), slips: 0, startT: this.time, n: ++this.turnCount, iron: this.iron };
    this.iron = false; // Iron Grip lasts for exactly one drop
    this.landed = false;
    this.slackT = 0;
    this.beginRecord();
    this.emit('drop', { iron: this.turn.iron });
    return true;
  }

  setState(s) {
    this.state = s;
    this.stateT = 0;
    if (s === 'lift') for (const p of this.parts) p.liftY0 = p.body.getPosition().y * PPM;
  }

  ropeDist() {
    const a = this.carriage.getPosition();
    const b = this.hub.getWorldPoint(planck.Vec2(0, -CLAW_GEO.hubH / 2 / PPM));
    return Math.hypot(b.x - a.x, b.y - a.y) * PPM;
  }

  driveCarriage(target, h) {
    const M = MACHINE;
    this.carV = approach(this.carV, target, CONFIG.clawAccel * h);
    let nx = this.carX + this.carV * h;
    if (nx < M.carMin) { nx = M.carMin; this.carV = 0; }
    if (nx > M.carMax) { nx = M.carMax; this.carV = 0; }
    this.carriage.setLinearVelocity(planck.Vec2((nx - this.carX) / h / PPM, 0));
    this.carX = nx;
  }

  prongs(mode, fade = 0) {
    let torque, sL, sR;
    if (mode === 'open') { sL = 5; sR = -5; torque = 120; }
    else if (mode === 'close') {
      // full power while closing, then the machine "cuts the voltage" to the hold torque
      sL = -CONFIG.closeSpeed; sR = CONFIG.closeSpeed;
      torque = lerp(CONFIG.closeTorque, CONFIG.gripTorque, clamp(fade, 0, 1));
    }
    else { // relax: servo to half-open
      const k = 5;
      sL = clamp(k * (0.3 - this.jL.getJointAngle()), -3, 3);
      sR = clamp(k * (-0.3 - this.jR.getJointAngle()), -3, 3);
      torque = 40;
    }
    this.jL.setMotorSpeed(sL); this.jR.setMotorSpeed(sR);
    this.jL.setMaxMotorTorque(torque); this.jR.setMaxMotorTorque(torque);
  }

  step(dt) {
    this.acc = Math.min(this.acc + dt, 0.1);
    const h = 1 / 120;
    while (this.acc >= h) { this.fixedStep(h); this.acc -= h; }
  }

  fixedStep(h) {
    const M = MACHINE;
    this.time += h;
    this.stateT += h;
    if (this.state === 'rewind') { this.pressed = false; this.rewindStep(h); return; } // time runs backwards: no physics
    this.world.setGravity(planck.Vec2(0, CONFIG.gravity));
    this.hub.setLinearDamping(CONFIG.swayDamping);
    const pressed = this.pressed;
    this.pressed = false;
    if (this.lockT > 0) {
      this.lockT -= h;
      if (this.lockT <= 0) { const why = this.lockWhy; this.lockT = 0; this.lockWhy = null; this.emit('unlock', { why }); }
    }
    const move = this.lockWhy === 'tilt' ? 0 : clamp(this.input.move || 0, -1, 1); // TILT freezes the carriage

    switch (this.state) {
      case 'idle':
        this.prongs('relax');
        this.driveCarriage(move * CONFIG.clawMoveSpeed, h);
        this.ropeLen = approach(this.ropeLen, M.topLen, CONFIG.liftSpeed * h);
        if (CONFIG.aimTime > 0 && this.aimActive && this.stateT > CONFIG.aimTime) this.emit('aimTimeout');
        break;
      case 'drop': {
        this.prongs('open');
        this.driveCarriage(0, h);
        const vy = this.hub.getLinearVelocity().y * PPM;
        const dist = this.ropeDist();
        // pay out cable, but never more than a few px of slack: the head falls at <= dropSpeed
        this.ropeLen = Math.min(M.maxLen, this.ropeLen + CONFIG.dropSpeed * h, dist + 4);
        this.dropVmax = Math.max(this.dropVmax || 0, vy);
        const slack = this.ropeLen - dist;
        this.slackT = this.stateT > 0.22 && slack > 2 && vy < 25 ? this.slackT + h : 0;
        if (this.slackT > 0.03 || this.ropeLen >= M.maxLen || (pressed && this.stateT > 0.1)) {
          this.landed = this.slackT > 0.03;
          if (this.landed) this.emit('land', { intensity: clamp(this.dropVmax / 140, 0.2, 1), x: this.hub.getPosition().x * PPM, y: this.hub.getPosition().y * PPM });
          this.dropVmax = 0;
          // slippery prongs while closing so they slide into the gaps of the pile
          this.setProngFriction(CONFIG.closeFriction);
          this.setState('close');
          this.emit('close');
        }
        break;
      }
      case 'close': {
        this.prongs('close');
        this.driveCarriage(0, h);
        // cable stays a little slack: the claw settles into the pile as it closes
        this.ropeLen = Math.min(M.maxLen, Math.max(this.ropeLen, this.ropeDist() + 2));
        if (this.stateT > CONFIG.closeTime) {
          this.setProngFriction(CONFIG.prongFriction);
          this.setState('lift');
          this.tryGrab();
          this.emit('lift', { grips: this.grips.map((g) => g.part) });
        }
        break;
      }
      case 'lift': {
        this.prongs('close', CONFIG.gripFade > 0 ? this.stateT / CONFIG.gripFade : 1);
        this.updateGrips(h);
        this.driveCarriage(0, h);
        const d = this.ropeDist();
        if (this.ropeLen > d + 1) this.ropeLen = d + 1;
        // winch spins up smoothly (an instant yank would rip parts out of the grip)
        const spin = easeInOutQuad(clamp(this.stateT / 0.45, 0, 1));
        this.ropeLen = Math.max(M.topLen, this.ropeLen - CONFIG.liftSpeed * spin * h);
        if (this.ropeLen <= M.topLen + 0.01 && this.stateT > 0.2) {
          for (const g of this.grips.slice()) this.rollSlip(g.part, CONFIG.topSlip, 'jolt');
          this.setState(CONFIG.carryManual ? 'carry' : 'return');
          this.emit('top', { held: [...this.held] });
        }
        break;
      }
      case 'carry':
        this.prongs('close', 1);
        this.updateGrips(h);
        this.driveCarriage(move * CONFIG.clawMoveSpeed, h);
        if (pressed || (CONFIG.carryTime > 0 && this.stateT > CONFIG.carryTime)) this.startRelease();
        break;
      case 'return': {
        this.prongs('close', 1);
        this.updateGrips(h);
        const d = M.home - this.carX;
        const vmax = Math.sqrt(2 * CONFIG.clawAccel * Math.abs(d));
        this.driveCarriage(Math.sign(d) * Math.min(CONFIG.clawMoveSpeed, vmax), h);
        if (Math.abs(d) < 0.6 && Math.abs(this.carV) < 6 && this.stateT > 0.3) this.startRelease();
        break;
      }
      case 'release':
        this.prongs('open');
        this.driveCarriage(0, h);
        if (this.stateT > 1.1) this.endTurn();
        break;
    }
    this.rope.setMaxLength(this.ropeLen / PPM);
    // keep the claw head roughly upright (real claws hang from a stiff cable mount)
    if (CONFIG.clawStiffness > 0) {
      const a = this.hub.getAngle(), w = this.hub.getAngularVelocity();
      this.hub.applyTorque(-CONFIG.clawStiffness * a - CONFIG.clawStiffness * 0.18 * w, true);
    }

    // living parts twitch
    if (!this.settling && CONFIG.twitchRate > 0 && RNG() < CONFIG.twitchRate * h) this.twitch();

    // restock queue
    if (this.pending.length) {
      this.pendingT -= h;
      if (this.pendingT <= 0) {
        const it = this.pending.shift();
        const p = this.spawnPart(it.type, rand(M.spawnX0 + 6, M.spawnX1 - 20), M.top + 12, rand(-3, 3), [rand(-10, 10), 20]);
        this.emit('spawn', { part: p });
        this.pendingT = 0.28;
        this.redoHist = null; // the world gained a part: a rewind would put it somewhere wrong
        if (this.hist) this.hist.tainted = true;
      }
    }

    if (this.quakeS) this.quakeStep(h);
    if (this.settleS) this.settleStep(h);
    this.sealStep(h);
    this.impacts.clear();
    this.world.step(h, 10, 6);
    this.afterStep();
    if (this.hist) this.recordStep(h);
  }

  setProngFriction(f) {
    for (const b of [this.prongL, this.prongR]) {
      for (let fx = b.getFixtureList(); fx; fx = fx.getNext()) fx.setFriction(f);
      for (let ce = b.getContactList(); ce; ce = ce.next) ce.contact.resetFriction();
    }
  }

  // hub-local coordinates (art px) of a world point given in meters
  toHub(q) {
    const hp = this.hub.getPosition(), a = this.hub.getAngle(), c = Math.cos(-a), s = Math.sin(-a);
    const dx = (q.x - hp.x) * PPM, dy = (q.y - hp.y) * PPM;
    return [dx * c - dy * s, dx * s + dy * c];
  }

  // After closing: whatever sits in the claw's cavity may get a springy grip.
  // Odds: centered + small + prongs actually closed = good. Physics does the rest.
  tryGrab() {
    this.grabInfo = null;
    const open = clamp((this.jL.getJointAngle() - this.jR.getJointAngle()) / 1.7, 0, 1);
    const closure = open < 0.6 ? 1 : lerp(1, 0.35, (open - 0.6) / 0.4);
    const cand = [];
    for (const p of this.parts) {
      if (p.won) continue;
      let best = null;
      for (const b of p.bodies) {
        const [lx, ly] = this.toHub(b.getPosition());
        if (Math.abs(lx) > 16 || ly < 3 || ly > 40) continue;
        const d = Math.hypot(lx, (ly - 20) * 0.6);
        if (!best || d < best.d) best = { b, lx, ly, d };
      }
      if (!best) continue;
      const chance = this.chanceFor(p, best.lx, closure, !!(this.turn && this.turn.iron));
      cand.push({ p, ...best, chance });
    }
    cand.sort((a, b) => a.d - b.d);
    this.grabInfo = { open, closure, cand: cand.map((c) => ({ type: c.p.type, chance: c.chance })) };
    let first = true;
    const rolls = [];
    for (const c of cand.slice(0, 2)) {
      const roll = first ? c.chance : c.chance * 0.3; // a second part is a lucky bonus
      const hit = RNG() < roll;
      if (hit) this.attachGrip(c.p, c.b);
      rolls.push({ type: c.p.type, chance: roll, hit, bonus: !first });
      first = false;
    }
    this.emit('roll', { rolls, iron: !!(this.turn && this.turn.iron), closure }); // the Lens shows the dice
  }

  // Hold chance for a part whose centre is lx px off the claw's axis. One function for the rules
  // (tryGrab) and for the Lens (predict), so the odds badge can never disagree with the dice.
  chanceFor(p, lx, closure = 1, iron = false) {
    const s = SPR.get(p.def.sprite);
    const dim = p.def.chain ? 16 : Math.max(s.w, s.h);
    const size = dim <= 20 ? 1 : dim <= 26 ? 0.85 : 0.7;
    const center = 1 - 0.55 * Math.pow(Math.min(1, Math.abs(lx) / 16), 2);
    return clamp(CONFIG.grabChance * size * center * closure * (p.def.grip || 1) * (iron ? CONFIG.ironBoost : 1), 0, 0.98);
  }

  attachGrip(p, body) {
    const pl = planck;
    const anchorA = this.hub.getWorldPoint(pl.Vec2(0, 16 / PPM));
    const anchorB = body.getWorldCenter();
    const len = Math.hypot(anchorA.x - anchorB.x, anchorA.y - anchorB.y);
    const joint = this.world.createJoint(pl.DistanceJoint({
      frequencyHz: CONFIG.gripSpring, dampingRatio: 1, length: clamp(len, 2 / PPM, 22 / PPM), collideConnected: true,
    }, this.hub, body, anchorA, anchorB));
    this.grips.push({ part: p, body, joint, strain: 0, t: 0 });
    for (const b of p.bodies) { b.setLinearDamping(1.6); b.setAngularDamping(2.5); } // clamped by the prongs
  }

  unclamp(p) { for (const b of p.bodies) { b.setLinearDamping(0.05); b.setAngularDamping(p.def.chain ? 0.6 : 0.4); } }

  // Slip model: explicit, tunable odds (physics supplies the swing you can see).
  updateGrips(h) {
    const hv = this.hub.getLinearVelocity();
    const ironK = this.turn && this.turn.iron ? CONFIG.ironSlip : 1; // Iron Grip: slip odds cut to a fraction
    for (const g of this.grips.slice()) {
      g.t += h;
      const gp = g.part.def.grip || 1;
      const v = g.body.getLinearVelocity();
      const vrel = Math.hypot(v.x - hv.x, v.y - hv.y) * PPM; // how hard it's swinging, px/s
      const A = g.joint.getAnchorA(), B = g.joint.getAnchorB();
      const stretch = (Math.hypot(A.x - B.x, A.y - B.y) - g.joint.getLength()) * PPM;
      g.load = vrel;
      let lose = null;
      if (stretch > 9) lose = 'stuck'; // still wedged in the pile: it tears free of the claw
      else if (g.t > 0.4 && this.state !== 'lift') { // swinging only counts once the player is steering
        const hazard = (CONFIG.slipBase / gp + CONFIG.swingSlip * Math.max(0, vrel - CONFIG.swingSafe) / 30) * ironK;
        if (RNG() < hazard * h) lose = 'swing';
      }
      if (lose) this.loseGrip(g, lose);
    }
  }

  loseGrip(g, why) {
    if (!this.grips.includes(g)) return;
    this.world.destroyJoint(g.joint);
    this.unclamp(g.part);
    this.grips = this.grips.filter((x) => x !== g);
    this.emit('gripLost', { part: g.part, why });
  }

  // one-off slip rolls (the jolt at the top of the lift, a twitch in the claw)
  rollSlip(p, chance, why) {
    const g = this.grips.find((x) => x.part === p);
    if (g && RNG() < chance / (p.def.grip || 1) * (this.turn && this.turn.iron ? CONFIG.ironSlip : 1)) this.loseGrip(g, why);
  }

  dropGrips() {
    for (const g of this.grips) { this.world.destroyJoint(g.joint); this.unclamp(g.part); }
    this.grips = [];
  }

  twitch() {
    const living = this.parts.filter((p) => p.def.alive && !p.won);
    if (!living.length) return;
    const p = pick(living);
    const held = this.held.has(p) || this.grips.some((g) => g.part === p);
    const f = CONFIG.twitchForce * (held ? 1.5 : 1);
    const b = held ? p.bodies[p.bodies.length - 1] : p.body;
    const m = b.getMass() * (p.bodies.length > 1 ? 2 : 1);
    b.applyLinearImpulse(planck.Vec2(rand(-1.4, 1.4) * f * m, -rand(2.2, 4) * f * m), b.getWorldCenter(), true);
    b.applyAngularImpulse(rand(-1, 1) * 0.35 * f * b.getInertia() * 10, true);
    p.twitchT = this.time;
    this.emit('twitch', { part: p, held });
    if (held) this.rollSlip(p, CONFIG.twitchSlip, 'twitch');
  }

  startRelease() {
    this.dropGrips();
    this.setState('release');
    this.emit('release', { held: [...this.held], overChute: this.carX > MACHINE.chuteX0 });
  }

  endTurn() {
    const t = this.turn;
    const result = t && t.won.length ? 'win' : t && t.grabbed.size ? 'slip' : 'miss';
    this.setState('idle');
    this.endRecord(result); // a failed grab keeps its recording so REDO can rewind it
    this.emit('turnEnd', { result, won: t ? t.won.slice() : [], grabbed: t ? [...t.grabbed] : [], turn: t, iron: !!(t && t.iron), redo: this.canRedo() });
    this.turn = null;
  }

  afterStep() {
    const M = MACHINE;
    // wins and strays
    for (const p of this.parts.slice()) {
      const [x, y] = this.partPos(p);
      if (!p.won && x > M.chuteX0 + 1 && y > M.lipY + 6) {
        p.won = true;
        p.wonT = this.time;
        this.held.delete(p);
        if (this.turn) this.turn.won.push(p);
        this.emit('win', { part: p, x, y, inTurn: !!this.turn });
      }
      if (y > M.bottom + 16 || x < M.left - 12 || x > M.right + 12 || y < -40) {
        if (!p.won) this.emit('lost', { part: p });
        this.removePart(p);
      }
    }
    // held / slipped
    const lifting = this.state === 'lift' || this.state === 'carry' || this.state === 'return';
    const now = new Set();
    if (lifting) {
      const hp = this.hub.getPosition(), a = this.hub.getAngle(), c = Math.cos(-a), s = Math.sin(-a);
      for (const p of this.parts) {
        if (p.won) continue;
        let inZone = false;
        for (const b of p.bodies) {
          const q = b.getPosition();
          const dx = (q.x - hp.x) * PPM, dy = (q.y - hp.y) * PPM;
          const lx = dx * c - dy * s, ly = dx * s + dy * c;
          if (lx > -24 && lx < 24 && ly > -4 && ly < 64) { inZone = true; break; }
        }
        if (!inZone) continue;
        if (this.held.has(p) || p.liftY0 - p.body.getPosition().y * PPM > 9) now.add(p);
      }
      for (const p of this.held) if (!now.has(p) && !p.won) { if (this.turn) this.turn.slips++; this.emit('slip', { part: p }); }
      for (const p of now) if (!this.held.has(p)) { if (this.turn) this.turn.grabbed.add(p); this.emit('grab', { part: p }); }
    }
    this.held = now;
    const gripped = new Set(this.grips.map((g) => g.part));
    for (const p of this.parts) {
      const gs = now.has(p) || gripped.has(p) ? 1 - CONFIG.gripAssist : 1;
      for (const b of p.bodies) if (b.getGravityScale() !== gs) b.setGravityScale(gs);
    }
    // impact sounds
    if (!this.settling) {
      for (const [ud, info] of this.impacts) {
        if (ud === 'claw') { if (info.imp > 1.2) this.emit('clank', { intensity: clamp(info.imp / 8, 0, 1) }); continue; }
        if (this.time - (ud.bumpT || -1) < 0.09) continue;
        const m = info.body.getMass();
        const inten = clamp(info.imp / (m * 3.5), 0, 1);
        if (inten < 0.12) continue;
        ud.bumpT = this.time;
        const q = info.body.getPosition();
        this.emit('bump', { part: ud, intensity: inten, claw: info.claw, x: q.x * PPM, y: q.y * PPM });
      }
    }
  }

  // ------------------------------------------------------------ render helpers
  clawPose() {
    const h = this.hub, pL = this.prongL, pR = this.prongR;
    const hp = h.getPosition(), lp = pL.getPosition(), rp = pR.getPosition();
    const top = h.getWorldPoint(planck.Vec2(0, -CLAW_GEO.hubH / 2 / PPM));
    return {
      carX: this.carX, carY: MACHINE.railY,
      hubX: hp.x * PPM, hubY: hp.y * PPM, hubA: h.getAngle(),
      ropeX: top.x * PPM, ropeY: top.y * PPM,
      lX: lp.x * PPM, lY: lp.y * PPM, lA: pL.getAngle(),
      rX: rp.x * PPM, rY: rp.y * PPM, rA: pR.getAngle(),
      open: clamp((this.jL.getJointAngle() - this.jR.getJointAngle()) / 1.7, 0, 1),
    };
  }

  debugShapes() {
    const out = [];
    for (let b = this.world.getBodyList(); b; b = b.getNext()) {
      for (let f = b.getFixtureList(); f; f = f.getNext()) {
        const sh = f.getShape(), type = sh.getType();
        if (type === 'circle') {
          const c = b.getWorldPoint(sh.getCenter());
          out.push({ type, x: c.x * PPM, y: c.y * PPM, r: sh.getRadius() * PPM, stat: b.isStatic() });
        } else if (type === 'polygon') {
          out.push({ type, pts: sh.m_vertices.map((v) => { const p = b.getWorldPoint(v); return [p.x * PPM, p.y * PPM]; }), stat: b.isStatic() });
        }
      }
    }
    return out;
  }
}

// ==== 12_clawrig.js ====
// ---------------------------------------------------------------------------
// CLAW RIG — the physical half of the RNG manipulation layer (docs/RNG_LAYER.md).
// Mixed into ClawSim: quake, nudge, the chute lid, the drop lock, Iron Grip arming,
// the Lens (odds preview), and turn recording + rewind for REDO.
// No rendering and no DOM: tools/rig_check.mjs runs all of this headless.
// The rules (Luck, costs, TILT heat) live in 29_rig.js; this file only moves things.
// Every shake is a *velocity change*, not a force, so heavy and light parts are
// thrown about alike, the way a real quake treats a pile.
// ---------------------------------------------------------------------------
const RIGSIM = {
  histDt: 1 / 30, // recording resolution for REDO
  histMax: 1500, // frames kept (50 s of turn): longer turns can't be rewound
  lidH: MACHINE.lipY, // the chute lid runs from the top of the guard right up to the glass ceiling
  vmax: 170, // speed clamp for shaken parts, px/s
  // Quake shocks (px/s, rad/s). Each is a velocity change. Rumble kicks stay well under gravity
  // (36 px/s per pulse) so parts hop and land instead of floating; the vertical work is done by
  // the P-wave, the periodic bumps and the aftershock.
  pwave: { up: 110, side: 35, spin: 3 },
  rumble: { up: 22, side: 68, spin: 2.2, gap: [0.055, 0.095] },
  bump: { up: 85, side: 30, spin: 2.6, every: 0.42 },
  after: { up: 80, side: 40, spin: 2.6 },
  nudge: { side: 185, up: 100, spin: 4.4 }, // one bump, at full strength under the claw (see nudge())
  // The Lens shows chanceFor() x this. The claw shoves the pile as it lands, so what ends up in its
  // cavity is often not exactly what sat under it, and a drop holds something ~0.75x as often as the
  // raw number says. Measured over 700 drops each: 0.73x plain, 0.79x with Iron Grip, steady across
  // every odds bin. (Uncalibrated, green "79%" badges held only 59% of the time and felt rigged.)
  // Re-measure it (tools/rig_check.mjs "calibration") if the grab model in tryGrab() changes.
  lensShift: 0.75,
  steady: 0.55, // fraction of speed kept when the shaking stops (the machine "steadies")
  damp: 3, // linear damping on loose parts while shaking: reins in how high a shaken pile heaves
  dropRest: 14, // px/s: a quake unlocks the drop once every part is slower than this
  sealCap: 30, // s: the chute lid comes down by itself if nobody drops for this long
  settleCap: 2.4, // s: a quake never locks the drop for longer than this after the shaking stops
};

Object.assign(ClawSim.prototype, {
  // ------------------------------------------------------------ locks
  // Stops a new drop (and, for TILT, the carriage) for a while. A longer lock wins.
  lock(why, secs) {
    if (secs > this.lockT) { this.lockT = secs; this.lockWhy = why; }
  },
  canDrop() { return this.state === 'idle' && this.lockT <= 0; },

  armIron(on) {
    this.iron = !!on;
    this.emit('iron', { on: this.iron });
  },

  // ------------------------------------------------------------ chute lid
  // The moment the machine is shaken, the guard grows an invisible wall up to the glass ceiling.
  // Only parts collide with it (the claw ignores it). It stays up until the next drop begins
  // (startDrop -> unseal), so nothing the Rig does, now or a moment later when a shaken mound
  // tips over, can put a free part in the chute.
  seal() {
    if (this.lid) { this.sealAge = 0; return; }
    const pl = planck, M = MACHINE;
    this.sealAge = 0;
    this.lid = this.ground.createFixture(
      pl.Box(M.guardW / 2 / PPM, RIGSIM.lidH / 2 / PPM, pl.Vec2((M.guardX + M.guardW / 2) / PPM, (M.lipY - RIGSIM.lidH / 2) / PPM), 0),
      { friction: 0.2, filterCategoryBits: CAT.WALL, filterMaskBits: CAT.PART });
    this.emit('seal', { on: true });
  },
  sealStep(h) {
    if (!this.lid) return;
    this.sealAge += h;
    if (this.sealAge > RIGSIM.sealCap) this.unseal(); // walked away from the machine: let it go
  },
  unseal() {
    if (!this.lid) return;
    this.ground.destroyFixture(this.lid); this.lid = null;
    this.emit('seal', { on: false });
  },
  // True when no loose part is moving faster than `speed` px/s. (A part that twitched a moment
  // ago is ignored: living parts jump about on their own and would keep the pile "moving".)
  pileStill(speed) {
    const lim = (speed / PPM) * (speed / PPM);
    for (const p of this.parts) {
      if (p.won || this.time - (p.twitchT || -9) < 0.6) continue;
      for (const b of p.bodies) { const v = b.getLinearVelocity(); if (v.x * v.x + v.y * v.y > lim) return false; }
    }
    return true;
  },

  // ------------------------------------------------------------ QUAKE
  // An earthquake: an opening P-wave (big upward jolt), a rumble of coherent side-to-side
  // slosh with per-part noise, and an aftershock. Ends by itself; drops stay locked until
  // the pile has settled.  opts: {time, power, settle, tilt}
  quake(opts = {}) {
    if (this.state !== 'idle' || this.quakeS) return false;
    const T = opts.time != null ? opts.time : CONFIG.quakeTime;
    const power = (opts.power != null ? opts.power : 1) * CONFIG.quakePower;
    this.quakeS = { t: 0, T, power, next: 0, bumpT: RIGSIM.bump.every, dir: RNG() < 0.5 ? -1 : 1, hit: false, after: false };
    if (opts.tilt) this.lock('tilt', T + (opts.settle != null ? opts.settle : 0));
    else this.lock('quake', 99); // ends when the shaking is over and the pile has settled (settleStep)
    this.seal();
    this.damp(RIGSIM.damp);
    this.redoHist = null; // the pile is about to change: a rewind would undo the wrong thing
    this.emit('quake', { phase: 'start', power, time: T, tilt: !!opts.tilt });
    return true;
  },
  quakeStep(h) {
    const q = this.quakeS, R = RIGSIM;
    q.t += h;
    // envelope: fast attack, long hold, release over the last third
    const tail = q.T * 0.66;
    const e = Math.min(1, q.t / 0.1) * (q.t > tail ? Math.max(0, 1 - (q.t - tail) / (q.T - tail)) : 1);
    if (!q.hit) {
      q.hit = true;
      this.shake(Object.assign({ mag: q.power }, R.pwave));
      this.emit('quakePulse', { e: 1, big: true });
    }
    q.next -= h;
    if (q.next <= 0 && q.t < q.T) {
      q.next = R.rumble.gap[0] + RNG() * (R.rumble.gap[1] - R.rumble.gap[0]);
      if (RNG() < 0.35) q.dir = -q.dir;
      this.shake(Object.assign({ mag: q.power * e, dir: q.dir }, R.rumble));
      this.emit('quakePulse', { e, big: false });
    }
    q.bumpT -= h;
    if (q.bumpT <= 0 && q.t < q.T * 0.75) {
      q.bumpT = R.bump.every * (0.8 + 0.4 * RNG());
      this.shake(Object.assign({ mag: q.power * e }, R.bump));
      this.emit('quakePulse', { e, big: true });
    }
    if (!q.after && q.t > q.T * 0.8) {
      q.after = true;
      this.shake(Object.assign({ mag: q.power * 0.8 }, R.after));
      this.emit('quakePulse', { e: 0.8, big: true });
    }
    if (q.t >= q.T) {
      this.quakeS = null; this.steady(R.steady); this.damp(0.05);
      if (this.lockWhy === 'quake') this.settleS = { t: 0, rest: 0 };
      this.emit('quake', { phase: 'end' });
    }
  },
  // Linear damping for every loose part (0.05 is the normal value; see spawnPart).
  damp(k) { for (const p of this.parts) for (const b of p.bodies) b.setLinearDamping(k); },
  // After a quake the drop stays locked until the pile is at rest (at least quakeSettle, at most settleCap).
  settleStep(h) {
    const S = this.settleS;
    S.t += h;
    S.rest = this.pileStill(RIGSIM.dropRest) ? S.rest + h : 0;
    if ((S.t >= CONFIG.quakeSettle && S.rest >= 0.25) || S.t >= RIGSIM.settleCap) {
      this.settleS = null;
      if (this.lockWhy === 'quake') { this.lockT = 0; this.lockWhy = null; this.emit('unlock', { why: 'quake' }); }
    }
  },
  // Bleed speed off every loose part (the end of a quake, so the pile settles quickly).
  steady(k) {
    const V = planck.Vec2;
    for (const p of this.parts) {
      if (p.won) continue;
      for (const b of p.bodies) { const v = b.getLinearVelocity(); b.setLinearVelocity(V(v.x * k, v.y * k)); b.setAngularVelocity(b.getAngularVelocity() * k); }
    }
  },
  // One seismic shock for every loose part. o: {up, side (px/s), spin (rad/s), mag, dir}.
  // Like real ground motion it is coherent: one strength for the whole pile with only a little
  // per-part variation. (Independent strengths made stacked parts collide mid-air and sling
  // the top one far too high.)
  shake(o) {
    const V = planck.Vec2, vmax = RIGSIM.vmax / PPM, mag = o.mag, dir = o.dir || 0;
    const gUp = 0.35 + 0.65 * RNG(), gSide = dir ? 0.6 + 0.4 * RNG() : RNG() * 2 - 1;
    for (const p of this.parts) {
      if (p.won) continue;
      const up = gUp * (0.85 + 0.3 * RNG()) * o.up * mag;
      const side = (dir ? dir * gSide : gSide) * (0.8 + 0.4 * RNG()) * o.side * mag;
      const w = (RNG() * 2 - 1) * o.spin * mag;
      for (const b of p.bodies) { // one draw per part, so a bone tail moves as one piece
        const v = b.getLinearVelocity();
        let vx = v.x + side / PPM, vy = v.y - up / PPM;
        const s = Math.hypot(vx, vy);
        if (s > vmax) { vx *= vmax / s; vy *= vmax / s; }
        if (!isFinite(vx) || !isFinite(vy) || !isFinite(w)) continue; // never hand planck a NaN
        b.setLinearVelocity(V(vx, vy));
        b.setAngularVelocity(clamp(b.getAngularVelocity() + w, -12, 12));
      }
    }
    const hv = this.hub.getLinearVelocity(); // the cabinet rattles the claw too
    this.hub.setLinearVelocity(V(hv.x + (RNG() * 2 - 1) * 10 * mag / PPM, hv.y));
  },

  // ------------------------------------------------------------ NUDGE
  // Bump the glass: a sideways kick with a little hop, strongest around the claw.
  nudge(dir) {
    if (this.state !== 'idle' || this.lockT > 0) return false;
    const V = planck.Vec2, vmax = RIGSIM.vmax / PPM, cx = this.carX, R = CONFIG.nudgeRadius, P = CONFIG.nudgePower;
    for (const p of this.parts) {
      if (p.won) continue;
      const k = 0.75 + 0.5 * RNG(), kup = 0.6 + 0.6 * RNG(), w = (RNG() * 2 - 1) * RIGSIM.nudge.spin * P;
      for (const b of p.bodies) {
        const dx = (b.getPosition().x * PPM - cx) / R;
        const f = 0.35 + 0.65 * Math.exp(-dx * dx); // full strength under the claw, a third at the far end
        const v = b.getLinearVelocity();
        let vx = v.x + (dir * RIGSIM.nudge.side * P * f * k) / PPM, vy = v.y - (RIGSIM.nudge.up * P * f * kup) / PPM;
        const s = Math.hypot(vx, vy);
        if (s > vmax) { vx *= vmax / s; vy *= vmax / s; }
        if (!isFinite(vx) || !isFinite(vy) || !isFinite(w * f)) continue;
        b.setLinearVelocity(V(vx, vy));
        b.setAngularVelocity(clamp(b.getAngularVelocity() + w * f, -12, 12));
      }
    }
    const hv = this.hub.getLinearVelocity();
    this.hub.setLinearVelocity(V(hv.x + (dir * 14) / PPM, hv.y)); // the claw swings with the bump
    this.seal();
    this.redoHist = null;
    this.emit('nudge', { dir, x: cx });
    return true;
  },

  // ------------------------------------------------------------ LENS
  // What would a drop right here hold? Finds the first part under the claw's axis and scores it with
  // the same chanceFor() the real grab uses, scaled by the measured lensShift. The chance is for
  // holding SOMETHING: which part ends up in the claw depends on how the pile shifts as it lands
  // (the part under the claw is the one held only about 44% of the time).
  predict() {
    if (this.state !== 'idle') return null;
    const pl = planck, V = pl.Vec2, M = MACHINE;
    const top = this.hub.getPosition().y * PPM + 30;
    let best = null;
    this.world.rayCast(V(this.carX / PPM, top / PPM), V(this.carX / PPM, M.floor / PPM), (fix, point, normal, fr) => {
      const ud = fix.getBody().getUserData();
      if (ud === 'claw') return -1;
      best = { part: ud && ud.def ? ud : null, y: point.y * PPM };
      return fr;
    });
    if (!best) return null;
    const p = best.part;
    if (!p || p.won) return { part: null, y: best.y };
    const lx = this.partPos(p)[0] - this.carX;
    return { part: p, y: best.y, lx, chance: this.chanceFor(p, lx, 1, this.iron) * RIGSIM.lensShift };
  },

  // ------------------------------------------------------------ recording (for REDO)
  // From the drop until the turn ends, every loose part and the claw are sampled ~30x a second.
  // A failed grab keeps its recording; REDO replays it backwards.
  beginRecord() {
    const bodies = [], parts = [];
    for (const p of this.parts) if (!p.won) { parts.push(p); for (const b of p.bodies) bodies.push(b); }
    const H = this.hist = { bodies, parts, frames: [], acc: 0, dur: 0, tainted: false, v0: null };
    this.redoHist = null;
    H.v0 = bodies.map((b) => { const v = b.getLinearVelocity(); return [v.x, v.y, b.getAngularVelocity()]; });
    H.frames.push(this.captureFrame(H));
  },
  captureFrame(H) {
    const nb = H.bodies.length, f = new Float64Array(nb * 3 + 10);
    for (let i = 0; i < nb; i++) { const b = H.bodies[i], q = b.getPosition(); f[i * 3] = q.x; f[i * 3 + 1] = q.y; f[i * 3 + 2] = b.getAngle(); }
    let o = nb * 3;
    f[o++] = this.carX;
    for (const b of [this.hub, this.prongL, this.prongR]) { const q = b.getPosition(); f[o++] = q.x; f[o++] = q.y; f[o++] = b.getAngle(); }
    return f;
  },
  recordStep(h) {
    const H = this.hist;
    H.acc += h; H.dur += h;
    if (H.acc < RIGSIM.histDt) return;
    H.acc -= RIGSIM.histDt;
    if (H.frames.length < RIGSIM.histMax) H.frames.push(this.captureFrame(H)); else H.tainted = true;
  },
  histValid(H) { return H.parts.every((p) => !p.removed && !p.won); },
  endRecord(result) {
    const H = this.hist;
    this.hist = null;
    this.redoHist = null;
    if (!H || H.tainted || result === 'win') return; // a win is nothing to undo
    H.frames.push(this.captureFrame(H)); // so the rewind starts exactly where the turn ended
    if (this.histValid(H)) this.redoHist = H;
  },

  // ------------------------------------------------------------ REDO
  canRedo() { return !!this.redoHist && this.state === 'idle' && this.histValid(this.redoHist); },
  rewind() {
    if (!this.canRedo()) return false;
    const H = this.redoHist;
    this.redoHist = null;
    const dur = clamp(H.dur / CONFIG.redoSpeed, 0.7, 1.6);
    this.rw = { H, n: H.frames.length, dur };
    this.setState('rewind');
    this.emit('rewind', { phase: 'start', dur, turnTime: H.dur });
    return true;
  },
  rewindStep() {
    const R = this.rw;
    const k = clamp(this.stateT / R.dur, 0, 1);
    this.applyFrame(R.H, R.H.frames[Math.round((1 - easeInOutQuad(k)) * (R.n - 1))]);
    if (k >= 1) this.finishRewind();
  },
  // Put every recorded body (and the claw) exactly where the frame says, at rest.
  applyFrame(H, f) {
    const V = planck.Vec2, nb = H.bodies.length, zero = V(0, 0);
    for (let i = 0; i < nb; i++) {
      const b = H.bodies[i];
      b.setTransform(V(f[i * 3], f[i * 3 + 1]), f[i * 3 + 2]);
      b.setLinearVelocity(zero); b.setAngularVelocity(0);
    }
    let o = nb * 3;
    this.carX = f[o++]; this.carV = 0;
    this.carriage.setTransform(V(this.carX / PPM, MACHINE.railY / PPM), 0);
    this.carriage.setLinearVelocity(zero);
    for (const b of [this.hub, this.prongL, this.prongR]) {
      b.setTransform(V(f[o], f[o + 1]), f[o + 2]); o += 3;
      b.setLinearVelocity(zero); b.setAngularVelocity(0);
    }
  },
  finishRewind() {
    const V = planck.Vec2, H = this.rw.H;
    this.rw = null;
    this.applyFrame(H, H.frames[0]);
    H.bodies.forEach((b, i) => { const v = H.v0[i]; b.setLinearVelocity(V(v[0], v[1])); b.setAngularVelocity(v[2]); b.setAwake(true); });
    this.ropeLen = MACHINE.topLen;
    this.turn = null; this.grips = []; this.held = new Set(); this.landed = false;
    this.setState('idle');
    this.emit('rewind', { phase: 'end' });
  },
});

// ==== 20_engine.js ====
// ---------------------------------------------------------------------------
// ENGINE — 480x270 pixel canvas, input (keys, pointer/touch, gamepad), scenes
// with dither transitions, and the juice: shake, hit-pause, slow-mo, flash,
// particles, floating text. Plus tiny pixel UI widgets.
// ---------------------------------------------------------------------------
const W = 480, H = 270;

// ------------------------------------------------------------------- input
const Input = {
  down: {}, pressed: {}, released: {},
  mouse: { x: -1, y: -1, down: false, pressed: false, released: false, moved: false },
  pad: { left: false, right: false, a: false, b: false, prev: {} },
  anyPressed: false,
  lastDevice: 'mouse',
  KEYMAP: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    Space: 'a', Enter: 'a', KeyZ: 'a', KeyJ: 'a',
    Escape: 'b', Backspace: 'b', KeyX: 'b', KeyK: 'b',
    // the Rig (claw scene): Q/E bump the glass, 1-4 pull a lever
    KeyQ: 'nudgeL', KeyE: 'nudgeR',
    Digit1: 'quake', Digit2: 'grip', Digit3: 'order', Digit4: 'redo',
    Numpad1: 'quake', Numpad2: 'grip', Numpad3: 'order', Numpad4: 'redo',
  },
  init(canvas) {
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return; // browser shortcuts (Ctrl+1 switches tab, Ctrl+E, Cmd+Q...) are not game keys
      const act = this.KEYMAP[e.code];
      if (act || e.code === 'Space') e.preventDefault();
      if (!e.repeat) {
        this.pressed[e.code] = true;
        if (act) this.pressed[act] = true;
        this.anyPressed = true;
      }
      this.down[e.code] = true;
      if (act) this.down[act] = true;
      this.lastDevice = 'keys';
      AudioSys.init();
    });
    window.addEventListener('keyup', (e) => {
      const act = this.KEYMAP[e.code];
      this.down[e.code] = false;
      if (act) {
        // only release the action if no other key mapped to it is held
        const still = Object.keys(this.KEYMAP).some((k) => this.KEYMAP[k] === act && this.down[k]);
        if (!still) { this.down[act] = false; this.released[act] = true; }
      }
    });
    window.addEventListener('blur', () => { this.down = {}; this.mouse.down = false; });
    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      this.mouse.x = ((e.clientX - r.left) / r.width) * W;
      this.mouse.y = ((e.clientY - r.top) / r.height) * H;
      this.mouse.moved = true;
    };
    canvas.addEventListener('pointerdown', (e) => {
      pos(e);
      this.mouse.down = true; this.mouse.pressed = true; this.anyPressed = true;
      this.lastDevice = e.pointerType === 'touch' ? 'touch' : 'mouse';
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      try { window.focus(); canvas.focus({ preventScroll: true }); } catch (err) { /* embedded page: best effort */ }
      AudioSys.init();
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => { pos(e); if (e.pointerType !== 'touch') this.lastDevice = 'mouse'; });
    const up = (e) => { pos(e); if (this.mouse.down) this.mouse.released = true; this.mouse.down = false; };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') { this.mouse.x = -1; this.mouse.y = -1; } });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  },
  pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads && [...pads].find((p) => p && p.connected);
    const P = this.pad;
    if (!gp) { P.left = P.right = P.a = P.b = P.x = P.y = P.lb = P.rb = false; return; }
    const ax = gp.axes[0] || 0;
    const now = {
      left: ax < -0.4 || (gp.buttons[14] && gp.buttons[14].pressed),
      right: ax > 0.4 || (gp.buttons[15] && gp.buttons[15].pressed),
      up: (gp.axes[1] || 0) < -0.5 || (gp.buttons[12] && gp.buttons[12].pressed),
      down: (gp.axes[1] || 0) > 0.5 || (gp.buttons[13] && gp.buttons[13].pressed),
      a: gp.buttons[0] && gp.buttons[0].pressed,
      b: gp.buttons[1] && gp.buttons[1].pressed,
      x: gp.buttons[2] && gp.buttons[2].pressed, // quake
      y: gp.buttons[3] && gp.buttons[3].pressed, // iron grip
      lb: gp.buttons[4] && gp.buttons[4].pressed, // nudge left
      rb: gp.buttons[5] && gp.buttons[5].pressed, // nudge right
    };
    for (const k in now) {
      if (now[k] && !P.prev[k]) { this.pressed[k] = true; this.anyPressed = true; this.lastDevice = 'pad'; }
      if (!now[k] && P.prev[k]) this.released[k] = true;
      P[k] = now[k];
    }
    P.prev = now;
  },
  held(act) { return !!(this.down[act] || this.pad[act]); },
  hit(act) { return !!this.pressed[act]; },
  endFrame() {
    this.pressed = {}; this.released = {}; this.anyPressed = false;
    this.mouse.pressed = false; this.mouse.released = false; this.mouse.moved = false;
  },
  over(x, y, w, h) { const m = this.mouse; return m.x >= x && m.y >= y && m.x < x + w && m.y < y + h; },
};

// ------------------------------------------------------------------ engine
const Engine = {
  canvas: null, ctx: null, scale: 1,
  t: 0, realT: 0, frame: 0,
  scenes: {}, scene: null, sceneName: '',
  trans: null,
  shakeMag: 0, shakeT: 0, shakeX: 0, shakeY: 0,
  pauseT: 0, slowT: 0, slowScale: 1,
  flashT: 0, flashDur: 0, flashColor: '#fff',
  paused: false,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    Input.init(this.canvas);
    const resize = () => {
      // fit the canvas inside whatever the page leaves free (gutters, safe areas, the hint line)
      const px = (cs, k) => parseFloat(cs[k]) || 0;
      const de = document.documentElement, bs = getComputedStyle(document.body), rs = getComputedStyle(de);
      const hint = document.getElementById('hint');
      const avW = de.clientWidth - px(bs, 'paddingLeft') - px(bs, 'paddingRight') - px(rs, 'paddingLeft') - px(rs, 'paddingRight');
      const avH = de.clientHeight - px(bs, 'paddingTop') - px(bs, 'paddingBottom') - px(rs, 'paddingTop') - px(rs, 'paddingBottom')
        - (hint && hint.offsetParent ? hint.offsetHeight + 6 : 0);
      let s = Math.min(avW / W, avH / H);
      if (s >= 2 && s - Math.floor(s) < 0.34) s = Math.floor(s); // snap to whole pixels when it costs little
      s = Math.max(0.5, s);
      this.scale = s;
      this.canvas.style.width = Math.floor(W * s) + 'px';
      this.canvas.style.height = Math.floor(H * s) + 'px';
    };
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
    resize();
  },

  add(name, scene) { this.scenes[name] = scene; scene.name = name; },

  // style: 'dither' (pixel fade through black) | 'cut'
  go(name, params, style = 'dither') {
    if (this.trans) return;
    const to = this.scenes[name];
    if (style === 'cut' || !this.scene) { this._switch(to, params); return; }
    this.trans = { to, params, t: 0, dur: 0.22, phase: 'out' };
    if (typeof Sfx !== 'undefined') Sfx.play('transition');
  },
  _switch(to, params) {
    const from = this.scene;
    if (from && from.exit) from.exit(to);
    this.scene = to;
    this.sceneName = to.name;
    Telemetry.scene(to.name);
    if (to.enter) to.enter(params || {}, from);
  },

  shake(mag, dur = 0.25) {
    mag *= CONFIG.shake;
    if (mag >= this.shakeMag * (this.shakeT > 0 ? 1 : 0)) { this.shakeMag = mag; this.shakeT = dur; this.shakeDur = dur; }
  },
  hitPause(sec) { this.pauseT = Math.max(this.pauseT, sec * CONFIG.hitPause); },
  slowmo(scale, sec) { if (!CONFIG.slowmo) return; this.slowScale = scale; this.slowT = sec; },
  flash(color = '#fff', dur = 0.15) { this.flashColor = color; this.flashT = dur; this.flashDur = dur; },

  loop(now) {
    const realDt = Math.min(0.05, (now - (this._last || now)) / 1000);
    this._last = now;
    this.realT += realDt;
    Input.pollPad();
    let dt = realDt;
    if (this.pauseT > 0) { this.pauseT -= realDt; dt = 0; }
    if (this.slowT > 0) { this.slowT -= realDt; dt *= this.slowScale; }
    if (this.paused) dt = 0;
    this.t += dt;
    this.dt = dt;
    this.frame++;

    // transition
    if (this.trans) {
      const tr = this.trans;
      tr.t += realDt;
      if (tr.phase === 'out' && tr.t >= tr.dur) { this._switch(tr.to, tr.params); tr.phase = 'in'; tr.t = 0; }
      else if (tr.phase === 'in' && tr.t >= tr.dur) this.trans = null;
    }

    if (this.scene && (!this.trans || this.trans.phase === 'in')) {
      try { this.scene.update(dt, realDt); } catch (e) { console.error(e); }
    }
    UI.update(realDt);
    Debug.update && Debug.update(realDt);

    // shake
    if (this.shakeT > 0) {
      this.shakeT -= realDt;
      const k = Math.max(0, this.shakeT / this.shakeDur);
      const m = this.shakeMag * k;
      this.shakeX = Math.round(rand(-m, m));
      this.shakeY = Math.round(rand(-m, m));
    } else { this.shakeX = this.shakeY = 0; }

    // draw
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = PAL.k;
    ctx.fillRect(0, 0, W, H);
    ctx.translate(this.shakeX, this.shakeY);
    try { if (this.scene) this.scene.draw(ctx); } catch (e) { console.error(e); }
    ctx.restore();
    if (this.flashT > 0) {
      this.flashT -= realDt;
      ctx.globalAlpha = clamp(this.flashT / this.flashDur, 0, 1) * 0.85;
      ctx.fillStyle = this.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    UI.drawOverlay(ctx);
    if (this.trans) {
      const tr = this.trans;
      const k = tr.phase === 'out' ? tr.t / tr.dur : 1 - tr.t / tr.dur;
      BG.dither(ctx, Math.round(clamp(k, 0, 1) * 16), PAL.k);
    }
    Input.endFrame();
    requestAnimationFrame((n) => this.loop(n));
  },
};

// --------------------------------------------------------------- particles
// One pool per scene; coordinates are whatever space the scene draws in.
class Particles {
  constructor() { this.list = []; }
  add(p) {
    const q = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, ay: 0, drag: 0, life: 0.6, size: 1, color: '#fff', rot: 0, vr: 0, floor: null, bounce: 0.35, t: 0, fade: true }, p);
    q.max = q.life;
    this.list.push(q);
    return q;
  }
  burst(x, y, n, opts) {
    for (let i = 0; i < n; i++) {
      const a = opts.angle != null ? opts.angle + rand(-opts.spread || 0, opts.spread || 0) : rand(0, Math.PI * 2);
      const sp = rand(opts.speed * 0.4, opts.speed);
      this.add(Object.assign({}, opts, {
        x: x + rand(-(opts.jitter || 0), opts.jitter || 0), y: y + rand(-(opts.jitter || 0), opts.jitter || 0),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        color: Array.isArray(opts.color) ? pick(opts.color) : opts.color,
        life: rand((opts.life || 0.6) * 0.6, opts.life || 0.6),
        size: opts.sizes ? pick(opts.sizes) : opts.size || 1,
      }));
    }
  }
  text(x, y, str, color, opts = {}) {
    return this.add(Object.assign({ kind: 'text', x, y, vy: -28, drag: 3, life: 0.9, text: str, color, font: 'small', outline: PAL.k }, opts));
  }
  update(dt) {
    for (const p of this.list) {
      p.t += dt;
      p.life -= dt;
      p.vy += p.ay * dt;
      if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.floor != null && p.y > p.floor) {
        p.y = p.floor;
        p.vy = -Math.abs(p.vy) * p.bounce;
        p.vx *= 0.7; p.vr *= 0.6;
        if (Math.abs(p.vy) < 12) { p.vy = 0; p.ay = 0; p.vr = 0; }
      }
    }
    this.list = this.list.filter((p) => p.life > 0);
  }
  draw(ctx) {
    for (const p of this.list) {
      const a = p.fade ? clamp(p.life / (p.max * 0.5), 0, 1) : 1;
      if (p.kind === 'proj') continue;
      if (p.kind === 'text') {
        const pop = p.t < 0.12 ? 1 + (1 - p.t / 0.12) * 0.0 : 1;
        Font.draw(ctx, p.text, Math.round(p.x), Math.round(p.y), { font: p.font, color: p.color, outline: p.outline, align: 'center', alpha: a, scale: p.scale || pop });
      } else if (p.kind === 'spr') {
        SPR.draw(ctx, p.spr, p.x, p.y, { rot: p.rot, alpha: a, flip: p.flip, solid: p.solid });
      } else if (p.kind === 'ring') {
        ctx.globalAlpha = a;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1;
        const r = p.r0 + (p.r1 - p.r0) * (1 - p.life / p.max);
        ctx.beginPath(); ctx.arc(Math.round(p.x), Math.round(p.y), r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        const s = p.size;
        ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
        ctx.globalAlpha = 1;
      }
    }
  }
}

// ------------------------------------------------------------ pixel drawing
const Draw = {
  rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
  frame(ctx, x, y, w, h, c) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);

  panel(ctx, x, y, w, h, style = 'dark') {
    const S = {
      dark: ['#0e0b16', '#1d1a2c', '#3b3654', '#26223a'],
      slate: ['#0e0b16', '#222634', '#4b556b', '#2d3344'],
      green: ['#0e0b16', '#1d3a2a', '#5fb86a', '#2e5c3f'],
      paper: ['#43382a', '#efe3c8', '#fff6e3', '#d4c19c'],
      wood: ['#1e120b', '#6a4026', '#b07a4a', '#4e2e1b'],
      neon: ['#0e0b16', '#241230', '#b84a7c', '#3a1a44'],
      red: ['#0e0b16', '#3a1424', '#e8405a', '#5a1a30'],
    }[style];
    const [ol, fill, hi, lo] = S;
    // outline with cut corners
    this.rect(ctx, x + 1, y, w - 2, h, ol);
    this.rect(ctx, x, y + 1, w, h - 2, ol);
    this.rect(ctx, x + 1, y + 1, w - 2, h - 2, fill);
    this.rect(ctx, x + 2, y + 1, w - 4, 1, hi);
    this.rect(ctx, x + 1, y + 2, 1, h - 4, hi);

  glow(ctx, x, y, r, color, alpha = 0.5) {

  bolt(ctx, x0, y0, x1, y1, color, jag = 8, seed = 1) {

    for (let i = 1; i < n; i++) {
      const t = i / n;
      pts.push([lerp(x0, x1, t) + (r() - 0.5) * jag * 2, lerp(y0, y1, t) + (r() - 0.5) * jag * 0.6]);

    pts.push([x1, y1]);
    for (let i = 0; i < pts.length - 1; i++) {
      this.line(ctx, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], color);
      this.line(ctx, pts[i][0] + 1, pts[i][1], pts[i + 1][0] + 1, pts[i + 1][1], color);
    }
    return pts;
  },
};

// ------------------------------------------------------------------ widgets
// Buttons are plain objects owned by scenes; UI.update() handles hover/click
// for the buttons registered this frame by the current scene.
const UI = {
  buttons: [],
  tooltip: null,
  hoverId: null,
  set(buttons) { this.buttons = buttons; },
  update() {
    const m = Input.mouse;
    let hover = null;
    for (const b of this.buttons) {
      if (b.hidden) continue;
      const over = m.x >= 0 && Input.over(b.x, b.y, b.w, b.h);
      b.hover = over && !b.disabled;
      b.held = over && m.down;
      if (over) hover = b;
      b.pressT = Math.max(0, (b.pressT || 0) - 0.05);
    }
    const hid = hover && !hover.disabled ? hover.id || hover.label : null;
    if (hid && hid !== this.hoverId && Input.lastDevice === 'mouse' && !(hover && hover.silent)) Sfx.play('ui_hover');
    this.hoverId = hid;
    if (m.pressed && hover && !Engine.trans) {
      if (hover.disabled) { Sfx.play('ui_deny'); if (hover.onDeny) hover.onDeny(); }
      else if (hover.onClick) {
        hover.pressT = 1;
        if (!hover.silent) Sfx.play(hover.sound || 'ui_click');
        hover.onClick();
      }
    }
    this.tooltip = hover && hover.tip ? hover.tip : null;
  },
  drawButton(ctx, b) {
    if (b.hidden) return;
    const style = b.disabled ? 'dark' : b.style || 'dark';
    const down = b.held || b.pressT > 0.5 ? 1 : 0;
    Draw.panel(ctx, b.x, b.y + down, b.w, b.h, style);
    if (b.hover && !b.disabled) Draw.frame(ctx, b.x - 1, b.y - 1 + down, b.w + 2, b.h + 2, b.hoverColor || '#fff6e3');
    const col = b.disabled ? '#5b4a78' : b.textColor || (style === 'paper' ? PAL.N : style === 'wood' ? '#fff1c8' : '#ecdcbc');
    if (b.icon) {
      SPR.draw(ctx, b.icon, b.x + 8, b.y + b.h / 2 + down);
      Font.draw(ctx, b.label, b.x + 16, b.y + Math.floor((b.h - 7) / 2) + down, { color: col, shadow: style === 'paper' ? null : PAL.k });
    } else {
      Font.draw(ctx, b.label, b.x + b.w / 2, b.y + Math.floor((b.h - 7) / 2) + down, { color: col, align: 'center', font: b.font || 'main', shadow: style === 'paper' ? null : PAL.k });
    }
  },
  drawOverlay(ctx) {
    if (AudioSys.muted) Font.draw(ctx, 'MUTED (M)', W - 3, H - 9, { font: 'small', color: '#7a6a9a', align: 'right' });
    if (this.tooltip && Input.mouse.x >= 0) {
      const lines = Array.isArray(this.tooltip) ? this.tooltip : [this.tooltip];
      const w = Math.max(...lines.map((l) => Font.measure(typeof l === 'string' ? l : l.t))) + 10;
      const h = lines.length * 10 + 6;
      let x = Math.round(Input.mouse.x + 8), y = Math.round(Input.mouse.y + 10);
      if (x + w > W - 2) x = W - 2 - w;
      if (y + h > H - 2) y = Math.round(Input.mouse.y - h - 4);
      Draw.panel(ctx, x, y, w, h, 'dark');
      lines.forEach((l, i) => {
        const o = typeof l === 'string' ? { t: l, c: '#ecdcbc' } : l;
        Font.draw(ctx, o.t, x + 5, y + 4 + i * 10, { color: o.c, shadow: PAL.k });
      });
    }
  },
};

// Typewriter speech for the Reaper (and friends). One active line at a time.
class Talker {
  constructor(opts = {}) { this.text = ''; this.shown = 0; this.t = 0; this.hold = 0; this.voice = opts.voice || 0.6; this.cps = opts.cps || 38; this.queue = []; }
  say(text, hold = 2.6, force = true) {
    if (!force && (this.busy() || this.queue.length)) { this.queue.push([text, hold]); return; }
    this.queue = [];
    this.text = text; this.shown = 0; this.t = 0; this.hold = hold;
  }
  sayRandom(lines, hold) { this.say(pick(lines), hold); }
  busy() { return this.text && this.shown < this.text.length; }
  update(dt) {
    if (!this.text) { if (this.queue.length) this.say(...this.queue.shift()); return; }
    const before = Math.floor(this.shown);
    this.shown = Math.min(this.text.length, this.shown + this.cps * dt);
    const after = Math.floor(this.shown);
    for (let i = before; i < after; i++) {
      const ch = this.text[i];
      if (ch && /[a-z0-9]/i.test(ch) && i % 2 === 0) Sfx.voice(this.voice);
    }
    if (this.shown >= this.text.length) {
      this.t += dt;
      if (this.t > this.hold) { this.text = ''; if (this.queue.length) this.say(...this.queue.shift()); }
    }
  }
  talking() { return this.text && this.shown < this.text.length; }
  visible() { return !!this.text; }
  // speech bubble with a tail pointing at (tx, ty)
  drawBubble(ctx, x, y, maxW, tx, ty, opts = {}) {
    if (!this.text) return;
    const lines = Font.wrap(this.text, maxW - 12);
    const w = Math.min(maxW, Math.max(...lines.map((l) => Font.measure(l))) + 12);
    const h = lines.length * 10 + 8;
    if (opts.align === 'right') x -= w;
    if (opts.anchorBottom) y -= h;
    x = Math.round(clamp(x, 2, W - w - 2)); y = Math.round(y);
    const pop = Math.min(1, this.shown / 3);
    if (pop < 1) y += 1;
    Draw.panel(ctx, x, y, w, h, 'paper');
    // tail
    if (tx != null) {
      const bx = clamp(tx, x + 6, x + w - 8);
      const below = ty > y + h;
      ctx.fillStyle = '#efe3c8';
      for (let i = 0; i < 4; i++) {
        const yy = below ? y + h - 1 + i : y - i;
        const xx = Math.round(lerp(bx, tx, i / 4));
        ctx.fillStyle = '#43382a';
        ctx.fillRect(xx - (3 - i) - 1, yy, (3 - i) * 2 + 2, 1);
        ctx.fillStyle = '#efe3c8';
        if (3 - i > 0) ctx.fillRect(xx - (3 - i), yy, (3 - i) * 2, 1);
      }
    }
    Font.drawWrapped(ctx, this.text, x + 6, y + 5, maxW - 12, { color: PAL.N, maxChars: Math.floor(this.shown) });
  }
}

// ==== 21_backgrounds.js ====
// ---------------------------------------------------------------------------
// BACKGROUNDS — full-screen 480x270 pixel-art backdrops (Canvas2D, integer px).
//   BG.graveyard(ctx, t, opts)   battle backdrop. Units stand with feet on y = 214;
//                                x 40..440 / y 150..232 is kept clear for them.
//                                opts: fog, stars, critters (bats)  — all default true
//   BG.lab(ctx, t, opts)         the Slab. Top face y 203..212 (feet on y = 208), x 165..315,
//                                centred on x = 240; lamp hangs at x = 240, y 0..28.
//                                opts: surge (0..1 "bring to life" lamp flash), flicker (true)
//   BG.shop(ctx, t, opts)        shop interior. Counter top edge y = 196 (x 196..480).
//                                opts: layer 'back' | 'front' | (default) both, neon (0..1,
//                                default 1), flicker (true). For the Reaper: draw 'back'
//                                (wall + counter top face), then the Reaper (anchor y 202),
//                                then 'front' (counter edge + front panel + candle).
//   BG.dither(ctx, level, color) ordered-dither fade overlay, level 0 (none)..16 (solid);
//                                color = hex or PAL key, default PAL.k.
//   BG.prebuild()                rasterise every static layer now (avoids a first-use hitch).
//   BG.A                         anchor coordinates the scenes align to (see bottom).
// t is time in seconds. Every call saves/restores ctx state and paints the full screen
// (except shop 'front'). Static layers are rasterised lazily on first use by a tiny
// software pixel buffer (seeded PRNG, so identical on every load) into offscreen canvases;
