      u.revived = true;
      u.hp = Math.round(u.maxHp * 0.4);
      this.emit('undying', { u });
      return;
    }
    u.dead = true;
    u.hp = 0;
    if (u.team === 'enemy') {
      if (by && by.traits.includes('golden')) this.goldKills++;
      if (by && by.c) by.c.kills++;
    }
    this.emit('kill', { u, by });
  }

  killEnemies() { for (const e of BattleSim.alive(this.enemies())) this.kill(e, null); } // dev tool and tests

  step(dt) {
    if (this.state !== 'fight') return;
    const bdt = dt * CONFIG.battleSpeed;
    this.elapsed += bdt;
    // hellfire bolts fly on wall-clock dt, like the particles they used to be
    for (const p of this.projectiles) { p.t += dt; p.life -= dt; p.x += p.vx * dt; }
    this.projectiles = this.projectiles.filter((p) => p.life > 0);
    this.zapCd = Math.max(0, this.zapCd - bdt);
    for (const a of this.later) a.t -= bdt;
    this.later = this.later.filter((a) => { if (a.t > 0) return true; a.fn(); return false; });
    for (const u of this.units) {
      if (u.dead) continue;
      u.x += u.kx * bdt; u.kx *= Math.exp(-10 * bdt);
      u.x = clamp(u.x, ARENA.minX, ARENA.maxX);
      // status effects
      if (u.bleedT > 0) { u.bleedT -= bdt; u.hp -= 2 * bdt; }
      if (u.burnT > 0) { u.burnT -= bdt; u.hp -= 3 * bdt; }
      if (u.team === 'ally' && (u.traits.includes('regen') || u.traits.includes('golden'))) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * (u.traits.includes('golden') ? 0.03 : 0.02) * bdt);
      if (u.hp <= 0) { this.kill(u, null); continue; }
      if (u.stunT > 0) { u.stunT -= bdt; u.state = 'idle'; continue; }
      u.hasteT = Math.max(0, u.hasteT - bdt);
      const haste = u.hasteT > 0 ? 1.5 : 1;
      u.cd -= bdt * haste;
      const f = this.nearestFoe(u);
      if (!f) { u.state = 'idle'; continue; }
      const dir = f.x > u.x ? 1 : -1;
      u.facing = dir;
      const dist = Math.abs(f.x - u.x);
      if (u.state === 'attack') {
        const before = u.animT;
        u.animT += (bdt * haste) / 0.55;
        if (before < 0.5 && u.animT >= 0.5) {
          u.hits++;
          const fire = u.traits.includes('hellfire') && u.hits % 3 === 0;
          if (fire) {
            const p = { x: u.x + dir * 10, y: 0, vx: dir * 160, t: 0, life: 1.2, target: f, from: u, done: false };
            this.projectiles.push(p);
            this.emit('fireball', { u, p });
          } else if (dist <= u.range + 8) {
            // one strike per arm, a beat apart; armour bites each one separately
            const list = u.hitList && u.hitList.length ? u.hitList : [u.atk];
            list.forEach((h, k) => {
              if (k === 0) this.dealHit(u, f, { base: h });
              else this.later.push({ t: 0.12 * k, fn: () => { const foe = f.dead ? this.nearestFoe(u) : f; if (foe && !u.dead) this.dealHit(u, foe, { base: h }); } });
            });
            if (u.traits.includes('whip') && chance(0.25)) { this.emit('whip', { u }); this.later.push({ t: 0.18, fn: () => { if (!f.dead && !u.dead) this.dealHit(u, f, { mult: 0.6 }); } }); }
          } else this.emit('whiff', { u });
        }
        if (u.animT >= 1) { u.state = 'idle'; u.animT = 0; }
      } else if (dist > u.range) {
        u.state = 'walk';
        u.x += dir * u.speed * bdt * haste;
      } else {
        u.state = 'idle';
        if (u.cd <= 0) { u.state = 'attack'; u.animT = 0; u.cd = u.atkTime; this.emit('attackStart', { u }); }
      }
    }
    // keep teammates from stacking
    for (const team of ['ally', 'enemy']) {
      const list = BattleSim.alive(this.units.filter((u) => u.team === team)).sort((a, b) => a.x - b.x);
      for (let i = 1; i < list.length; i++) {
        const a = list[i - 1], b = list[i];
        const gap = Math.abs(a.y - b.y) < 6 ? 26 : 12; // same lane: don't overlap; different lanes: depth is enough
        if (b.x - a.x < gap) { const push = (gap - (b.x - a.x)) / 2; a.x -= push * 0.6; b.x += push * 0.6; }
      }
    }
    // projectiles land
    for (const p of this.projectiles) {
      if (p.done) continue;
      if (p.target.dead) { p.life = 0; continue; }
      if (Math.abs(p.x - p.target.x) < 8) { p.done = true; p.life = 0; this.emit('fireHit', { p }); this.dealHit(p.from, p.target, { mult: 1.6, fire: true }); }
    }
    if (!BattleSim.alive(this.enemies()).length) this.conclude(true);
    else if (!BattleSim.alive(this.allies()).length) this.conclude(false);
  }

  conclude(won) {
    if (this.over) return;
    this.over = true;
    this.won = won;
    this.state = 'over';
    this.emit('over', { won });
  }
}

// ==== 20_engine.js ====
// ---------------------------------------------------------------------------
// ENGINE — 480x270 pixel canvas, input (keys, pointer/touch, gamepad), scenes
// with dither transitions, and the juice: shake, hit-pause, slow-mo, flash,
// particles, floating text. Plus tiny pixel UI widgets.
// ---------------------------------------------------------------------------
const W = 480, H = 270;

// ------------------------------------------------------------------- input
const Input = {
  down: {}, pressed: {}, released: {},
  mouse: { x: -1, y: -1, down: false, pressed: false, released: false, moved: false },
  pad: { left: false, right: false, a: false, b: false, prev: {} },
  anyPressed: false,
  lastDevice: 'mouse',
  KEYMAP: {}, // key code -> action, built from the player's bindings (Settings.v.keys)
  capture: null, // while set, the next key press goes here instead of the game (the remap screen)
  setBindings(keys) {
    const map = {};
    for (const a of KEY_ACTIONS) for (const c of keys[a.id] || []) if (c) map[c] = a.id;
    this.KEYMAP = map;
    this.down = {}; this.pressed = {};
  },
  // Ctrl/Cmd/Alt held with another key is the browser's (or the OS's), never the game's. A modifier pressed on
  // its own is an ordinary key, so a player can still bind one (Left Ctrl to drop, say) on the remap screen.
  shortcut(e) {
    const c = e.code || '';
    return (e.ctrlKey && !c.startsWith('Control')) || (e.metaKey && !c.startsWith('Meta') && !c.startsWith('OS')) || (e.altKey && !c.startsWith('Alt'));
  },
  init(canvas) {
    this.setBindings(Settings.v.keys);
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' && e.code === 'Space')) return;
      if (this.shortcut(e)) return; // browser shortcuts (Ctrl+1 switches tab, Ctrl+E, Cmd+Q...) are not game keys
      if (this.capture) { e.preventDefault(); if (!e.repeat) { const f = this.capture; this.capture = null; f(e.code); } return; }
      const act = this.KEYMAP[e.code];
      if (act || e.code === 'Space') e.preventDefault();
      if (!e.repeat) {
        this.pressed[e.code] = true;
        if (act) this.pressed[act] = true;
        this.anyPressed = true;
      }
      this.down[e.code] = true;
      if (act) this.down[act] = true;
      this.lastDevice = 'keys';
      AudioSys.init();
    });
    window.addEventListener('keyup', (e) => {
      const act = this.KEYMAP[e.code];
      this.down[e.code] = false;
      if (act) {
        // only release the action if no other key mapped to it is held
        const still = Object.keys(this.KEYMAP).some((k) => this.KEYMAP[k] === act && this.down[k]);
        if (!still) { this.down[act] = false; this.released[act] = true; }
      }
    });
    window.addEventListener('blur', () => { this.down = {}; this.mouse.down = false; });
    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      this.mouse.x = ((e.clientX - r.left) / r.width) * W;
      this.mouse.y = ((e.clientY - r.top) / r.height) * H;
      this.mouse.moved = true;
    };
    canvas.addEventListener('pointerdown', (e) => {
      pos(e);
      this.mouse.down = true; this.mouse.pressed = true; this.anyPressed = true;
      this.lastDevice = e.pointerType === 'touch' ? 'touch' : 'mouse';
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      try { window.focus(); canvas.focus({ preventScroll: true }); } catch (err) { /* embedded page: best effort */ }
      AudioSys.init();
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => { pos(e); if (e.pointerType !== 'touch') this.lastDevice = 'mouse'; });
    const up = (e) => { pos(e); if (this.mouse.down) this.mouse.released = true; this.mouse.down = false; };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') { this.mouse.x = -1; this.mouse.y = -1; } });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  },
  pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads && [...pads].find((p) => p && p.connected);
    const P = this.pad;
    if (!gp) { P.left = P.right = P.a = P.b = P.x = P.y = P.lb = P.rb = false; return; }
    const ax = gp.axes[0] || 0;
    const now = {
      left: ax < -0.4 || (gp.buttons[14] && gp.buttons[14].pressed),
      right: ax > 0.4 || (gp.buttons[15] && gp.buttons[15].pressed),
      up: (gp.axes[1] || 0) < -0.5 || (gp.buttons[12] && gp.buttons[12].pressed),
      down: (gp.axes[1] || 0) > 0.5 || (gp.buttons[13] && gp.buttons[13].pressed),
      a: gp.buttons[0] && gp.buttons[0].pressed,
      b: gp.buttons[1] && gp.buttons[1].pressed,
      x: gp.buttons[2] && gp.buttons[2].pressed, // quake
      y: gp.buttons[3] && gp.buttons[3].pressed, // iron grip
      lb: gp.buttons[4] && gp.buttons[4].pressed, // nudge left
      rb: gp.buttons[5] && gp.buttons[5].pressed, // nudge right
    };
    for (const k in now) {
      if (now[k] && !P.prev[k]) { this.pressed[k] = true; this.anyPressed = true; this.lastDevice = 'pad'; }
      if (!now[k] && P.prev[k]) this.released[k] = true;
      P[k] = now[k];
    }
    P.prev = now;
  },
  held(act) { return !!(this.down[act] || this.pad[act]); },
  // which key currently does this, for on-screen prompts (follows the player's bindings)
  keyFor(act) { return Settings.hint(act); },
  hit(act) { return !!this.pressed[act]; },
  endFrame() {
    this.pressed = {}; this.released = {}; this.anyPressed = false;
    this.mouse.pressed = false; this.mouse.released = false; this.mouse.moved = false;
  },
  over(x, y, w, h) { const m = this.mouse; return m.x >= x && m.y >= y && m.x < x + w && m.y < y + h; },
};

// ------------------------------------------------------------------ engine
const Engine = {
  canvas: null, ctx: null, scale: 1,
  t: 0, realT: 0, frame: 0,
  scenes: {}, scene: null, sceneName: '',
  trans: null,
  shakeMag: 0, shakeT: 0, shakeX: 0, shakeY: 0,
  pauseT: 0, slowT: 0, slowScale: 1,
  flashT: 0, flashDur: 0, flashColor: '#fff',
  paused: false,
  overlays: [], // menus stacked over the game; the top one gets input. A non-live overlay freezes the scene under it.
  errorRun: 0,  // consecutive frames whose scene code threw

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    Input.init(this.canvas);
    const resize = () => {
      // fit the canvas inside whatever the page leaves free (gutters, safe areas, the hint line)
      const px = (cs, k) => parseFloat(cs[k]) || 0;
      const de = document.documentElement, bs = getComputedStyle(document.body), rs = getComputedStyle(de);
      const hint = document.getElementById('under');
      const avW = de.clientWidth - px(bs, 'paddingLeft') - px(bs, 'paddingRight') - px(rs, 'paddingLeft') - px(rs, 'paddingRight');
      const avH = de.clientHeight - px(bs, 'paddingTop') - px(bs, 'paddingBottom') - px(rs, 'paddingTop') - px(rs, 'paddingBottom')
        - (hint && hint.offsetParent ? hint.offsetHeight + 6 : 0);
      let s = Math.min(avW / W, avH / H);
      if (s >= 2 && s - Math.floor(s) < 0.34) s = Math.floor(s); // snap to whole pixels when it costs little
      s = Math.max(0.5, s);
      this.scale = s;
      this.canvas.style.width = Math.floor(W * s) + 'px';
      this.canvas.style.height = Math.floor(H * s) + 'px';
    };
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
    resize();
  },

  add(name, scene) { this.scenes[name] = scene; scene.name = name; },

  // A scene threw. Report it (once per distinct error, see CrashLog) and keep the game alive: if the same
  // scene keeps failing, drop back to the shop rather than freezing on a broken screen.
  fault(e, where) {
    this.errorRun++;
    if (typeof CrashLog !== 'undefined') CrashLog.report(e, where + ' in ' + (this.sceneName || '?')); else console.error(e);
    if (this.errorRun >= 30 && this.sceneName !== 'shop' && this.scenes.shop) { this.errorRun = 0; this.closeAll(); this.trans = null; this._switch(this.scenes.shop, { skipIntro: true }); }
  },

  // style: 'dither' (pixel fade through black) | 'cut'
  go(name, params, style = 'dither') {
    if (this.trans) return;
    const to = this.scenes[name];
    if (style === 'cut' || !this.scene) { this._switch(to, params); return; }
    this.trans = { to, params, t: 0, dur: 0.22, phase: 'out' };
    if (typeof Sfx !== 'undefined') Sfx.play('transition');
  },
  _switch(to, params) {
    const from = this.scene;
    if (from && from.exit) from.exit(to);
    this.scene = to;
    this.sceneName = to.name;
    Telemetry.scene(to.name);
    if (to.enter) to.enter(params || {}, from);
    Save.soon();
  },

  shake(mag, dur = 0.25) {
    mag *= CONFIG.shake;
    if (mag >= this.shakeMag * (this.shakeT > 0 ? 1 : 0)) { this.shakeMag = mag; this.shakeT = dur; this.shakeDur = dur; }
  },
  hitPause(sec) { this.pauseT = Math.max(this.pauseT, sec * CONFIG.hitPause); },
  slowmo(scale, sec) { if (!CONFIG.slowmo) return; this.slowScale = scale; this.slowT = sec; },
  flash(color = '#fff', dur = 0.15) { if (Settings.v.reduceFlash) return; this.flashColor = color; this.flashT = dur; this.flashDur = dur; },

  // ---- overlays (pause, settings, title...): the game holds its breath while one is open
  open(overlay, params) {
    this.overlays.push(overlay);
    overlay.parent = this.overlays.length > 1 ? this.overlays[this.overlays.length - 2] : null;
    if (overlay.enter) overlay.enter(params || {});
    if (!overlay.live) { Sfx.motor(0, 0); Music.dim(true); }
    // the press that opened a menu belongs to the opener: without this the menu's own update, later in the
    // same frame, sees it too (P opened pause and immediately closed it)
    Input.mouse.down = false; Input.mouse.pressed = false; Input.pressed = {}; Input.anyPressed = false;
  },
  close() {
    const o = this.overlays.pop();
    if (o && o.exit) o.exit();
    UI.set([]);
    Input.mouse.down = false; Input.pressed = {};
    if (!this.overlays.some((x) => !x.live)) Music.dim(false);
    if (this.overlays.length) { const t = this.overlays[this.overlays.length - 1]; if (t.resume) t.resume(); }
  },
  // Close everything properly (exit hooks, key capture, dimmed music). Never write `overlays.length = 0`: it
  // skips all of that and leaves the music dim and the next key press swallowed by a rebind.
  closeAll() {
    while (this.overlays.length) { const o = this.overlays.pop(); if (o.exit) { try { o.exit(); } catch (e) { /* closing must not fail */ } } }
    Input.capture = null; Input.mouse.down = false; Input.pressed = {};
    UI.set([]);
    Music.dim(false);
  },
  get top() { return this.overlays.length ? this.overlays[this.overlays.length - 1] : null; },
  // true while something is frozen the world: the pause menu says "no game actions" and means it
  get frozen() { return this.overlays.some((o) => !o.live); },


  loop(now) {
    const realDt = Math.min(0.05, (now - (this._last || now)) / 1000);
    this._last = now;
    this.realT += realDt;
    Input.pollPad();
    // keys that work everywhere, and follow the player's bindings
    if (Input.hit('mute')) { Settings.v.muted = AudioSys.toggleMute(); Save.soon(); }
    if (Input.hit('fullscreen') && typeof Platform !== 'undefined') Platform.fullscreen();
    if (Input.hit('pause') && this.scene && !this.overlays.length && this.scene.pausable !== false && !this.trans && typeof Overlays !== 'undefined') Overlays.pause();
    let dt = realDt;
    if (this.pauseT > 0) { this.pauseT -= realDt; dt = 0; }
    if (this.slowT > 0) { this.slowT -= realDt; dt *= this.slowScale; }
    if (this.paused || this.frozen) dt = 0;
    if (!this.frozen && this.scene && this.scene.tracksTime !== false) Game.playTime += realDt;
    this.t += dt;
    this.dt = dt;
    this.frame++;

    // transition
    if (this.trans) {
      const tr = this.trans;
      tr.t += realDt;
      if (tr.phase === 'out' && tr.t >= tr.dur) { this._switch(tr.to, tr.params); tr.phase = 'in'; tr.t = 0; }
      else if (tr.phase === 'in' && tr.t >= tr.dur) this.trans = null;
    }

    if (this.scene && (!this.trans || this.trans.phase === 'in') && !this.frozen) {
      try { this.scene.update(dt, realDt); this.errorRun = 0; } catch (e) { this.fault(e, 'update'); }
    }
    const ov = this.top;
    if (ov) { try { ov.update(realDt); } catch (e) { this.fault(e, 'overlay'); this.closeAll(); } }
    UI.update(realDt);
    if (typeof Debug !== 'undefined' && Debug.update) Debug.update(realDt);

    // shake
    if (this.shakeT > 0) {
      this.shakeT -= realDt;
      const k = Math.max(0, this.shakeT / this.shakeDur);
      const m = this.shakeMag * k;
      this.shakeX = Math.round(vrand(-m, m));
      this.shakeY = Math.round(vrand(-m, m));
    } else { this.shakeX = this.shakeY = 0; }

    // draw
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = PAL.k;
    ctx.fillRect(0, 0, W, H);
    ctx.translate(this.shakeX, this.shakeY);
    try { if (this.scene) this.scene.draw(ctx); } catch (e) { this.fault(e, 'draw'); }
    ctx.restore();
    if (this.flashT > 0) {
      this.flashT -= realDt;
      ctx.globalAlpha = clamp(this.flashT / this.flashDur, 0, 1) * 0.85;
      ctx.fillStyle = this.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    for (const o of this.overlays.slice()) { try { o.draw(ctx); } catch (e) { this.fault(e, 'overlay draw'); this.closeAll(); break; } }
    if (typeof Overlays !== 'undefined') Overlays.drawToast(ctx, realDt);
    UI.drawOverlay(ctx);
    if (this.trans) {
      const tr = this.trans;
      const k = tr.phase === 'out' ? tr.t / tr.dur : 1 - tr.t / tr.dur;
      BG.dither(ctx, Math.round(clamp(k, 0, 1) * 16), PAL.k);
    }
    Input.endFrame();
    requestAnimationFrame((n) => this.loop(n));
  },
};

// --------------------------------------------------------------- particles
// One pool per scene; coordinates are whatever space the scene draws in.
class Particles {
  constructor() { this.list = []; }
  add(p) {
    const q = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, ay: 0, drag: 0, life: 0.6, size: 1, color: '#fff', rot: 0, vr: 0, floor: null, bounce: 0.35, t: 0, fade: true }, p);
    q.max = q.life;
    this.list.push(q);
    return q;
  }
  burst(x, y, n, opts) {
    for (let i = 0; i < n; i++) {
      const a = opts.angle != null ? opts.angle + vrand(-opts.spread || 0, opts.spread || 0) : vrand(0, Math.PI * 2);
      const sp = vrand(opts.speed * 0.4, opts.speed);
      this.add(Object.assign({}, opts, {
        x: x + vrand(-(opts.jitter || 0), opts.jitter || 0), y: y + vrand(-(opts.jitter || 0), opts.jitter || 0),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        color: Array.isArray(opts.color) ? vpick(opts.color) : opts.color,
        life: vrand((opts.life || 0.6) * 0.6, opts.life || 0.6),
        size: opts.sizes ? vpick(opts.sizes) : opts.size || 1,
      }));
    }
  }
  text(x, y, str, color, opts = {}) {
    return this.add(Object.assign({ kind: 'text', x, y, vy: -28, drag: 3, life: 0.9, text: str, color, font: 'small', outline: PAL.k }, opts));
  }
  update(dt) {
    for (const p of this.list) {
      p.t += dt;
      p.life -= dt;
      p.vy += p.ay * dt;
      if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.floor != null && p.y > p.floor) {
        p.y = p.floor;
        p.vy = -Math.abs(p.vy) * p.bounce;
        p.vx *= 0.7; p.vr *= 0.6;
        if (Math.abs(p.vy) < 12) { p.vy = 0; p.ay = 0; p.vr = 0; }
      }
    }
    this.list = this.list.filter((p) => p.life > 0);
  }
  draw(ctx) {
    for (const p of this.list) {
      const a = p.fade ? clamp(p.life / (p.max * 0.5), 0, 1) : 1;
      if (p.kind === 'proj') continue;
      if (p.kind === 'text') {
        const pop = p.t < 0.12 ? 1 + (1 - p.t / 0.12) * 0.0 : 1;
        Font.draw(ctx, p.text, Math.round(p.x), Math.round(p.y), { font: p.font, color: p.color, outline: p.outline, align: 'center', alpha: a, scale: p.scale || pop });
      } else if (p.kind === 'spr') {
        SPR.draw(ctx, p.spr, p.x, p.y, { rot: p.rot, alpha: a, flip: p.flip, solid: p.solid });
      } else if (p.kind === 'ring') {
        ctx.globalAlpha = a;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1;
        const r = p.r0 + (p.r1 - p.r0) * (1 - p.life / p.max);
        ctx.beginPath(); ctx.arc(Math.round(p.x), Math.round(p.y), r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        const s = p.size;
        ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
        ctx.globalAlpha = 1;
      }
    }
  }
}

// ------------------------------------------------------------ pixel drawing
const Draw = {
  rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
  frame(ctx, x, y, w, h, c) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  },
  // Bevelled pixel panel like the reference UI (dark slate with a light rim).
  panel(ctx, x, y, w, h, style = 'dark') {
    const S = {
      dark: ['#0e0b16', '#1d1a2c', '#3b3654', '#26223a'],
      slate: ['#0e0b16', '#222634', '#4b556b', '#2d3344'],
      green: ['#0e0b16', '#1d3a2a', '#5fb86a', '#2e5c3f'],
      paper: ['#43382a', '#efe3c8', '#fff6e3', '#d4c19c'],
      wood: ['#1e120b', '#6a4026', '#b07a4a', '#4e2e1b'],
      neon: ['#0e0b16', '#241230', '#b84a7c', '#3a1a44'],
      red: ['#0e0b16', '#3a1424', '#e8405a', '#5a1a30'],
    }[style];
    const [ol, fill, hi, lo] = S;
    // outline with cut corners
    this.rect(ctx, x + 1, y, w - 2, h, ol);
    this.rect(ctx, x, y + 1, w, h - 2, ol);
    this.rect(ctx, x + 1, y + 1, w - 2, h - 2, fill);
    this.rect(ctx, x + 2, y + 1, w - 4, 1, hi);
    this.rect(ctx, x + 1, y + 2, 1, h - 4, hi);
    this.rect(ctx, x + 2, y + h - 2, w - 4, 1, lo);
    this.rect(ctx, x + w - 2, y + 2, 1, h - 4, lo);
  },
  // hard-edged pixel line (Bresenham)
  line(ctx, x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    ctx.fillStyle = c;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, n = 0;
    for (;;) {
      ctx.fillRect(x0, y0, 1, 1);
      if ((x0 === x1 && y0 === y1) || n++ > 2000) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },
  // soft additive glow (used sparingly for lights)
  glow(ctx, x, y, r, color, alpha = 0.5) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    const op = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = op;
  },
  // jagged lightning bolt
  bolt(ctx, x0, y0, x1, y1, color, jag = 8, seed = 1) {
    const r = mulberry32(seed);
    const pts = [[x0, y0]];
    const n = Math.max(3, Math.round(Math.hypot(x1 - x0, y1 - y0) / 10));
    for (let i = 1; i < n; i++) {
      const t = i / n;
      pts.push([lerp(x0, x1, t) + (r() - 0.5) * jag * 2, lerp(y0, y1, t) + (r() - 0.5) * jag * 0.6]);
    }
    pts.push([x1, y1]);
    for (let i = 0; i < pts.length - 1; i++) {
      this.line(ctx, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], color);
      this.line(ctx, pts[i][0] + 1, pts[i][1], pts[i + 1][0] + 1, pts[i + 1][1], color);
    }
    return pts;
  },
};

// ------------------------------------------------------------------ widgets
// Buttons are plain objects owned by scenes; UI.update() handles hover/click
// for the buttons registered this frame by the current scene.
const UI = {
  buttons: [],
  tooltip: null,
  hoverId: null,
  focusAt: [0, 0],
  focusId: null, // keyboard / gamepad focus, for scenes that opt in with `uiNav` (the slab): arrows move it, confirm presses it
  set(buttons) { this.buttons = buttons; },
  focusable() { return this.buttons.filter((b) => !b.hidden && b.kind !== 'hot' && b.w > 0); },
  focused() { return this.focusId ? this.buttons.find((b) => b.id === this.focusId) : null; },
  // move focus to the nearest button in a direction (centre to centre; sideways drift counts double)
  moveFocus(dx, dy) {
    const list = this.focusable();
    if (!list.length) return;
    const cur = this.focused();
    if (!cur) { this.focusId = list[0].id; return; }
    const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
    let best = null, bs = 1e9;
    for (const b of list) {
      if (b === cur) continue;
      const ax = b.x + b.w / 2 - cx, ay = b.y + b.h / 2 - cy;
      const along = ax * dx + ay * dy, across = Math.abs(ax * dy) + Math.abs(ay * dx);
      if (along <= 1) continue;
      const sc = along + across * 2;
      if (sc < bs) { bs = sc; best = b; }
    }
    if (best) { this.focusId = best.id; Sfx.play('ui_hover'); } else Sfx.play('ui_deny');
  },
  update() {
    const m = Input.mouse;
    if (Engine.scene && Engine.scene.uiNav && !Engine.overlays.length && !Engine.trans) {
      if (m.moved) this.focusId = null; // the mouse takes over
      const dir = [['left', -1, 0], ['right', 1, 0], ['up', 0, -1], ['down', 0, 1]].find(([a]) => Input.hit(a));
      if (dir) this.moveFocus(dir[1], dir[2]);
      let f = this.focused();
      if (f) this.focusAt = [f.x + f.w / 2, f.y + f.h / 2];
      else if (this.focusId) { // the focused button is gone (a part was stitched): carry on from the nearest one
        const near = this.focusable().map((b) => [Math.hypot(b.x + b.w / 2 - this.focusAt[0], b.y + b.h / 2 - this.focusAt[1]), b]).sort((a, b) => a[0] - b[0])[0];
        this.focusId = near ? near[1].id : null; f = this.focused();
      }
      if (f && Input.hit('a')) {
        if (f.disabled) { Sfx.play('ui_deny'); if (f.onDeny) f.onDeny(); }
        else if (f.onClick) { f.pressT = 1; if (!f.silent) Sfx.play(f.sound || 'ui_click'); f.onClick(); }
      }
    } else if (this.focusId && !(Engine.scene && Engine.scene.uiNav)) this.focusId = null;
    let hover = null;
    for (const b of this.buttons) {
      if (b.hidden) continue;
      const over = m.x >= 0 && Input.over(b.x, b.y, b.w, b.h);
      b.hover = over && !b.disabled;
      b.held = over && m.down;
      if (over) hover = b;
      b.pressT = Math.max(0, (b.pressT || 0) - 0.05);
    }
    const hid = hover && !hover.disabled ? hover.id || hover.label : null;
    if (hid && hid !== this.hoverId && Input.lastDevice === 'mouse' && !(hover && hover.silent)) Sfx.play('ui_hover');
    this.hoverId = hid;
    if (m.pressed && hover && !Engine.trans) {
      if (hover.disabled) { Sfx.play('ui_deny'); if (hover.onDeny) hover.onDeny(); }
      else if (hover.onClick) {
        hover.pressT = 1;
        if (!hover.silent) Sfx.play(hover.sound || 'ui_click');
        hover.onClick();
      }
    }
    this.tooltip = hover && hover.tip ? hover.tip : null;
  },
  drawButton(ctx, b) {
    if (b.hidden) return;
    const style = b.disabled ? 'dark' : b.style || 'dark';
    const down = b.held || b.pressT > 0.5 ? 1 : 0;
    Draw.panel(ctx, b.x, b.y + down, b.w, b.h, style);
    if (b.hover && !b.disabled) Draw.frame(ctx, b.x - 1, b.y - 1 + down, b.w + 2, b.h + 2, b.hoverColor || '#fff6e3');
    const col = b.disabled ? '#5b4a78' : b.textColor || (style === 'paper' ? PAL.N : style === 'wood' ? '#fff1c8' : '#ecdcbc');
    if (b.icon) {
      SPR.draw(ctx, b.icon, b.x + 8, b.y + b.h / 2 + down);
      Font.draw(ctx, b.label, b.x + 16, b.y + Math.floor((b.h - 7) / 2) + down, { color: col, shadow: style === 'paper' ? null : PAL.k });
    } else {
      Font.draw(ctx, b.label, b.x + b.w / 2, b.y + Math.floor((b.h - 7) / 2) + down, { color: col, align: 'center', font: b.font || 'main', shadow: style === 'paper' ? null : PAL.k });
    }
  },
  drawOverlay(ctx) {
    if (AudioSys.muted) Font.draw(ctx, 'MUTED (' + Settings.hint('mute') + ')', W - 3, H - 9, { font: 'small', color: '#7a6a9a', align: 'right' });
    const fb = Engine.overlays.length ? null : this.focused();
    if (fb) {
      Draw.frame(ctx, fb.x - 2, fb.y - 2, fb.w + 4, fb.h + 4, '#000000');
      Draw.frame(ctx, fb.x - 1, fb.y - 1, fb.w + 2, fb.h + 2, '#fff6e3');
      if (fb.tip) this.drawTip(ctx, fb.tip, fb.x + fb.w + 4, fb.y);
    }
    if (this.tooltip && Input.mouse.x >= 0 && !fb) this.drawTip(ctx, this.tooltip, Input.mouse.x + 8, Input.mouse.y + 10, Input.mouse.y);
  },
  drawTip(ctx, tip, tx, ty, flipY) {
    const lines = Array.isArray(tip) ? tip : [tip];
    const w = Math.max(...lines.map((l) => Font.measure(typeof l === 'string' ? l : l.t))) + 10;
    const h = lines.length * 10 + 6;
    let x = Math.round(tx), y = Math.round(ty);
    if (x + w > W - 2) x = Math.max(2, Math.round(W - 2 - w));
    if (y + h > H - 2) y = flipY != null ? Math.round(flipY - h - 4) : H - 2 - h;
    Draw.panel(ctx, x, y, w, h, 'dark');
    lines.forEach((l, i) => {
      const o = typeof l === 'string' ? { t: l, c: '#ecdcbc' } : l;
      Font.draw(ctx, o.t, x + 5, y + 4 + i * 10, { color: o.c, shadow: PAL.k });
    });
  },
};

// Typewriter speech for the Reaper (and friends). One active line at a time.
class Talker {
  constructor(opts = {}) { this.text = ''; this.shown = 0; this.t = 0; this.hold = 0; this.voice = opts.voice || 0.6; this.cps = opts.cps || 38; this.queue = []; }
  say(text, hold = 2.6, force = true) {
    if (!force && (this.busy() || this.queue.length)) { this.queue.push([text, hold]); return; }
    this.queue = [];
    this.text = text; this.shown = 0; this.t = 0; this.hold = hold;
    if (typeof Announce !== 'undefined') Announce.say(text);
  }
  busy() { return this.text && this.shown < this.text.length; }
  update(dt) {
    if (!this.text) { if (this.queue.length) this.say(...this.queue.shift()); return; }
    const before = Math.floor(this.shown);
    this.shown = Math.min(this.text.length, this.shown + this.cps * dt);
    const after = Math.floor(this.shown);
    for (let i = before; i < after; i++) {
      const ch = this.text[i];
      if (ch && /[a-z0-9]/i.test(ch) && i % 2 === 0) Sfx.voice(this.voice);
    }
    if (this.shown >= this.text.length) {
      this.t += dt;
      if (this.t > this.hold) { this.text = ''; if (this.queue.length) this.say(...this.queue.shift()); }
    }
  }
  clear() { this.text = ''; this.queue = []; }
  talking() { return this.text && this.shown < this.text.length; }
  visible() { return !!this.text; }
  // speech bubble with a tail pointing at (tx, ty)
  drawBubble(ctx, x, y, maxW, tx, ty, opts = {}) {
    if (!this.text) return;
    const lines = Font.wrap(this.text, maxW - 12);
    const w = Math.min(maxW, Math.max(...lines.map((l) => Font.measure(l))) + 12);
    const h = lines.length * 10 + 8;
    if (opts.align === 'right') x -= w;
    if (opts.anchorBottom) y -= h;
    x = Math.round(clamp(x, 2, W - w - 2)); y = Math.round(y);
    const pop = Math.min(1, this.shown / 3);
    if (pop < 1) y += 1;
    Draw.panel(ctx, x, y, w, h, 'paper');
    // tail
    if (tx != null && opts.side === 'left') { // bubble beside the speaker: little tail on its left edge
      const by = Math.round(clamp(ty, y + 5, y + h - 6));
      ctx.fillStyle = '#efe3c8'; ctx.fillRect(x, by - 2, 1, 4); // open a gap in the border
      for (let i = 0; i < 4; i++) {
        const xx = x - 1 - i, hh = 3 - i;
        ctx.fillStyle = '#43382a'; ctx.fillRect(xx, by - hh - 1, 1, hh * 2 + 2);
        ctx.fillStyle = '#efe3c8'; if (hh > 0) ctx.fillRect(xx, by - hh, 1, hh * 2);
      }
    } else if (tx != null) {
      const bx = clamp(tx, x + 6, x + w - 8);
      const below = ty > y + h;
      ctx.fillStyle = '#efe3c8';
      for (let i = 0; i < 4; i++) {
        const yy = below ? y + h - 1 + i : y - i;
        const xx = Math.round(lerp(bx, tx, i / 4));
        ctx.fillStyle = '#43382a';
        ctx.fillRect(xx - (3 - i) - 1, yy, (3 - i) * 2 + 2, 1);
        ctx.fillStyle = '#efe3c8';
        if (3 - i > 0) ctx.fillRect(xx - (3 - i), yy, (3 - i) * 2, 1);
      }
    }
    Font.drawWrapped(ctx, this.text, x + 6, y + 5, maxW - 12, { color: PAL.N, maxChars: Math.floor(this.shown) });
  }
}

// ==== 21_backgrounds.js ====
// ---------------------------------------------------------------------------
// BACKGROUNDS — full-screen 480x270 pixel-art backdrops (Canvas2D, integer px).
//   BG.graveyard(ctx, t, opts)   battle backdrop. Units stand with feet on y = 214;
//                                x 40..440 / y 150..232 is kept clear for them.
//                                opts: fog, stars, critters (bats)  — all default true
//   BG.lab(ctx, t, opts)         the Slab. Top face y 203..212 (feet on y = 208), x 165..315,
//                                centred on x = 240; lamp hangs at x = 240, y 0..28.
//                                opts: surge (0..1 "bring to life" lamp flash), flicker (true)
//   BG.shop(ctx, t, opts)        shop interior. Counter top edge y = 196 (x 196..480).
//                                opts: layer 'back' | 'front' | (default) both, neon (0..1,
//                                default 1), flicker (true). For the Reaper: draw 'back'
//                                (wall + counter top face), then the Reaper (anchor y 202),
//                                then 'front' (counter edge + front panel + candle).
//   BG.dither(ctx, level, color) ordered-dither fade overlay, level 0 (none)..16 (solid);
//                                color = hex or PAL key, default PAL.k.
//   BG.prebuild()                rasterise every static layer now (avoids a first-use hitch).
//   BG.A                         anchor coordinates the scenes align to (see bottom).
// t is time in seconds. Every call saves/restores ctx state and paints the full screen
// (except shop 'front'). Static layers are rasterised lazily on first use by a tiny
// software pixel buffer (seeded PRNG, so identical on every load) into offscreen canvases;
// each frame blits them and draws only the animated bits. No DOM access at load time.

// ---------------------------------------------------------------------------
// THE RIG — the rules of the RNG manipulation layer (docs/RNG_LAYER.md).
// Luck (earned from bad luck, spent on levers), what each lever costs, TILT heat,
// and use(): the one door every lever goes through (buttons, hotkeys, tests).
// The physics lives in the sim (12_clawrig.js) and the presentation in the claw
// scene; this file only decides what is allowed and what it costs, so it can be
// checked with no screen at all (tools/rig_check.mjs).
//   Rig.use('quake')            Rig.use('order', 'torso')        Rig.can('redo')
//   Rig.onEvent = (type, data) => ...   'luck' 'deny' 'used' 'tilt'
// ---------------------------------------------------------------------------
const ORDER_SLOTS = ['head', 'torso', 'arm', 'leg', 'heart', 'back'];

// Presentation metadata for the UI. `cost` names the CONFIG key (null = free). The keys are the player's
// own (KEY_ACTIONS in 09_store.js: Q E nudge, 1-4 the levers by default), so the UI asks Settings.hint(id).
const RIG_TRICKS = {
  quake: { name: 'Earthquake', label: 'QUAKE', cost: 'costQuake', color: '#ffb070',
    tip: ['Shake the whole machine.', 'The pile churns into a new layout.', 'Drops lock until it settles.'] },
  nudgeL: { name: 'Nudge left', label: 'NUDGE', cost: null, color: '#ecdcbc',
    tip: ['Bump the glass to the left.', 'Loosens the pile around the claw.', 'Nudge too fast and it TILTs.'] },
  nudgeR: { name: 'Nudge right', label: 'NUDGE', cost: null, color: '#ecdcbc',
    tip: ['Bump the glass to the right.', 'Loosens the pile around the claw.', 'Nudge too fast and it TILTs.'] },
  grip: { name: 'Iron Grip', label: 'GRIP', cost: 'costGrip', color: '#f6c64b',
    tip: ['Hex the claw for the next drop.', 'It catches more, holds harder and', 'shrugs off a rough carry.', 'Press again to take it back.'] },
  order: { name: 'Special Order', label: 'ORDER', cost: 'costOrder', color: '#6fd3ff',
    tip: ['Pick a slot. The Reaper drops', 'one in from the back room.', 'Rarity is still the luck of the draw.'] },
  redo: { name: 'Redo', label: 'REDO', cost: 'costRedo', color: '#e7a6f0',
    tip: ['Turn back time after a missed or', 'slipped grab: same pile, token back,', 'another go at it.'] },
};

const Rig = {
  luck: 0,
  heat: 0, // nudge heat: past CONFIG.tiltAt the next nudge TILTs the machine
  riggedNext: false, // a lever was used since the last drop (telemetry: rigged vs plain grabs)
  onEvent: null, // (type, data) => void, set by the claw scene

  get on() { return CONFIG.rigOn > 0; },
  reset() {
    this.luck = Math.min(CONFIG.luckStart, CONFIG.luckMax);
    this.heat = 0;
    this.riggedNext = false;
  },
  emit(type, data) { if (this.onEvent) this.onEvent(type, data || {}); },

  cost(name) {
    const t = RIG_TRICKS[name];
    return !t || !t.cost || CONFIG.rigFree ? 0 : CONFIG[t.cost];
  },
  tilted() { const s = Game.sim; return !!s && s.lockWhy === 'tilt' && s.lockT > 0; },
  takeRigged() { const r = this.riggedNext; this.riggedNext = false; return r; },

  // ---------------------------------------------------------------- Luck
  gain(n, why) {
    if (!this.on || !(n > 0)) return 0;
    const got = Math.min(n, Math.max(0, CONFIG.luckMax - this.luck));
    this.luck += got;
    const c = Telemetry.c;
    c.luckEarned += got; c.luckWasted += n - got;
    c.luckBy[why] = (c.luckBy[why] || 0) + got;
    this.emit('luck', { delta: got, total: this.luck, why, wasted: n - got });
    return got;
  },
  refund(n, why) { // Luck handed back (disarming Iron Grip): not "earned", and never above the cap
    const got = Math.min(n, Math.max(0, CONFIG.luckMax - this.luck));
    this.luck += got;
    const c = Telemetry.c;
    c.luckSpent = Math.max(0, c.luckSpent - got); // it was never really spent
    if (got) this.emit('luck', { delta: got, total: this.luck, why });
    return got;
  },
  lose(n, why) { // spend or penalty: never below zero
    n = Math.min(this.luck, n);
    if (n <= 0) return 0;
    this.luck -= n;
    Telemetry.c.luckSpent += n;
    this.emit('luck', { delta: -n, total: this.luck, why });
    return n;
  },

  // ---------------------------------------------------------------- rules
  // { ok, why, cost }. why: 'off' | 'state' | 'tilt' | 'busy' | 'none' | 'luck'
  can(name) {
    if (!this.on) return { ok: false, why: 'off' };
    const sim = Game.sim;
    if (!sim || !RIG_TRICKS[name]) return { ok: false, why: 'state' };
    if (this.tilted()) return { ok: false, why: 'tilt' };
    const cost = this.cost(name);
    switch (name) {
      case 'quake':
        if (sim.state !== 'idle' || sim.lockT > 0 || sim.quakeS) return { ok: false, why: 'busy', cost };
        break;
      case 'nudgeL': case 'nudgeR':
        if (sim.state !== 'idle' || sim.lockT > 0) return { ok: false, why: 'busy', cost: 0 };
        return { ok: true, cost: 0 };
      case 'grip':
        if (sim.state !== 'idle') return { ok: false, why: 'busy', cost };
        if (sim.iron) return { ok: true, cost: 0, disarm: true, refund: cost };
        break;
      case 'order':
        if (sim.state !== 'idle') return { ok: false, why: 'busy', cost };
        break;
      case 'redo':
        if (sim.state !== 'idle') return { ok: false, why: 'busy', cost }; // mid-rewind (or mid-drop)
        if (!sim.canRedo()) return { ok: false, why: 'none', cost };
        break;
    }
    return this.luck < cost ? { ok: false, why: 'luck', cost } : { ok: true, cost };
  },

  // Do it: check the rules, move the machine, charge the Luck. The sim acts first and the
  // Luck is only charged if it actually happened.
  use(name, arg) {
    const c = this.can(name);
    if (!c.ok) { this.emit('deny', { name, why: c.why, cost: c.cost }); return c; }
    const sim = Game.sim, T = Telemetry.c;
    const out = { ok: true, cost: c.cost, name };
    switch (name) {
      case 'quake':
        if (!sim.quake()) return { ok: false, why: 'busy' };
        this.lose(c.cost, name);
        T.quakes++;
        break;
      case 'nudgeL': case 'nudgeR': {
        this.heat += 1;
        if (this.heat > CONFIG.tiltAt) { this.tilt(); out.tilt = true; T.nudges++; break; }
        if (!sim.nudge(name === 'nudgeL' ? -1 : 1)) { this.heat -= 1; return { ok: false, why: 'busy' }; }
        T.nudges++;
        break;
      }
      case 'grip':
        if (c.disarm) { sim.armIron(false); this.refund(c.refund, 'refund'); out.disarm = true; T.ironDisarmed++; }
        else { sim.armIron(true); this.lose(c.cost, name); T.irons++; }
        break;
      case 'order': {
        if (!ORDER_SLOTS.includes(arg)) return { ok: false, why: 'arg' };
        out.type = randomPartType({ slot: arg, boost: 1 + Game.stage * 0.1 });
        out.slot = arg;
        sim.queueSpawn(out.type, 0);
        sim.redoHist = null;
        this.lose(c.cost, name);
        T.orders++;
        break;
      }
      case 'redo':
        if (!sim.rewind()) return { ok: false, why: 'none' };
        this.lose(c.cost, name);
        Game.tokens++; // the token never left your hand
        T.redos++;
        Telemetry.lastFailT = null; // the redo IS the retry; don't count the next drop as one too
        break;
    }
    if (name !== 'grip' || !c.disarm) this.riggedNext = true;
    Telemetry.log('rig', { lever: name, cost: out.cost, luck: this.luck });
    this.emit('used', out);
    return out;
  },

  // The fourth quick nudge: the machine jolts, locks for a few seconds, and you lose Luck.
  tilt() {
    const sim = Game.sim;
    this.heat = 0;
    sim.quake({ time: 0.9, power: 0.55, tilt: true });
    sim.lock('tilt', CONFIG.tiltLock);
    const lost = CONFIG.tiltPenalty > 0 ? this.lose(CONFIG.tiltPenalty, 'tilt') : 0;
    Telemetry.c.tilts++;
    this.emit('tilt', { lock: CONFIG.tiltLock, lost });
  },

  // Bad luck is the fuel: a miss or a slip earns Luck (soft pity). A win earns none.
  onTurnEnd(d) {
    if (!this.on) return;
    if (d.result === 'miss') this.gain(CONFIG.luckMiss, 'miss');
    else if (d.result === 'slip') this.gain(CONFIG.luckSlip, 'slip');
  },

  update(dt) { this.heat = Math.max(0, this.heat - CONFIG.heatDecay * dt); },
  cool(secs) { this.heat = Math.max(0, this.heat - CONFIG.heatDecay * Math.max(0, secs)); }, // time spent away from the claw scene

  // ---------------------------------------------------------------- Order helpers
  // How many of each slot you own (bag + everyone stitched up).
  slotCounts() {
    const n = {};
    for (const s of ORDER_SLOTS) n[s] = 0;
    for (const it of Game.inventory) n[PART_DEFS[it.type].slot]++;
    for (const c of Game.party) for (const t of c.parts()) n[PART_DEFS[t].slot]++;
    return n;
  },
  // The slot you are shortest of, for the creature count you have (1 head, 1 torso, 2 arms, 2 legs, 1 heart, 1 back each),
  // or null when you are not short of anything.
  suggestSlot() {
    const per = { head: 1, torso: 1, arm: 2, leg: 2, heart: 1, back: 1 };
    const crew = Math.max(1, Game.party.length), have = this.slotCounts();
    let best = 'torso', bestDef = -Infinity;
    for (const s of ['torso', 'head', 'leg', 'arm', 'heart', 'back']) { // ties go to the earlier slot
      const def = per[s] * crew - have[s];
      if (def > bestDef) { bestDef = def; best = s; }
    }
    return bestDef > 0 ? best : null;
  },
};

// ==== 30_game.js ====
// ---------------------------------------------------------------------------
// GAME STATE — tokens, the bag of parts, your party, the persistent machine.
// No save system on purpose (it's a prototype): refresh = new run.
// ---------------------------------------------------------------------------
const Scenes = {};
const Game = {
  tokens: 0,
  inventory: [], // [{uid, type}]
  party: [], // [Creature]
  stage: 1,
  bestStage: 0,
  sim: null,
  talk: null,
  recent: [], // last won part types (for the bag display)
  seen: {},
  won: false, // the final boss is down: the run is over
  playTime: 0, // seconds of play in this run (menus and pauses don't count)
  stats: {},   // what this run has done, for the end screen (saved with the run)
  failStreak: 0, // failed fights in a row; the Reaper adds a token per failure (up to ladderMax) so bad luck cannot become a dead end
  fast: false, // battle speed x2, kept between fights (and saved with the run)

  newGame(opts = {}) {
    this.tokens = CONFIG.startTokens;
    this.inventory = [];
    this.party = [];
    this.stage = 1;
    this.won = false;
    this.failStreak = 0;
    this.recent = [];
    this.seen = {};
    this.fast = false;
    this.talk = new Talker({ voice: 0.62, cps: 40 });
    this.playTime = 0;
    this.stats = Game.newStats();
    if (typeof Scenes !== 'undefined' && Scenes.slab && Scenes.slab.reset) Scenes.slab.reset();
    this.sim = new ClawSim({ onEvent: (t, d) => Scenes.claw && Scenes.claw.onSim(t, d) });
    if (opts.pile !== false) this.sim.fillPile(CONFIG.partCount);
    Rig.reset();
  },

  newStats() { return { grabs: 0, parts: 0, creatures: 0, lost: 0, fightsWon: 0, fightsLost: 0, retreats: 0, zaps: 0 }; },
  tally(key, n = 1) { this.stats[key] = (this.stats[key] || 0) + n; },

  // ---- saving: the run as plain data. Positions are not kept; the pile is rebuilt from part types.
  toSave() {
    const sim = this.sim;
    // a part is its type, or { type, from } when it is the remains of a creature with a name (old saves hold bare types)
    const item = (type, from) => (from ? { type, from } : type);
    const machine = sim ? [...sim.parts.filter((p) => !p.won).map((p) => item(p.type, p.from)), ...sim.pending.map((p) => item(p.type, p.from))] : [];
    // a drop in flight: the token comes back (and its Iron Grip), the part it carries is in the pile. A rewind is not a
    // drop: Redo already handed that token back.
    const inGrab = !!sim && sim.state !== 'idle' && sim.state !== 'rewind';
    return {
      tokens: this.tokens + (inGrab ? 1 : 0), stage: this.stage, bestStage: this.bestStage, won: this.won, failStreak: this.failStreak,
      playTime: Math.round(this.playTime || 0), seen: this.seen, stats: this.stats,
      inventory: [...this.inventory.map((i) => item(i.type, i.from)), ...(typeof Scenes !== 'undefined' && Scenes.slab && Scenes.slab.buildTypes ? Scenes.slab.buildTypes() : [])],
      party: this.party.map((c) => ({ slots: c.slots, hp: c.hp, name: c.name, kills: c.kills })),
      machine,
      luck: Rig.luck, iron: !!sim && sim.ironPaid(), // the Rig: banked Luck, and an Iron Grip that was paid for but not used up
      fast: this.fast,
    };
  },

  // Rebuild a run from saved data. Part ids that no longer exist are mapped through PART_ALIASES; anything
  // still unknown becomes nothing and is reported through Save.notes (never a crash).
  fromSave(run) {
    this.newGame({ pile: false });
    let retired = 0;
    const fix = (t) => {
      if (t && typeof t === 'object') { const f = fix(t.type); return f && typeof t.from === 'string' && t.from && t.from.length < 60 ? { type: f, from: t.from } : f; }
      if (PART_DEFS[t]) return t;
      if (PART_ALIASES[t] && PART_DEFS[PART_ALIASES[t]]) return PART_ALIASES[t];
      retired++;
      return null;
    };
    const num = (v, d, lo, hi) => (Number.isFinite(+v) ? clamp(+v, lo, hi) : d);
    this.tokens = num(run.tokens, CONFIG.startTokens, 0, 9999);
    this.stage = Math.round(num(run.stage, 1, 1, FINAL_STAGE));
    this.bestStage = Math.round(num(run.bestStage, 0, 0, FINAL_STAGE));
    this.won = !!run.won;
    this.failStreak = Math.round(num(run.failStreak, 0, 0, 99));
    this.playTime = num(run.playTime, 0, 0, 1e7);
    this.seen = run.seen && typeof run.seen === 'object' ? run.seen : {};
    for (const k of Object.keys(this.stats)) this.stats[k] = Math.round(num(run.stats && run.stats[k], 0, 0, 1e6));
    Rig.luck = Math.round(num(run.luck, Math.min(CONFIG.luckStart, CONFIG.luckMax), 0, CONFIG.luckMax)); // saves from before the Rig start with the usual Luck
    this.sim.iron = !!run.iron;
    this.fast = !!run.fast;
    const list = (v) => (Array.isArray(v) ? v : []); // a hand-edited or foreign save must not throw
    for (const t of list(run.inventory)) { const f = fix(t); if (f) this.inventory.push(f.type ? makePartItem(f.type, f.from) : makePartItem(f)); }
    for (const c of list(run.party).slice(0, 3)) {
      if (!c || typeof c !== 'object') continue;
      const slots = {};
      for (const [slot, t] of Object.entries(c.slots && typeof c.slots === 'object' ? c.slots : {})) { const f = t && typeof t === 'string' ? fix(t) : null; if (f && RIG_SLOTS.some(([k]) => k === slot)) slots[slot] = f; }
      if (!Object.keys(slots).length) continue;
      const cr = new Creature(slots);
      cr.hp = num(c.hp, cr.maxHp, 1, cr.maxHp);
      if (typeof c.name === 'string' && c.name.length < 60) cr.name = c.name;
      cr.kills = Math.round(num(c.kills, 0, 0, 9999));
      this.party.push(cr);
    }
    const machine = list(run.machine).map(fix).filter(Boolean);
    const first = machine.slice(0, 22);
    this.sim.layoutPile(first.length >= 5 ? first : [...first, ...Array.from({ length: 5 - first.length }, () => randomPartType())]);
    machine.slice(22).forEach((t, i) => this.sim.queueSpawn(t.type || t, i * 0.25, t.from));
    if (retired) Save.notes.push(retired + (retired > 1 ? ' parts' : ' part') + ' from an older version ' + (retired > 1 ? 'were' : 'was') + ' retired.');
    return this;
  },

  addPart(type, from) {
    const it = makePartItem(type, from);
    this.inventory.push(it);
    this.recent.unshift(type);
    if (this.recent.length > 8) this.recent.pop();
    return it;
  },
  takeItem(uid) {
    const i = this.inventory.findIndex((x) => x.uid === uid);
    return i >= 0 ? this.inventory.splice(i, 1)[0] : null;
  },
  // dead creatures and battle loot go back into the machine
  // entries are a part type, or { type, from } for the remains of a creature that died
  restock(items) { items.forEach((it, i) => this.sim.queueSpawn(it.type || it, i * 0.2, it.from)); },

  // The machine never runs dry: below 5 parts the Reaper fetches 7 more from the back room.
  // Returns how many were queued (0 = the pile was fine).
  topUpMachine() {
    const sim = this.sim;
    const left = sim.parts.filter((p) => !p.won).length + sim.pending.length;
    if (left >= 5) return 0;
    for (let i = 0; i < 7; i++) sim.queueSpawn(randomPartType({ boost: 1 + this.stage * 0.1 }), i * 0.25);
    Telemetry.log('topup', { left });
    return 7;
  },

  // What a fight pays. A win pays winTokens + stage. Anything else pays a share of that for the damage you
  // did (CONFIG.partialPay of it, scaled by how much of the enemy you got through), so a lost fight is a
  // bad day and not a dead end: the early game had a poverty trap where a defeat paid 1 token and the parts
  // it scattered cost ~30 to win back (see docs/BALANCE.md, "Failing forward").
  battlePay(stage, kind, progress, goldSurvivor) {
    const full = CONFIG.winTokens + stage + (goldSurvivor ? 1 : 0);
    if (kind === 'win') return full;
    const share = Math.round(CONFIG.partialPay * (CONFIG.winTokens + stage) * progress);
    // the ladder scales with the damage you did, so pressing FIGHT and then RETREAT earns nothing, and a scratch earns a scratch
    const ladder = Math.round(Math.min(CONFIG.ladderMax, this.failStreak + 1) * progress);
    return (kind === 'lose' ? Math.max(1, share) : share) + ladder;
  },

  // Turn a finished fight into consequences: creature health, dead creatures, tokens, restocks, stage.
  // kind: 'win' | 'lose' | 'retreat'. This is the whole economy of a battle, in one place.
  //   win      full pay, 3 parts drop into the machine, the run advances (the last boss ends it)
  //   lose     partial pay; creatures that died fall apart into the machine
  //   retreat  partial pay; nobody dies and the Reaper patches everyone up
  // Dead creatures' parts ALWAYS go back into the machine, never the bag (pillar: the claw is the only door).
  applyBattle(sim, kind) {
    const allies = sim.units.filter((u) => u.team === 'ally');
    const deadAllies = allies.filter((u) => u.dead);
    const survivors = allies.filter((u) => !u.dead);
    for (const u of allies) u.c.hp = u.dead ? 0 : Math.max(1, Math.ceil(u.hp));
    const deadParts = deadAllies.flatMap((u) => u.c.parts().map((type) => ({ type, from: u.name }))); // remains keep their name
    this.party = this.party.filter((c) => c.hp > 0);
    const restocked = [];
    const reward = this.battlePay(this.stage, kind, kind === 'win' ? 1 : sim.progress(), survivors.some((u) => u.traits.includes('golden')));
    this.tally('lost', deadAllies.length);
    this.tally(kind === 'win' ? 'fightsWon' : kind === 'lose' ? 'fightsLost' : 'retreats');
    if (kind === 'win') {
      restocked.push(...sim.prize); // rolled when the fight was set up, and shown as IF YOU WIN
      Telemetry.c.victories++;
      Telemetry.c.bestStage = Math.max(Telemetry.c.bestStage, this.stage);
      this.bestStage = Math.max(this.bestStage, this.stage);
      if (isFinalStage(this.stage)) this.won = true; else this.stage++;
      this.failStreak = 0;
    } else {
      if (kind === 'lose') Telemetry.c.defeats++;
      this.failStreak++;
    }
    for (const c of this.party) c.hp = c.maxHp; // the Reaper patches up everyone who is still standing
    this.tokens += reward + sim.goldKills;
    // the Rig banks a little Luck from every fight that ends (a retreat is not an ending)
    const luck = kind === 'win' ? Rig.gain(CONFIG.luckBattle, 'battle') : kind === 'lose' ? Rig.gain(CONFIG.luckDefeat, 'defeat') : 0;
    this.restock([...restocked, ...deadParts]);
    this.recordProgress();
    Save.soon();
    return { kind, reward, gold: sim.goldKills, restocked, deadParts, lost: deadAllies.map((u) => u.name + (u.c.kills ? ` (${u.c.kills} kill${u.c.kills > 1 ? 's' : ''})` : '')), won: this.won, progress: sim.progress(), luck };
  },

  // lifetime records live in the save file, next to the run
  recordProgress() {
    const r = Save.data && Save.data.records;
    if (!r) return;
    r.bestStage = Math.max(r.bestStage, this.bestStage);
    if (this.won) { r.wins++; const m = Math.round(this.playTime / 60); if (!r.bestWinMinutes || m < r.bestWinMinutes) r.bestWinMinutes = m; }
  },

  canFight() { return this.party.some((c) => c.hp > 0); },
  broke() { return this.tokens <= 0 && !this.inventory.length && !this.party.length; },
  givePity() {
    this.tokens += CONFIG.pityTokens;
    Telemetry.c.pity++;
    Telemetry.log('pity');
  },
};

  const M = MACHINE;
  let buf, g, glassBG, frameImg;
  const fxW = new Particles(); // world space (in the buffer, 2x on screen)
  const fxS = new Particles(); // screen space (1x)
  let t = 0, winFx = 0, bagBump = 0, tokenBump = 0, noTokenT = 0, idleT = 0, movedOnce = false, chuteWarnT = 0, missShown = false, slipTalked = false, slipHintT = 0;
  let turnNear = false; // this turn the claw closed on a part without catching it (only clipped it)
  let flying = [];
  let slowmoDone = new Set();
  let lastBumpSfx = 0;
  let neonOff = 0;
  let turnWins = 0;

  let toggleTarget = null; // ...and with a pointer: tap the glass and the claw goes there and stops

  // (see drawSideArt) and their text and icons crisp at 1x (drawOverlay).
  const CX = 394, CW = 84;
  const LAY = { tokens: [6, 44], luck: [52, 26], talk: [80, 62], rig: [144, 70], ctrl: [216, 50] };
  const CELL = { w: 24, h: 26, x: [398, 424, 450], y: [157, 185] };
  const CELLS = [['nudgeL', 0, 0], ['quake', 1, 0], ['nudgeR', 2, 0], ['grip', 0, 1], ['order', 1, 1], ['redo', 2, 1]]; // id, column, row
  const CELL_ICON = { nudgeL: 'ico_nudgeL', nudgeR: 'ico_nudgeR', quake: 'ico_quake', grip: 'ico_grip', order: 'ico_order', redo: 'ico_redo' };
  const SLOT_ICON = { head: 'skull', torso: 'ribcage', arm: 'bonearm', leg: 'boneleg', heart: 'heart', back: 'tail' };
  const PK = { x: 84, y: 66, w: 220, h: 134 }; // the Order menu

  const security = (gr) => clamp(gr.q * (1 - 0.6 * (gr.fray || 0)) * (gr.slide > 6 ? 0.45 : 1), 0, 1); // a fraying grip reads less secure
  const gripColor = (sec) => (sec >= 0.55 ? PAL.d : sec >= 0.3 ? PAL.L : PAL.R);
  const gripAlpha = (sec, ph = 0) => (sec < 0.3 ? (blinkOn(t + ph, 4.8) ? 1 : 0.35) : 0.7 + 0.3 * Math.sin(t * 6 + ph));
  const worldPt = (body, x, y) => { const q = body.getWorldPoint(planck.Vec2(x / PPM, y / PPM)); return [q.x * PPM, q.y * PPM]; };

  function mk(w, h) { const c = SPR.makeCanvas(w, h); const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }

  // ---------------------------------------------------------------- statics

        const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]][y & 3][xx & 3] / 16;
        x.fillStyle = k * 1.6 % 1 > bayer ? (k < 0.62 ? '#2a1f3d' : '#1f1830') : (k < 0.62 ? '#241a35' : '#1a1428');
        if (k < 0.62 && k * 1.6 < 1) x.fillStyle = k * 1.6 > bayer ? '#2a1f3d' : '#221931';
        x.fillRect(xx, y, 1, 1);
      }
    }

        x.fillRect(xx + 1, yy, 5, 1); x.fillRect(xx, yy + 1, 7, 3); x.fillRect(xx + 1, yy + 4, 5, 2);
        x.fillStyle = '#221931';

    // inner bevel around the glass

    x.fillStyle = '#6b6f86'; x.fillRect(GX - 2, GY - 2, 184, 126);
    x.fillStyle = '#2b2d3d'; x.fillRect(GX - 1, GY - 1, 182, 124);
    x.clearRect(GX, GY, 180, 122);
    // bulb sockets
    x.fillStyle = dark;
    for (const [bx, by] of bulbSpots()) x.fillRect(bx - 1, by - 1, 3, 3);
    // prize sign under the chute
    x.fillStyle = dark; x.fillRect(GX + 144, GY + 123, 36, 4);
    frameImg = c;
  }

  let _bulbs = null;
  function bulbSpots() {
    if (_bulbs) return _bulbs;
    _bulbs = [];
    for (let bx = 10; bx <= 184; bx += 9) _bulbs.push([bx, 3]);
    for (let by = 13; by <= 124; by += 10) _bulbs.push([190, by]);
    for (let bx = 184; bx >= 10; bx -= 9) _bulbs.push([bx, 131]);
    for (let by = 124; by >= 13; by -= 10) _bulbs.push([3, by]);
    return _bulbs;
  }

  // ---------------------------------------------------------------- scene api
  const S = {
    enter() {
      toggleDir = 0; toggleTarget = null;
      if (!buf) { [buf, g] = mk(BW, BH); buildGlass(); buildFrame(); }
      Music.play('claw');
      idleT = 0;
      topUp();
      picker = null;
      if (leftAt != null) Rig.cool(Engine.realT - leftAt); // TILT heat keeps cooling while you are in the shop
      if (!Game.seen.claw) {
        Game.seen.claw = true;
        say('Pick a part. Any part. They are ALL good parts.', 3.2);
        if (Rig.on) { // the layer introduces itself
          Game.talk.say('Psst. Panel on the right. The machine is rigged. Rig it back.', 3.6, false);
          cellPulse.quake = 9;
        }
      } else if (Game.sim.pending.length) say('Fresh stock! Straight from the graveyard.', 2.4);
      buildButtons();
    },
    exit() { Sfx.motor(0, 0); Game.sim.input.move = 0; picker = null; leftAt = Engine.realT; },
    update(dt) {
      t += dt;
      const sim = Game.sim;
      let move = 0;
      const tog = Settings.v.steering === 'toggle';
      if (tog) {
        if (picker || (sim.state !== 'idle' && sim.state !== 'carry')) { toggleDir = 0; toggleTarget = null; }
        else {
          if (Input.hit('left')) toggleDir = toggleDir === -1 ? 0 : -1;
          if (Input.hit('right')) toggleDir = toggleDir === 1 ? 0 : 1;
          if (Input.hit('a')) toggleDir = 0; // dropping or releasing stops the carriage first
        }
        move = toggleDir;
      } else toggleDir = 0;
      if (!tog && (Input.held('left') || btn.left.held)) move -= 1;
      if (!tog && (Input.held('right') || btn.right.held)) move += 1;
      // hold the mouse / a finger on the glass to steer the claw toward the pointer
      const mp = Input.mouse;
      const onGlass = !picker && mp.x >= 14 && mp.x < 374 && mp.y >= 14 && mp.y < 258 && (sim.state === 'idle' || sim.state === 'carry');
      if (tog) {
        // tap-to-toggle with a pointer: tap the glass and the claw goes there and stops; tap the arrows to toggle
        if (mp.pressed && onGlass) toggleTarget = mp.x / 2 - GX;
        if (toggleTarget != null && !move) {
          const d = toggleTarget - sim.carX, cap = sim.state === 'carry' ? Math.sqrt(2 * CONFIG.carryAccel * Math.max(0, Math.abs(d) - 1)) / CONFIG.clawMoveSpeed : 1;
          if (Math.abs(d) < 2 || (sim.state !== 'idle' && sim.state !== 'carry')) toggleTarget = null; else move = clamp(d / 10, -cap, cap);
        }
        if (toggleDir) toggleTarget = null;
      } else {
        toggleTarget = null;
        if (!move && mp.down && onGlass) {
          const d = mp.x / 2 - GX - sim.carX;
          // carrying, the carriage has momentum: ask only for a speed it can still stop from before the pointer, or a
          // pointer over the chute would slam it into the end stop every time (and that jars the grip)
          const cap = sim.state === 'carry' ? Math.sqrt(2 * CONFIG.carryAccel * Math.max(0, Math.abs(d) - 1)) / CONFIG.clawMoveSpeed : 1;
          if (Math.abs(d) > 2) move = clamp(d / 10, -cap, cap);
        }
      }
      if (picker) move = 0; // arrows move the menu selection, not the claw
      if (move) { movedOnce = true; idleT = 0; } else if (sim.state === 'idle') idleT += dt;
      chuteWarnT = Math.max(0, chuteWarnT - dt);
      slipHintT = Math.max(0, slipHintT - dt);
      sim.input.move = move;
      // The Rig: hotkeys (Q/E nudge, 1-4 levers; pad LB/RB, X, Y)
      Rig.update(dt);
      if (picker) updatePicker();
      else if (Rig.on) {
        if (Input.hit('nudgeL') || Input.hit('lb')) pull('nudgeL');
        if (Input.hit('nudgeR') || Input.hit('rb')) pull('nudgeR');
        if (Input.hit('quake') || Input.hit('x')) pull('quake');
        if (Input.hit('grip') || Input.hit('y')) pull('grip');
        if (Input.hit('order')) pull('order');
        if (Input.hit('redo')) pull('redo');
      }
      if (Input.hit('a')) S.pressA();
      if (Input.hit('b')) S.back();
      sim.step(dt);
      lens = Rig.on && CONFIG.lens && !picker && sim.lockT <= 0 ? sim.predict() : null; // (no badge while the pile is being shaken)
      if (lens && lens.part && !Game.seen.lensHint && Game.seen.claw && movedOnce) {
        Game.seen.lensHint = true;
        Game.talk.say('That badge is your odds of holding something. Aim for green.', 3.2, false);
      }
      noLuckT = Math.max(0, noLuckT - dt); luckHint = Math.max(0, luckHint - dt); ironFlash = Math.max(0, ironFlash - dt);
      for (let i = 0; i < pipPop.length; i++) pipPop[i] = Math.max(0, pipPop[i] - dt);
      for (const k in cellPulse) cellPulse[k] = Math.max(0, cellPulse[k] - dt);
      if ((sim.iron || (sim.turn && sim.turn.iron)) && vchance(dt * 9)) { // Iron Grip: gold sparks around the claw head
        fxW.add({ x: sim.hub.getPosition().x * PPM + vrand(-11, 11), y: sim.hub.getPosition().y * PPM + vrand(2, 28), vy: -14, life: 0.5, color: vpick(['#fff1a6', '#f6c64b', '#ffffff']) });
      }

      // motor voice
      const moving = Math.abs(sim.carV) / CONFIG.clawMoveSpeed;
      const reel = sim.state === 'drop' || (sim.state === 'lift' && sim.ropeLen > M.topLen + 0.5);
      // it labours under a load, and groans lower as the carry strains the grip
      const ci = sim.carryInfo();
      const load = sim.grips.length ? 0.18 + (ci ? 0.1 * clamp(ci.load / Math.max(0.05, ci.hold), 0, 1.5) : 0) : 0;
      Sfx.motor(clamp(moving * 0.5 + (reel ? 0.55 : 0), 0, 0.9), reel ? (sim.state === 'drop' ? 0.62 : 0.38 - load) : 0.45 + moving * 0.25 - load);
      // a part sliding out of a fraying grip sheds grit
      for (const gr of sim.grips) {
        if (!gr.slipping || !vchance(dt * 20)) continue;
        const [px, py] = sim.partPos(gr.part);
        fxW.add({ x: px + vrand(-4, 4), y: py + vrand(0, 5), vy: vrand(10, 30), ay: 60, life: 0.5, color: vpick(['#cdb892', '#6e5580', '#fff6e3']) });
      }

      // slow-mo when something good is about to drop into the chute
      for (const p of sim.parts) {
        if (p.won || slowmoDone.has(p) || RARITY[p.def.rarity].order < 2) continue;
        const [x, y] = sim.partPos(p);
        const v = p.body.getLinearVelocity().y * PPM;
        if (x > M.chuteX0 - 2 && y > M.lipY - 26 && y < M.lipY + 2 && v > 25 && sim.state === 'release') {
          slowmoDone.add(p);
          Engine.slowmo(0.3, 0.45);
        }
      }
      // legendary sparkle
      for (const p of sim.parts) {
        if (p.won || p.def.rarity !== 'legendary' || !vchance(dt * 3)) continue;
        const [x, y] = sim.partPos(p);
        fxW.add({ x: x + vrand(-8, 8), y: y + vrand(-8, 8), vy: -6, life: 0.6, color: vpick([PAL.l, PAL.L, PAL.j]) });
      }
      // the soul hook reaching for the part under the claw: wisps drawn up into its mouth
      const hook = sim.hook && (sim.state === 'spread' || sim.state === 'close') ? sim.hook : null;
      if (hook && !reachSfx) { reachSfx = true; Sfx.play('soul_reach'); }
      if (hook && vchance(dt * 30)) {
        const [hx, hy] = worldPt(sim.hub, 0, 12);
        fxW.add({ x: hook.x + vrand(-4, 4), y: hook.y + vrand(-2, 2), vx: (hx - hook.x) * 2.2, vy: (hy - hook.y) * 2.2, drag: 1.5, life: 0.4, color: vpick([REACH, REACH2, PAL.j]) });
      }
      // souls rising off whatever the claw holds
      for (const gr of sim.grips) {
        if (!vchance(dt * 5)) continue;
        const c = gr.body.getWorldCenter();
        fxW.add({ x: c.x * PPM + vrand(-5, 5), y: c.y * PPM + vrand(-4, 4), vx: vrand(-4, 4), vy: -vrand(10, 18), life: vrand(0.5, 0.9), color: vpick([gripColor(security(gr)), PAL.j]) });
      }

      fxW.update(dt); fxS.update(dt);
      Game.talk.update(dt);
      winFx = Math.max(0, winFx - dt);
      bagBump = Math.max(0, bagBump - dt * 3);
      tokenBump = Math.max(0, tokenBump - dt * 3);
      noTokenT = Math.max(0, noTokenT - dt);
      neonOff = neonOff > 0 ? neonOff - dt : vchance(dt * 0.25) ? vrand(0.05, 0.25) : 0;
      for (const f of flying) f.t += dt;
      flying = flying.filter((f) => {
        if (f.t < f.dur) return true;
        bagBump = 1;
        fxS.text(452, 34, '+1', RARITY[PART_DEFS[f.type].rarity].color, { font: 'main' });
        return false;
      });
      btn.drop.label = sim.state === 'rewind' ? 'REWIND' : sim.lockT > 0 ? (sim.lockWhy === 'tilt' ? 'TILT!' : 'SHAKING') :
        sim.state === 'idle' ? (Game.tokens > 0 ? 'DROP' : 'NO TOKENS') : sim.state === 'carry' ? 'RELEASE' : sim.state === 'drop' ? 'STOP' : ACTION_LABEL[sim.state] || '...';
      for (const [id] of CELLS) btn['r_' + id].tip = Rig.on && Input.lastDevice !== 'touch' ? tipFor(id) : null; // a tap would leave the tooltip stuck on screen
      UI.set(picker ? pickerBtns : Object.values(btn));
      if (picker) for (const b of Object.values(btn)) b.hover = b.held = false;
    },

    pressA() {

          if (d.big) fxW.burst(vrand(10, 130), M.floor - 6, 6, { speed: 26, angle: -Math.PI / 2, spread: 1.2, ay: 80, life: 0.5, color: ['#6e5580', '#45365f', '#a08962'] });

          break;
        case 'nudge': {

        case 'lift': {

          if (!d.grips.length && sim.parts.some((p) => !p.won && sim.touching(p, 0.3))) { turnNear = true; Telemetry.c.clipped++; }
          if (d.grips.length) {
            const best = d.grips.slice().sort((a, b) => RARITY[b.def.rarity].order - RARITY[a.def.rarity].order)[0];
            Sfx.play('grab');
            // how good the catch is, said the moment it registers (the carry meter shows the same hold)

            Telemetry.c[q >= 0.75 ? 'gripSolid' : q >= 0.5 ? 'gripOk' : 'gripLoose']++;
            const r = RARITY[best.def.rarity].order;
            if (r >= 2) say(vpick(['Oh, that\'s a good part.', 'Don\'t. Drop. It.', 'Careful. That one\'s precious.']), 2);
            else if (q < 0.5) say(vpick(['Barely got it...', 'By the fingertips...', 'Loose. Very loose.']), 1.8);
            else if (q >= 0.75 && vchance(0.5)) say(vpick(['Got it! Nice and snug.', 'Now THAT is a grab.']), 1.6);
            else if (vchance(0.6)) say(vpick(['Got something!', 'Ooh.', 'Hold it... hold it...', 'Easy does it.']), 1.6);

          if (!slipTalked) { slipTalked = true; say(vpick(['It\'s slipping! Hold still!', 'Easy... EASY...', 'Don\'t move. Don\'t breathe.']), 1.6); }
