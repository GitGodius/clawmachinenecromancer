    }
    Font.draw(ctx, '1-6 OR CLICK TO ORDER  ·  ' + Settings.hint('b') + ' TO CANCEL', PK.x + PK.w / 2, PK.y + PK.h - 12, { font: 'small', color: '#7a6a9a', align: 'center' });
  }

  // The carry meter, under the held part's name. The bar's length is the catch: a part caught deep and pinched fills
  // it, one hanging off a prong tip gets a sliver (no bar at all = it is only riding on the prongs, no grip). The
  // fill is the strain of the carry right now. Fill past the end and the grip frays: the part slides, the claw
  // creaks and the word says SLIPPING!; ease off and it re-seats. The word, the bar's length and its texture all
  // say the same thing (STEADY / STRAINED / SLIPPING), so colour is a bonus, not the message.
  function drawGrip(ctx, cx, y, part) {
    const sim = Game.sim, gr = sim.grips.find((x) => x.part === part), info = gr && sim.carryInfo();
    const x0 = cx - 21, w = 42;
    Draw.rect(ctx, x0, y, w, 5, PAL.k);
    if (!gr) { // riding on the prongs: nothing holds it but luck
      if (blinkOn(t, 2)) Font.draw(ctx, 'NO GRIP', cx, y + 7, { font: 'small', color: '#e8405a', align: 'center', outline: PAL.k });
      return;
    }
    const k = sim.ironOn() ? CONFIG.ironSlip : 1;
    const hold = clamp((gr.hold != null ? gr.hold : gr.q) / k, 0, 1.4), load = (gr.load || 0) / k, fray = clamp(gr.fray || 0, 0, 1);
    const cap = Math.max(2, Math.round((w - 2) * Math.min(1, hold / 1.4))); // how much strain this catch can take
    const fill = Math.round((w - 2) * Math.min(1, load / 1.4));
    const lvl = gr.slipping ? 2 : load > hold * 0.7 ? 1 : 0;
    const col = ['#9be38f', '#f6c64b', '#e8405a'][lvl];
    Draw.rect(ctx, x0 + 1, y + 1, cap, 3, sim.ironOn() ? '#5a4a1c' : '#2b2d3d'); // the catch
    for (let i = 0; i < fill; i++) {
      if (lvl === 1 && i % 2) continue; // strained: dotted
      if (lvl === 2 && i % 3 === 2) continue; // slipping: striped
      Draw.rect(ctx, x0 + 1 + i, y + 1, 1, 3, i < cap ? col : '#e8405a');
    }
    Draw.rect(ctx, x0 + 1 + cap, y - 1, 1, 7, '#fff6e3'); // the edge of the catch: keep the fill short of it
    if (fray > 0) Draw.rect(ctx, x0 + 1, y + 4, Math.round((w - 2) * fray), 1, '#e8405a'); // how far it has slid: at the end it goes
    const word = (sim.ironOn() ? 'IRON · ' : '') + ['STEADY', 'STRAINED', 'SLIPPING!'][lvl];
    if (lvl < 2 || blinkOn(t, 3)) Font.draw(ctx, word, cx, y + 7, { font: 'small', color: col, align: 'center', outline: PAL.k });
    if (slipHintT > 0 && blinkOn(t, 1.2, 0.75)) Font.draw(ctx, 'HOLD STILL AND IT SETTLES', cx, y + 16, { font: 'small', color: '#e7d6ff', align: 'center', outline: PAL.k });
  }

  function drawOverlay(ctx) {
    const sim = Game.sim;
    // TOKENS, with the bag folded in underneath
    Font.draw(ctx, 'TOKENS', 436, 9 - Math.round(tokenBump * 2), { font: 'small', color: '#a6aec2', align: 'center' });
    const tk = String(Game.tokens);
    Font.draw(ctx, tk, 436, 15 - Math.round(tokenBump * 2), { scale: 3, color: Game.tokens > 0 ? '#fff6e3' : noTokenT > 0 && blinkOn(t, 2.5) ? '#e8405a' : '#7a6a9a', align: 'center', shadow: PAL.k });
    Draw.rect(ctx, 400, 40, 76, 1, '#3b3654');
    Font.draw(ctx, 'BAG', 402, 43 + Math.round(bagBump), { font: 'small', color: '#a6aec2' });
    Font.draw(ctx, String(Game.inventory.length), 470, 43 + Math.round(bagBump), { font: 'small', color: '#ecdcbc', align: 'right' });
    drawLuckMeter(ctx);
    drawSpeech(ctx);
    drawRigPanel(ctx);
    // flying prizes
    for (const f of flying) {
      if (f.t < 0) continue;
      const k = easeInOutQuad(clamp(f.t / f.dur, 0, 1));
      const x = lerp(f.x0, 452, k), y = lerp(f.y0, 44, k) - Math.sin(k * Math.PI) * 60;
      drawPartIcon(ctx, f.type, x, y, 22, { outline: RARITY[PART_DEFS[f.type].rarity].color });
    }
    // controls
    const ico = (name, x, y, fb) => (SPR.has(name) ? SPR.draw(ctx, name, x, y) : Font.draw(ctx, fb, x, y - 3, { align: 'center', color: '#ecdcbc' }));
    ico('key_left', 407, 227, '◀'); ico('key_right', 427, 227, '▶');
    Font.draw(ctx, 'MOVE', 442, 224, { color: '#ecdcbc' });
    for (const b of [btn.drop, btn.back]) {
      const hot = b.hover || b.held;
      const pulse = b === btn.back && noTokenT > 0 && blinkOn(t, 1.6);
      if (hot || pulse) Draw.rect(ctx, b.x, b.y, b.w, b.h, pulse ? '#5a1834' : '#2b2d3d');
      let lx = b.x + 20;
      if (Input.lastDevice === 'keys') { // keyboard players see their own keys, not gamepad glyphs
        const cap = Settings.hint(b === btn.drop ? 'a' : 'b'), cw = Font.measure(cap, 'small') + 5;
        Draw.rect(ctx, b.x + 1, b.y + 2, cw, 10, '#1b1526'); Draw.rect(ctx, b.x + 1, b.y + 2, cw, 9, '#3c4257'); Draw.rect(ctx, b.x + 1, b.y + 2, cw, 1, '#677089');
        Font.draw(ctx, cap, b.x + 3, b.y + 4, { font: 'small', color: '#ecdcbc' });
        lx = b.x + cw + 5;
      } else ico(b === btn.drop ? 'btn_a' : 'btn_b', b.x + 9, b.y + 7, b === btn.drop ? 'A' : 'B');
      const dead = b === btn.drop && ((Game.tokens <= 0 || sim.lockT > 0) && sim.state === 'idle' || !['idle', 'drop', 'carry'].includes(sim.state));
      Font.draw(ctx, b.label, lx, b.y + 4, { color: dead ? '#7a6a9a' : '#ecdcbc' });
    }
    if (chuteWarnT > 0 && blinkOn(t, 2.5)) Draw.frame(ctx, btn.left.x - 1, btn.left.y - 1, btn.left.w + 2, btn.left.h + 2, '#ff8ac6');
    if (btn.left.held || Input.held('left')) Draw.frame(ctx, btn.left.x, btn.left.y, btn.left.w, btn.left.h, '#fff6e3');
    if (btn.right.held || Input.held('right')) Draw.frame(ctx, btn.right.x, btn.right.y, btn.right.w, btn.right.h, '#fff6e3');

    // held part label + grip meter + carry timer near the claw
    const gp = sim.grips[0] ? sim.grips[0].part : [...sim.held][0];
    if (gp && (sim.state === 'lift' || sim.state === 'carry' || sim.state === 'return')) {
      const [px, py] = sim.partPos(gp);
      const [sx, sy] = toScreen(px, py);
      const r = RARITY[gp.def.rarity];
      const txt = (gp.from ? poss(gp.from) + ' ' : '') + gp.def.name + (r.order ? ' · ' + r.name : '');
      const lx = clamp(sx, 90, 300);
      Font.draw(ctx, txt, lx, sy + 26, { color: r.color, align: 'center', outline: PAL.k });
      if (gp.def.set) Font.draw(ctx, PART_SETS[gp.def.set].name.toUpperCase() + ' SET', lx, sy + 37, { font: 'small', color: '#f6c64b', align: 'center', outline: PAL.k });
      drawGrip(ctx, lx, sy + (gp.def.set ? 47 : 38), gp);
    }
    if (sim.state === 'carry' && CONFIG.carryTime > 0) {
      const k = 1 - sim.stateT / CONFIG.carryTime;
      const [cx] = toScreen(sim.carX, 0);
      Draw.rect(ctx, cx - 16, 44, 32, 3, PAL.k);
      Draw.rect(ctx, cx - 15, 45, Math.max(0, 30 * k), 1, k < 0.3 && blinkOn(t, 3) ? PAL.R : PAL.d);
      const left = Math.max(0, Math.ceil(CONFIG.carryTime - sim.stateT));
      if (left <= 3) Font.draw(ctx, String(left), cx, 36, { font: 'small', color: '#fff6e3', align: 'center', outline: PAL.k }); // the number, not just the colour
    }
    // the first two carries: spell out steer -> chute -> release (nothing else teaches it).
    // The text sits on the side of the glass away from the claw so it never covers the held part.
    if (sim.state === 'carry' && (sim.grips.length || sim.held.size) && (Game.seen.carries || 0) <= 2) {
      const over = sim.carX > M.chuteX0 + 4, a = 0.75 + 0.2 * Math.sin(t * 6), cgx = (sim.carX + GX) * 2;
      const hx = cgx < 190 ? Math.min(cgx + 100, 296) : Math.max(cgx - 100, 100); // keep ~100 px clear of the claw
      const key = Input.lastDevice === 'keys' ? Settings.hint('a') : Input.lastDevice === 'pad' ? 'A' : 'THE RELEASE BUTTON';
      if (over) Font.draw(ctx, 'NOW RELEASE!  (' + key + ')', hx, 84, { font: 'small', color: '#9be38f', align: 'center', alpha: a, outline: PAL.k });
      else {
        Font.draw(ctx, 'STEER TO THE CHUTE  →', hx, 78, { font: 'small', color: '#e7d6ff', align: 'center', alpha: a, outline: PAL.k });
        Font.draw(ctx, 'THEN PRESS ' + key + ' TO RELEASE', hx, 89, { font: 'small', color: '#ff8ac6', align: 'center', alpha: a, outline: PAL.k });
        Font.draw(ctx, 'KEEP IT STEADY', hx, 100, { font: 'small', color: '#9be38f', align: 'center', alpha: a * 0.8, outline: PAL.k });
      }
    }
    // first-time controls hint, inside the glass, until the player does anything
    if (!movedOnce && sim.state === 'idle' && Game.tokens === CONFIG.startTokens) {
      const a = 0.55 + 0.25 * Math.sin(t * 3);
      Font.draw(ctx, Settings.v.steering === 'toggle' ? `${Settings.hint('left')} ${Settings.hint('right')} TO START AND STOP  or  TAP THE GLASS` : `${Settings.hint('left')} ${Settings.hint('right')}  or  HOLD MOUSE ON THE GLASS TO STEER`, 190, 96, { font: 'small', color: '#e7d6ff', align: 'center', alpha: a, outline: PAL.k });
      Font.draw(ctx, `THEN  DROP (${Settings.hint('a')})`, 190, 108, { font: 'small', color: '#ff8ac6', align: 'center', alpha: a, outline: PAL.k });
    }
    // first-time nudge: flash the controls if the player hasn't moved yet
    if (!movedOnce && idleT > 5 && blinkOn(t, 1)) Draw.frame(ctx, 396, 217, 80, 49, '#ff8ac6');

    drawLens(ctx);
    // TILT: the machine is sulking
    if (sim.lockWhy === 'tilt' && sim.lockT > 0) {
      if (Math.sin(t * 9) > -0.2) Font.draw(ctx, 'TILT', 194, 96, { scale: 6, color: '#e8405a', outline: PAL.k, align: 'center' });
      const k = clamp(sim.lockT / CONFIG.tiltLock, 0, 1);
      Draw.rect(ctx, 134, 146, 120, 4, PAL.k); Draw.rect(ctx, 135, 147, Math.round(118 * k), 2, '#e8405a');
    }
    if (sim.state === 'rewind') drawRewind(ctx);
    fxS.draw(ctx);
    if (picker) drawPicker(ctx);
  }

  S.draw = function (ctx) {
    g.clearRect(0, 0, BW, BH);
    drawWorld();
    g.drawImage(frameImg, 0, 0);
    drawFrameLights();
    drawSideArt();
    ctx.drawImage(buf, 0, 0, BW * 2, BH * 2);
    drawOverlay(ctx);
  };

  // tiny preview of the live pile for the shop's machine window (1x)
  S.drawMini = function (ctx, x, y) {
    if (!buf) { [buf, g] = mk(BW, BH); buildGlass(); buildFrame(); }
    const [c, cx] = S._mini || (S._mini = mk(180, 122));
    const keep = g;
    g = cx;
    g.clearRect(0, 0, 180, 122);
    g.save(); g.translate(-GX, -GY);
    drawWorld();
    g.restore();
    g = keep;
    ctx.drawImage(c, x, y);
  };

  return S;
})();

// ==== 32_creature.js ====
// ---------------------------------------------------------------------------
// CREATURES — stats from parts, a name, and a paper-doll rig renderer used on
// the slab (2x), in battle and in portraits. Any combination of parts is legal:
// no legs = it crawls, no arms = it bites, no torso = it's mostly stitches.
// ---------------------------------------------------------------------------
SPR.def('p_lump', { // stand-in torso when none is stitched on
  rows: [
    '...kkkkkk...',
    '.kkFFFFFgkk.',
    'kfFFhFhFFFgk',
    'kFFFFhFFFFgk',
    'kFgFFFFFhFgk',
    'kFFhFFFFFhgk',
    'kgFFFFFhFFgk',
    '.kggFhFFFgk.',
    '..kkggggkk..',
    '....kkkk....',
  ],
  anchor: [6, 5],
  points: { neck: [6, 1], shL: [1, 3], shR: [10, 3], hipL: [3, 8], hipR: [8, 8], heart: [6, 4], back: [6, 4] },
});

const GHOST_SPRITE = { head: 'p_skull', torso: 'p_ribcage', armL: 'p_bonearm', armR: 'p_bonearm', legL: 'p_boneleg', legR: 'p_boneleg', heart: 'p_heart', back: 'p_wings' };

const CREATURE_NAMES = ['Gerald', 'Mortimer', 'Bonnie', 'Doug', 'Patches', 'Nibbles', 'Frank', 'Helga', 'Moss', 'Pip', 'Barnaby', 'Igor Jr.',
  'Clive', 'Mabel', 'Ruth', 'Lefty', 'Grub', 'Old Tom', 'Bartholomew', 'Ribsy', 'Wendell', 'Gus', 'Agatha', 'Norbert', 'Ingrid', 'Chad',
  'Beatrix', 'Humphrey', 'Dot', 'Sir Limbsworth', 'Lady Gristle', 'Kevin', 'Tibia', 'Femurella', 'Stanley', 'Marrow', 'Deborah', 'Knuckles'];
const TITLE_FALLBACK = ['the Stitched', 'the Unlikely', 'the Earnest', 'the Lumpy', 'the Brave', 'the Damp', 'the Adequate', 'the Probably Fine', 'the Reassembled', 'the Second-Hand'];

let _creatureId = 1;
class Creature {
  constructor(slots) {
    this.id = _creatureId++;
    this.slots = Object.assign({ head: null, torso: null, armL: null, armR: null, legL: null, legR: null, heart: null, back: null }, slots);
    this.compute();
    this.hp = this.maxHp;
    this.name = Creature.makeName(this.slots);
    this.born = 0;
    this.kills = 0;
  }
  parts() { return Object.values(this.slots).filter(Boolean); }
  has(trait) { return this.traits.includes(trait); }
  compute() {
    const S = this.slots, D = (t) => (t ? PART_DEFS[t] : null);
    const all = this.parts().map(D);
    const arms = [S.armL, S.armR].filter(Boolean).map(D);
    const legs = [S.legL, S.legR].filter(Boolean).map(D);
    const head = D(S.head);
    let hp = 8 + all.reduce((a, d) => a + (d.hp || 0), 0);
    // Each arm is its own strike, so armour is applied to every arm on its own: two small arms are worth much
    // less against a Shade than one big one (docs/DESIGN.md, pillar 4). The head's bite and a back part's
    // attack are shared out across the arms. No arms? It bites: one strike.
    const extra = (head ? (arms.length ? (head.atk || 0) * 0.4 : head.atk || 0) : 0) + (S.back && D(S.back).atk ? D(S.back).atk : 0);
    const hits = arms.length ? arms.map((d) => (d.atk || 0) + extra / arms.length) : [extra];
    let atk = hits.reduce((a, b) => a + b, 0);
    if (atk <= 0) { atk = 1; hits.length = 0; hits.push(1); } // it flops at them, aggressively
    this.hits = hits.map((h) => Math.round(h * 100) / 100);
    const spd = legs.reduce((a, d) => a + (d.spd || 0), 0);
    this.traits = [...new Set(all.map((d) => d.trait).filter(Boolean))];
    this.maxHp = Math.round(hp);
    this.atk = Math.round(atk * 10) / 10;
    this.def = all.reduce((a, d) => a + (d.def || 0), 0);
    // set bonuses (also pushed as traits, so the preview, tooltips and battle show them with no extra plumbing)
    this.sets = setsOf(this.slots);
    for (const k of this.sets) this.traits.push('set_' + k);
    // an ATK bonus scales every arm's strike (BattleSim strikes with `hits`), and `atk` stays their sum
    const mulAtk = (m) => { this.hits = this.hits.map((h) => Math.round(h * m * 100) / 100); this.atk = Math.round(this.hits.reduce((a, b) => a + b, 0) * 10) / 10; };
    if (this.sets.includes('skeleton')) this.def += 2;
    if (this.sets.includes('beast')) mulAtk(1.3);
    if (this.sets.includes('royal')) { mulAtk(1.2); this.def += 2; }
    if (this.sets.includes('ogre')) { this.maxHp = Math.round(this.maxHp * 1.25); mulAtk(1.25); }
    this.spd = spd;
    this.moveSpeed = (legs.length ? 12 + spd * 4 : 7) + (this.traits.includes('flutter') ? 10 : 0);
    this.atkTime = 1.25 + (arms.some((d) => d.trait === 'smash') ? 0.45 : 0) - Math.min(0.35, spd * 0.03);
    this.range = 26 + (this.traits.includes('reach') ? 22 : 0);
    const goats = legs.filter((d) => d.trait === 'nimble').length;
    this.dodge = Math.min(0.5, goats * 0.15 + (this.traits.includes('flutter') ? 0.25 : 0));
    this.crit = this.traits.includes('keen') ? 0.3 : 0.05;
    this.power = Math.round(this.maxHp * 0.5 + this.atk * 6 / this.atkTime + this.spd * 2);
  }
  static makeName(S) {
    const t = Object.values(S).filter(Boolean);
    const count = (pred) => t.filter((x) => pred(PART_DEFS[x], x)).length;
    let title = null;
    if (S.head === 'crownskull') title = 'the Magnificent';
    else if (S.heart === 'goldheart') title = 'Heart of Gold';
    else if (setsOf(S).length) title = PART_SETS[setsOf(S)[0]].title;
    else if (t.includes('tentacle')) title = 'the Tentacular';
    else if (S.head === 'wolfskull') title = 'the Hungry';
    else if (S.head === 'eyeball') title = 'the Watcher';
    else if (S.head === 'demonskull') title = 'the Damned';
    else if (S.back === 'wings') title = 'the Flappy';
    else if (!S.legL && !S.legR) title = 'No-Legs';
    else if (!S.head) title = 'the Headless';
    else if ((S.legL === 'pegleg') !== (S.legR === 'pegleg') && S.legL && S.legR) title = 'the Lopsided';
    else if (count((d) => d.mat === 'bone') >= 4) title = 'the Rattly';
    else if (!S.heart && t.length >= 5) title = 'the Heartless';
    return vpick(CREATURE_NAMES) + ' ' + (title || vpick(TITLE_FALLBACK));
  }
}

// ------------------------------------------------------------------- rig
// Returns joint positions relative to the feet (0,0), in art px.
function rigLayout(S) {
  const spr = (t) => (t ? SPR.get(PART_DEFS[t].sprite) : null);
  const torso = spr(S.torso) || SPR.get('p_lump');
  const P = torso.pts;
  const lL = spr(S.legL), lR = spr(S.legR);
  const lenL = lL ? lL.h - lL.ay : 0, lenR = lR ? lR.h - lR.ay : 0;
  const hipH = Math.max(lenL, lenR);
  const hipAvgY = (P.hipL[1] + P.hipR[1]) / 2;
  const tx = 0;
  const ty = hipH > 0 ? -hipH - (hipAvgY - torso.ay) : -(torso.h - torso.ay);
  const j = (pt) => [tx + pt[0] - torso.ax, ty + pt[1] - torso.ay];
  let tilt = 0;
  if (lL && lR && lenL !== lenR) tilt = Math.atan2(lenR - lenL, (P.hipR[0] - P.hipL[0]) * 3) * 0.9;
  return {
    torso, tx, ty, tilt,
    neck: j(P.neck), shL: j(P.shL), shR: j(P.shR), hipL: j(P.hipL), hipR: j(P.hipR), heart: j(P.heart), back: j(P.back),
    lenL, lenR, hipH,
    top: ty - torso.ay - (S.head ? SPR.get(PART_DEFS[S.head].sprite).h : 0),
  };
}

// Draw a creature with its feet at (x, y).
// o: { scale, t, anim:'idle'|'walk'|'attack'|'dead', animT (0..1), flip, flash, alpha, eyes (color), ghost (empty-slot silhouettes), dim }
function drawCreature(ctx, slots, x, y, o = {}) {
  const L = rigLayout(slots);
  const t = o.t || 0;
  const sc = o.scale || 1;
  const anim = o.anim || 'idle';
  let bob = 0, legA = 0, armA = 0, armB = 0, lunge = 0, headDX = 0, headDY = 0, lean = 0;
  if (anim === 'idle') {
    bob = Math.round(Math.sin(t * 2.6) * 0.8 + 0.3);
    armA = Math.sin(t * 2.6) * 0.07; armB = -armA;
  } else if (anim === 'walk') {
    const w = t * 9;
    legA = Math.sin(w) * 0.42;
    bob = Math.round(Math.abs(Math.cos(w)) * -1.4 + 0.7);
    armA = -Math.sin(w) * 0.35; armB = -armA;
    if (!slots.legL && !slots.legR) { legA = 0; bob = Math.round(Math.sin(w) * 1); lean = Math.sin(w * 0.5) * 0.1; }
  } else if (anim === 'attack') {
    const a = o.animT || 0;
    if (a < 0.4) { const k = easeOutCubic(a / 0.4); armA = 0.7 * k; lunge = -1 * k; lean = -0.08 * k; }
    else if (a < 0.6) { const k = easeOutCubic((a - 0.4) / 0.2); armA = lerp(0.7, -1.9, k); armB = lerp(0, -0.6, k); lunge = lerp(-1, 5, k); lean = lerp(-0.08, 0.14, k); }
    else { const k = easeInOutQuad((a - 0.6) / 0.4); armA = lerp(-1.9, 0, k); armB = lerp(-0.6, 0, k); lunge = lerp(5, 0, k); lean = lerp(0.14, 0, k); }
    if (!slots.armL && !slots.armR) { headDX = lunge * 1.2; headDY = lunge > 2 ? 1 : 0; }
  }
  const S = slots;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (o.flip) ctx.scale(-sc, sc); else ctx.scale(sc, sc);
  ctx.translate(Math.round(lunge), 0);
  const alpha = o.alpha == null ? 1 : o.alpha;
  ctx.globalAlpha = alpha;
  const flash = o.flash ? '#fff6e3' : null;
  const ghost = o.ghost;
  const part = (slot, spX, spY, rot, extra = {}) => {
    const type = S[slot];
    if (!type) {
      if (ghost) SPR.draw(ctx, GHOST_SPRITE[slot], spX, spY, { rot, solid: ghost, alpha: 0.9 * alpha, flip: extra.flip });
      return;
    }
    const d = PART_DEFS[type];
    SPR.draw(ctx, d.sprite, spX, spY, Object.assign({ rot: rot || 0.0001, solid: flash || o.solid || undefined }, extra));
  };
  const up = bob; // negative = up
  // upper body pivot (pelvis) for lean/tilt
  const pelvisY = L.hipH > 0 ? -L.hipH : 0;
  ctx.save();
  ctx.translate(0, pelvisY);
  ctx.rotate(L.tilt + lean);
  ctx.translate(0, -pelvisY + up);
  // back parts
  if (S.back === 'wings' || (!S.back && ghost)) {
    const flap = S.back ? Math.sin(t * (anim === 'walk' ? 14 : 4)) * 0.12 : 0;
    part('back', L.back[0], L.back[1] + 2, flap);
  } else if (S.back === 'tail') {
    const n = 5;
    for (let i = 0; i < n; i++) {
      const k = i / (n - 1);
      const px = L.back[0] - 3 - i * 4 + Math.sin(t * 3 + i * 0.8) * i * 0.6;
      const py = L.hipL[1] - 2 + i * 1.5 - Math.sin(k * 3) * 3;
      SPR.draw(ctx, i === n - 1 ? 'p_tailtip' : 'p_vert', px, py, { rot: 0.0001 + i * 0.25, solid: flash || undefined });
    }
  }
  ctx.restore();
  // legs (not tilted, they carry the body)
  const legSwing = (side) => (anim === 'walk' ? (side ? legA : -legA) : 0);
  part('legR', L.hipR[0] + 1, L.hipR[1] + 1 + Math.max(0, up), legSwing(0) + 0.0001);
  part('legL', L.hipL[0] - 1, L.hipL[1] + 1 + Math.max(0, up), legSwing(1) + 0.0001, { flip: false });
  ctx.save();
  ctx.translate(0, pelvisY);
  ctx.rotate(L.tilt + lean);
  ctx.translate(0, -pelvisY + up);
  // heart sits behind the torso (visible through ribs)
  if (S.heart) {
    const beat = Math.sin(t * 7) > 0.6 ? 1 : 0;
    part('heart', L.heart[0] - beat * 0, L.heart[1], 0.0001);
  } else if (ghost && S.torso === 'ribcage') part('heart', L.heart[0], L.heart[1], 0.0001);
  // torso
  if (S.torso) part('torso', 0, L.ty, 0.0001);
  else {
    if (ghost) SPR.draw(ctx, GHOST_SPRITE.torso, 0, L.ty - 4, { solid: ghost });
    if (!o.noLump) SPR.draw(ctx, 'p_lump', 0, L.ty, { solid: flash || undefined });
  }
  // arms: far arm (right side of the picture = leading arm when facing right)
  part('armR', L.shR[0] + 1, L.shR[1], armA + 0.0001);
  part('armL', L.shL[0] - 1, L.shL[1], armB + 0.0001);
  // head
  const hx = L.neck[0] + headDX, hy = L.neck[1] + 1 + headDY + (anim === 'idle' ? Math.round(Math.sin(t * 2.6 - 0.6) * 0.5) : 0);
  if (S.head) {
    part('head', hx, hy, 0.0001);
    if (o.eyes && !flash) {
      const hs = SPR.get(PART_DEFS[S.head].sprite);
      const E = hs.pts;
      if (S.head === 'eyeball') drawIris(ctx, hx - hs.ax + E.iris[0], hy - hs.ay + E.iris[1], o.lookX || 1, 0, o.eyes);
      else if (E.eyeL) {
        ctx.fillStyle = o.eyes;
        const blink = Math.sin(t * 1.3 + x) > 0.985;
        if (!blink) {
          ctx.fillRect(Math.round(hx - hs.ax + E.eyeL[0]), Math.round(hy - hs.ay + E.eyeL[1]), 2, 1);
          ctx.fillRect(Math.round(hx - hs.ax + E.eyeR[0]), Math.round(hy - hs.ay + E.eyeR[1]), 2, 1);
        }
      }
    }
  } else if (ghost) part('head', hx, hy, 0);
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha = 1;
  return L;
}

// Eyeball iris (the eyeball part has no baked iris so it can look around)
function drawIris(ctx, cx, cy, dx, dy, tint) {
  const L = Math.hypot(dx, dy) || 1;
  const ox = Math.round((dx / L) * 1.6), oy = Math.round((dy / L) * 1.6);
  const x = Math.round(cx + ox), y = Math.round(cy + oy);
  ctx.fillStyle = tint && tint !== true ? tint : PAL.v;
  ctx.fillRect(x - 2, y - 1, 4, 2); ctx.fillRect(x - 1, y - 2, 2, 4);
  ctx.fillStyle = PAL.C; ctx.fillRect(x - 2, y - 1, 1, 1);
  ctx.fillStyle = PAL.k; ctx.fillRect(x - 1, y - 1, 2, 2);
  ctx.fillStyle = PAL.j; ctx.fillRect(x - 1, y - 1, 1, 1);
}

// Pixel-perfect icon of a part scaled to fit a box (used for inventory cells).
function drawPartIcon(ctx, type, cx, cy, maxSize = 22, opts = {}) {
  const d = PART_DEFS[type];
  const s = SPR.get(d.sprite);
  if (d.chain) { // bone tail: little curl of vertebrae
    for (let i = 0; i < 4; i++) SPR.draw(ctx, i === 3 ? 'p_tailtip' : 'p_vert', cx - 6 + i * 4, cy + Math.round(Math.sin(i * 1.2) * 3), { rot: 0.0001 + i * 0.3, alpha: opts.alpha });
    return;
  }
  const big = Math.max(s.w, s.h) > maxSize;
  const rot = big ? -Math.PI / 4 : 0.0001;
  const o = { rot, alpha: opts.alpha, solid: opts.solid };
  if (opts.outline) {
    const ol = SPR.outline(d.sprite, opts.outline);
    ctx.save(); ctx.translate(Math.round(cx), Math.round(cy)); ctx.rotate(rot); ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
    ctx.drawImage(ol, -s.w / 2 - 1, -s.h / 2 - 1); ctx.restore(); ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(rot);
  ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
  ctx.drawImage(o.solid ? SPR.solid(d.sprite, o.solid) : s.c, -Math.round(s.w / 2), -Math.round(s.h / 2));
  ctx.restore();
  ctx.globalAlpha = 1;
  if (type === 'eyeball') drawIris(ctx, cx, cy, 1, 0.3);
}

// ==== 33_scene_slab.js ====
// ---------------------------------------------------------------------------
// SLAB SCENE — stitch parts into a creature, then BRING TO LIFE.
// Click a part in the inventory to stitch it on; click a slot to take it off.
// ---------------------------------------------------------------------------
Scenes.slab = (() => {
  const S = {};
  const fx = new Particles();
  let t = 0, page = 0, jolt = 0, selected = null, life = null, lastStitch = null;
  let build = null; // { head: item|null, ... }
  const CELL_W = 34, CELL_H = 30, COLS = 3, ROWS = 5, PER = COLS * ROWS;
  const FEET_X = 240, FEET_Y = 208;
  const say = (x, h) => Game.talk.say(x, h);
  const emptyBuild = () => ({ head: null, torso: null, armL: null, armR: null, legL: null, legR: null, heart: null, back: null });
  const types = () => { const o = {}; for (const k in build) o[k] = build[k] ? build[k].type : null; return o; };
  const count = () => Object.values(build).filter(Boolean).length;

  S.enter = function () {
    if (!build) build = emptyBuild();
    Music.play('slab');
    life = null;
    selected = null;
    if (!Game.seen.slab) {
      Game.seen.slab = true;
      say(Game.inventory.length ? 'The slab. Click a part to stitch it on. Any combination works. Some work better.' : 'Nothing to stitch. The machine is that way.', 4);
    } else if (!Game.inventory.length && !count()) say('Empty-handed? The claw awaits.', 2.5);
  };
  S.uiNav = true; // arrows move a focus ring over the parts, slots and buttons; confirm presses it
  S.exit = function () {};
  // Parts stitched on but not yet brought to life still belong to the player: a save counts them as bag parts.
  S.buildTypes = () => (build ? Object.values(build).filter(Boolean).map((i) => (i.from ? { type: i.type, from: i.from } : i.type)) : []); // as saves hold them: remains keep their name
  S.reset = () => { build = null; life = null; selected = null; page = 0; lastStitch = null; };

  function stitch(item) {
    const d = PART_DEFS[item.type];
    let slot = d.slot;
    if (slot === 'arm') slot = !build.armR ? 'armR' : !build.armL ? 'armL' : 'armR';
    if (slot === 'leg') slot = !build.legR ? 'legR' : !build.legL ? 'legL' : 'legR';
    const setsBefore = setsOf(types());
    Game.takeItem(item.uid);
    if (build[slot]) Game.inventory.push(build[slot]);
    build[slot] = item;
    lastStitch = { slot, t: 0 };
    jolt = 0.25;
    Sfx.play('stitch');
    const L = rigLayout(types());
    const pt = { head: L.neck, torso: [0, L.ty], armL: L.shL, armR: L.shR, legL: L.hipL, legR: L.hipR, heart: L.heart, back: L.back }[slot] || [0, -30];
    fx.burst(FEET_X + pt[0] * 2, FEET_Y + pt[1] * 2, 10, { speed: 50, life: 0.45, ay: 60, color: ['#9be38f', '#fff6e3', '#4fae6c'] });
    Telemetry.log('stitch', { part: item.type, slot });
    Save.soon();
    if (vchance(0.3)) say(vpick(['Snug.', 'It fits. Mostly.', 'Needle, thread, hope.', 'Ooh, that suits them.', 'Stitch, stitch, stitch.', 'Lovely. Horrible. Lovely.']), 1.6);
    if (item.type === 'pegleg' && vchance(0.6)) say('A peg leg. Classic look. Terrible posture.', 2.2);
    for (const k of setsOf(types())) { // a set just came together: make a moment of it
      if (setsBefore.includes(k)) continue;
      const S = PART_SETS[k];
      Sfx.play('win_uncommon');
      fx.burst(FEET_X, FEET_Y - 60, 26, { speed: 100, life: 0.8, ay: 30, color: ['#f6c64b', '#fff1a6', '#fff6e3'] });
      fx.text(FEET_X, FEET_Y - 150, S.name.toUpperCase() + ' SET!', '#f6c64b', { font: 'main', life: 1.8, vy: -12 });
      fx.text(FEET_X, FEET_Y - 136, S.desc, '#fff1a6', { life: 1.8, vy: -12 });
      Telemetry.c.sets++;
      say(vpick([`The ${S.name} set! ${S.desc}. Now we're getting somewhere.`, `${S.name} set complete. ${S.desc}. Lovely.`]), 3.2);
    }
  }
  function unstitchSlot(slot) {
    if (!build[slot]) return;
    Game.inventory.push(build[slot]);
    build[slot] = null;
    Sfx.play('unstitch');
    jolt = 0.15;
  }
  function canBring() { return count() > 0 && Game.party.length < 3 && !life; }

  function bringToLife() {
    if (!canBring()) return;
    const c = new Creature(types());
    life = { t: 0, c, bolts: [], stage: 0 };
    Music.duck(0.7, 3);
    Sfx.play('zap');
    Telemetry.c.creatures++;
    Game.tally('creatures');
    Telemetry.log('create', { name: c.name, parts: c.parts().join(',') });
  }

  function finishLife() {
    const c = life.c;
    c.born = Engine.t;
    Game.party.push(c);
    Save.soon();
    build = emptyBuild();
    life = null;
    say(vpick(['Not pretty. But it\'ll fight.', 'Look at them go. Well. Look at them.', 'It\'s alive! Ish.', 'A face only a necromancer could love.']), 3);
    Game.talk.say(`Meet ${c.name}. Take them to the graveyard.`, 3.2, false);
  }

  function items() { return Game.inventory.slice().sort((a, b) => RARITY[PART_DEFS[b.type].rarity].order - RARITY[PART_DEFS[a.type].rarity].order || a.type.localeCompare(b.type)); }

  function partTip(type, extra, item) {
    const d = PART_DEFS[type], r = RARITY[d.rarity];
    const lines = [{ t: d.name, c: r.color }, { t: `${r.name} ${SLOT_NAMES[d.slot]}`, c: '#7a6a9a' }];
    if (item && item.from) lines.push({ t: `Once ${poss(item.from)}`, c: '#a08962' });
    if (d.set) {
      const S = PART_SETS[d.set], have = Object.values(types()).filter((x) => x && PART_DEFS[x].set === d.set).length;
      lines.push({ t: `${S.name} set ${Math.min(have, S.need)}/${S.need}: ${S.desc}`, c: have >= S.need ? '#f6c64b' : '#c9a24a' });
    }
    const st = [];
    if (d.hp) st.push('HP +' + d.hp);
    if (d.atk) st.push('ATK +' + d.atk);
    if (d.spd) st.push('SPD +' + d.spd);
    if (d.def) st.push('DEF +' + d.def);
    if (st.length) lines.push({ t: st.join('  '), c: '#ecdcbc' });
    if (d.trait) lines.push({ t: TRAITS[d.trait].name + ': ' + TRAITS[d.trait].desc, c: '#9be38f' });
    if (extra) lines.push({ t: extra, c: '#a08962' });
    return lines;
  }

  S.update = function (dt) {
    t += dt;
    jolt = Math.max(0, jolt - dt);
    fx.update(dt);
    Game.talk.update(dt);
    if (lastStitch) lastStitch.t += dt;
    if (life) {
      life.t += dt;
      const lt = life.t;
      if (life.stage === 0 && lt > 0.45) {
        life.stage = 1;
        Sfx.play('thunder');
        Engine.flash('#e7f7ff', 0.25);
        Engine.shake(5, 0.5);
        Engine.hitPause(0.08);
        for (let i = 0; i < 3; i++) life.bolts.push({ x0: FEET_X + vrand(-60, 60), seed: vrandInt(1, 999), t: 0 });
      }
      if (life.stage >= 1 && lt < 1.3 && vchance(dt * 30)) {
        fx.burst(FEET_X + vrand(-30, 30), FEET_Y - vrand(10, 120), 3, { speed: 70, life: 0.25, color: ['#c2f5ff', '#fff', '#9be38f'] });
        if (vchance(dt * 8)) Sfx.play('zap', { intensity: 0.4 });
      }
      if (life.stage === 1 && lt > 1.35) { life.stage = 2; Sfx.play('alive'); fx.burst(FEET_X, FEET_Y - 60, 30, { speed: 90, life: 0.8, ay: 40, color: ['#9be38f', '#fff6e3', '#4fae6c'] }); }
      if (life.stage === 2 && lt > 3.2) finishLife();
    }
    if (Input.hit('b') && !life) Engine.go('shop');
    if (Input.hit('a') && !UI.focusId && !life && canBring()) bringToLife();
    buildButtons();
  };

  function buildButtons() {
    const bs = [];
    const list = items();
    const pages = Math.max(1, Math.ceil(list.length / PER));
    page = clamp(page, 0, pages - 1);
    list.slice(page * PER, page * PER + PER).forEach((it, i) => {
      const x = 9 + (i % COLS) * (CELL_W + 2), y = 21 + Math.floor(i / COLS) * (CELL_H + 2);
      bs.push({ id: 'inv' + it.uid, x, y, w: CELL_W, h: CELL_H, label: '', item: it, kind: 'cell', silent: true, disabled: !!life,
        tip: partTip(it.type, 'click to stitch on', it), onClick: () => stitch(it) });
    });
    if (pages > 1) {
      bs.push({ id: 'pgL', x: 9, y: 182, w: 18, h: 12, label: '◀', onClick: () => { page--; Sfx.play('page'); } });
      bs.push({ id: 'pgR', x: 97, y: 182, w: 18, h: 12, label: '▶', onClick: () => { page++; Sfx.play('page'); } });
    }
    RIG_SLOTS.forEach(([slot], i) => {
      const it = build[slot];
      bs.push({ id: 'slot' + slot, x: 366, y: 20 + i * 17, w: 106, h: 16, label: '', kind: 'slot', slot, silent: true, disabled: !it || !!life,
        tip: it ? partTip(it.type, 'click to unstitch', it) : null, onClick: () => unstitchSlot(slot) });
    });
    bs.push({ id: 'life', x: 364, y: 200, w: 110, h: 22, label: 'BRING TO LIFE', style: 'green', disabled: !canBring(), kind: 'big', sound: 'ui_click',
      tip: Game.party.length >= 3 ? 'Party is full (3). Unstitch someone first.' : count() ? null : 'Stitch at least one part on.', onClick: bringToLife });
    Game.party.forEach((c, i) => {
      bs.push({ id: 'pty' + c.id, x: 9 + i * 36, y: 214, w: 34, h: 40, label: '', kind: 'party', c, silent: true, disabled: !!life,
        tip: [{ t: c.name, c: '#9be38f' }, { t: `HP ${Math.ceil(c.hp)}/${c.maxHp}  ATK ${c.atk}  SPD ${c.spd}`, c: '#ecdcbc' }, ...(c.kills ? [{ t: `${c.kills} kill${c.kills > 1 ? 's' : ''} so far`, c: '#a08962' }] : []), ...c.traits.map((x) => ({ t: TRAITS[x].name, c: '#7a6a9a' })), { t: selected === c ? 'click again to UNSTITCH' : 'click to select', c: '#a08962' }],
        onClick: () => {
          if (selected === c) {
            Game.party = Game.party.filter((x) => x !== c);
            for (const tp of c.parts()) Game.inventory.push(makePartItem(tp));
            selected = null;
            Sfx.play('unstitch');
            Telemetry.c.unstitched++;
            Save.soon();
            say(vpick([`${c.name.split(' ')[0]} is parts again. Circle of life.`, 'Back to bits. No hard feelings.']), 2.4);
          } else { selected = c; Sfx.play('ui_click'); }
        } });
    });
    bs.push({ id: 'back', x: 124, y: 4, w: 50, h: 14, label: '◀ SHOP', disabled: !!life, onClick: () => Engine.go('shop') });
    bs.push({ id: 'fight', x: 306, y: 4, w: 50, h: 14, label: 'FIGHT ▶', disabled: !Game.canFight() || !!life, style: 'red',
      tip: Game.canFight() ? null : 'Bring someone to life first.', onClick: () => Engine.go('battle') });
    S.buttons = bs;
    UI.set(bs);
  }

  S.draw = function (ctx) {
    BG.lab(ctx, t, { surge: life ? clamp(life.stage === 1 ? 1 - (life.t - 0.45) : life.stage === 2 ? 0.3 : life.t, 0, 1) : 0 });
    // creature on the slab
    const ty = types();
    const shakeX = life && life.stage === 1 ? vrand(-2, 2) : jolt > 0 ? Math.round(Math.sin(jolt * 60) * 1) : 0;
    const shakeY = life && life.stage === 1 ? vrand(-2, 2) : 0;
    if (life && life.stage >= 1 && life.t < 1.2) {
      ctx.fillStyle = 'rgba(14,11,22,0.55)'; ctx.fillRect(0, 0, W, H);
    }
    drawCreature(ctx, ty, FEET_X + shakeX, FEET_Y + shakeY, {
      scale: 2, t, anim: 'idle', ghost: life ? null : 'rgba(155,227,143,0.16)', noLump: !count(),
      eyes: life && life.stage >= 2 ? '#9be38f' : null,
      flash: life && life.stage === 1 && !Settings.v.reduceFlash && Math.sin(life.t * 50) > 0,
    });
    if (life && life.stage >= 1 && life.t < 1.3) {
      for (const b of life.bolts) {
        if (Settings.v.reduceFlash || Math.sin(life.t * 40 + b.seed) > -0.3) {
          const calm = Settings.v.reduceFlash; // reduceFlash: steady bolts instead of a flicker
          Draw.bolt(ctx, b.x0, 0, FEET_X + (calm ? 0 : vrand(-20, 20)), // calm-ok: steady when reduceFlash is on
             FEET_Y - (calm ? 75 : vrand(40, 110)), '#e7f7ff', 10, calm ? b.seed : b.seed + Math.floor(life.t * 20));
          Draw.glow(ctx, FEET_X, FEET_Y - 70, 90, '#6fd3ff', 0.25);
        }
      }
    }
    fx.draw(ctx);
    if (life && life.stage >= 2) {
      const k = clamp((life.t - 1.35) / 0.3, 0, 1);
      const y = 40 - Math.round((1 - easeOutBack(k)) * 20);
      Font.draw(ctx, 'IT\'S ALIVE!', 240, y, { scale: 3, color: '#9be38f', outline: PAL.k, shadow: '#274536', align: 'center', alpha: k });
      Font.draw(ctx, life.c.name, 240, y + 28, { color: '#fff6e3', outline: PAL.k, align: 'center', alpha: k });
    }

    // inventory panel
    Draw.panel(ctx, 4, 4, 114, 196, 'slate');
    Font.draw(ctx, 'INVENTORY', 10, 9, { color: '#ecdcbc', shadow: PAL.k });
    Font.draw(ctx, String(Game.inventory.length), 112, 10, { font: 'small', color: '#7a6a9a', align: 'right' });
    const bs = S.buttons || [];
    const shownCells = bs.filter((b) => b.kind === 'cell').length;
    for (let i = 0; i < PER; i++) {
      const x = 9 + (i % COLS) * (CELL_W + 2), y = 21 + Math.floor(i / COLS) * (CELL_H + 2);
      if (i >= shownCells) { Draw.panel(ctx, x, y, CELL_W, CELL_H, 'dark'); }
    }
    for (const b of bs) {
      if (b.kind === 'cell') {
        const d = PART_DEFS[b.item.type], r = RARITY[d.rarity];
        Draw.panel(ctx, b.x, b.y, b.w, b.h, 'dark');
        if (r.glow) Draw.frame(ctx, b.x + 1, b.y + 1, b.w - 2, b.h - 2, r.glow);
        if (b.hover) Draw.frame(ctx, b.x - 1, b.y - 1, b.w + 2, b.h + 2, '#fff6e3');
        drawPartIcon(ctx, b.item.type, b.x + b.w / 2, b.y + b.h / 2 + (b.hover ? -1 : 0), 24);
        if (r.order) Font.draw(ctx, '★'.repeat(r.order), b.x + 3, b.y + 3, { font: 'small', color: r.color, shadow: PAL.k }); // rarity as a count, not just a colour
      }
    }
    if (!Game.inventory.length) Font.drawWrapped(ctx, 'Empty. Win parts from the claw machine.', 12, 86, 100, { color: '#7a6a9a' });

    // parts list
    Draw.panel(ctx, 362, 4, 114, 192, 'slate');
    Font.draw(ctx, 'PARTS', 368, 9, { color: '#ecdcbc', shadow: PAL.k });
    for (const b of bs) {
      if (b.kind !== 'slot') continue;
      const it = build[b.slot];
      if (b.hover) Draw.rect(ctx, b.x, b.y, b.w, b.h, '#2d3344');
      Draw.frame(ctx, b.x + 1, b.y + 1, 14, 14, '#3b3654');
      if (it) {
        const d = PART_DEFS[it.type], r = RARITY[d.rarity];
        ctx.save(); ctx.beginPath(); ctx.rect(b.x + 2, b.y + 2, 12, 12); ctx.clip();
        drawPartIcon(ctx, it.type, b.x + 8, b.y + 8, 12);
        ctx.restore();
        Font.draw(ctx, d.name, b.x + 18, b.y + 1, { color: '#ecdcbc' });
        Font.draw(ctx, r.name, b.x + 18, b.y + 10, { font: 'small', color: r.color });
      } else {
        Font.draw(ctx, RIG_SLOT_LABEL[b.slot], b.x + 18, b.y + 4, { color: '#4b4466' });
      }
      if (lastStitch && lastStitch.slot === b.slot && lastStitch.t < 0.4) Draw.frame(ctx, b.x, b.y, b.w, b.h, '#9be38f');
    }
    // stats preview
    if (count()) {
      const c = new Creature(ty);
      const y0 = 158;
      const stat = (ico, label, v, x) => { if (SPR.has(ico)) SPR.draw(ctx, ico, x + 3, y0 + 4); Font.draw(ctx, label + ' ' + v, x + 9, y0, { color: '#ecdcbc' }); };
      stat('ico_heart', 'HP', c.maxHp, 366); stat('ico_sword', 'ATK', Math.round(c.atk), 404); stat('ico_boot', 'SPD', c.spd, 444);
      const tr = c.traits.length ? c.traits.map((x) => TRAITS[x].name).join(' · ') : 'no special traits';
      Font.drawWrapped(ctx, tr, 369, y0 + 12, 104, { font: 'small', color: c.traits.length ? '#9be38f' : '#4b4466' });
      const pw = clamp(c.power / 160, 0, 1);
      Draw.rect(ctx, 400, y0 + 27, 50, 4, PAL.k);
      Draw.rect(ctx, 401, y0 + 28, Math.round(48 * pw), 2, pw > 0.66 ? PAL.L : pw > 0.33 ? PAL.d : PAL.B);
      Font.draw(ctx, 'POWER', 368, y0 + 26, { font: 'small', color: '#7a6a9a' });
      Font.draw(ctx, String(c.power), 472, y0 + 26, { font: 'small', color: '#ecdcbc', align: 'right' });
    }

    // party roster
    Draw.panel(ctx, 4, 204, 114, 62, 'slate');
    Font.draw(ctx, 'PARTY ' + Game.party.length + '/3', 10, 207, { font: 'small', color: '#a6aec2' });
    for (let i = 0; i < 3; i++) {
      const x = 9 + i * 36, y = 214;
      const b = bs.find((q) => q.kind === 'party' && q.c === Game.party[i]);
      Draw.panel(ctx, x, y, 34, 40, b && (b.hover || selected === b.c) ? 'green' : 'dark');
      const c = Game.party[i];
      if (c) {
        ctx.save(); ctx.beginPath(); ctx.rect(x + 1, y + 1, 32, 38); ctx.clip();
        const L = rigLayout(c.slots);
        drawCreature(ctx, c.slots, x + 17, y + 5 - L.top, { t: t + i, anim: 'idle', eyes: '#9be38f' });
        ctx.restore();
        const k = c.hp / c.maxHp;
        Draw.rect(ctx, x + 3, y + 35, 28, 3, PAL.k);
        Draw.rect(ctx, x + 4, y + 36, Math.round(26 * k), 1, k > 0.5 ? PAL.d : k > 0.25 ? PAL.L : PAL.R);
        if (k <= 0.5) for (let i = 0; i < 26 * k; i += 2) Draw.rect(ctx, x + 4 + i, y + 36, 1, 1, PAL.k); // hurt: the bar is dashed
        if (selected === c) Font.draw(ctx, 'UNSTITCH?', x + 17, y + 42, { font: 'small', color: PAL.R, align: 'center' });
      }
    }

    // buttons (life, nav, paging)
    for (const b of bs) if (!b.kind || b.kind === 'big') UI.drawButton(ctx, b);

    drawStagePreview(ctx, 126, 22, 230, Game.stage);
    // dialogue box
    if (Game.talk.visible()) {
      Draw.panel(ctx, 124, 236, 232, 30, 'dark');
      if (SPR.has('reaper_face')) SPR.draw(ctx, Game.talk.talking() && blinkOn(t, 3.5) && SPR.has('reaper_face_talk') ? 'reaper_face_talk' : 'reaper_face', 138, 251);
      Font.drawWrapped(ctx, Game.talk.text, 152, 241, 198, { color: '#ecdcbc', maxChars: Math.floor(Game.talk.shown) });
    }
  };

  return S;
})();

// ==== 34_scene_battle.js ====
// ---------------------------------------------------------------------------
// BATTLE SCENE — "Graveyard of Second Chances". Your creations auto-fight the
// shades; you get one lever (ZAP: heal + haste) and the choice to retreat.
// Winning pays tokens and restocks the machine; the dead go back in the pile.
//
// This file only shows the fight. The rules are in 13_battlesim.js (combat) and
// Game.applyBattle (what a result is worth); the scene turns their events into
// particles, sound, shake and words.
// ---------------------------------------------------------------------------
Scenes.battle = (() => {
  const S = {};
  const fx = new Particles();
  const debris = new Particles();
  let sim = null;
  let t = 0, phase = 'ready', result = null, menuSel = 0, logLines = [], resultT = 0;
  let coinsShown = 0, bolts = [], fightStage = 1;
  let endT = 0, ending = false; // the beat between the last blow and the result screen
  const say = (x, h) => Game.talk.say(x, h);
  const log = (s) => { logLines.push(s); if (logLines.length > 2) logLines.shift(); };
  const bodyH = (u) => (u.team === 'ally' ? -rigLayout(u.c.slots).top : { wisp: 26, shade: 32, wraith: 48 }[u.kind]);

  S.enter = function () {
    t = 0; phase = 'ready'; result = null; menuSel = 0; logLines = []; resultT = 0; bolts = []; fightStage = Game.stage; endT = 0; ending = false;
    fx.list = []; debris.list = [];
    sim = new BattleSim({ party: Game.party, stage: Game.stage, onEvent: onSim });
    for (const u of sim.units) { u.bob = vrand(0, 6); u.flashT = 0; }
    Music.play('battle');
    const boss = sim.kinds.includes('wraith');
    say(Game.stage === 1 ? 'Your creations fight for you. Give them better parts.' :
      boss ? 'That\'s a Wraith. It owes me money. Bring friends. Three of them, ideally.' :
      vpick(['Stage ' + Game.stage + '. The shades are getting braver.', 'Back again? The graveyard remembers you.', 'Chin up, bones out.']), 3.8);
    Telemetry.c.battles++;
    Telemetry.log('battle', { stage: Game.stage, party: sim.units.filter((u) => u.team === 'ally').length, enemies: sim.kinds.join(',') });
  };
  S.exit = function () {};

  function start() {
    if (phase !== 'ready') return;
    phase = 'fight';
    sim.start();
    Game.talk.clear(); // the Reaper's intro line would hide the combat log for most of the fight
    Sfx.play('swing');
    Engine.shake(2, 0.2);
    log('The shades drift closer...');
  }

  function zap() {
    if (phase !== 'fight' || !sim.zap()) return Sfx.play('ui_deny');
    Telemetry.c.zaps++;
    Game.tally('zaps');
    log('ZAP! Your creations surge with borrowed life.');
  }

  function retreat() {
    if ((phase !== 'fight' && phase !== 'ready') || sim.over) return;
    Telemetry.c.retreats++;
    sim.stop();
    finish('retreat');
  }

  // ------------------------------------------------------- sim events -> juice
  function onSim(type, d) {
    switch (type) {
      case 'attackStart': if (d.u.team === 'enemy' || vchance(0.5)) Sfx.play('swing', { intensity: 0.4 }); break;
      case 'whiff': Sfx.play('swing'); break;
      case 'miss':
        fx.text(d.def.x, d.def.y - bodyH(d.def) - 6, 'MISS', '#a6aec2');
        Sfx.play('swing', { pitch: 1.3 });
        break;
      case 'hit': {
        const { att, def, dmg, crit } = d;
        def.flashT = Settings.v.reduceFlash ? 0 : 0.12; // the white hit-flash is a blink: off when flashing is reduced
        const col = crit ? PAL.L : att.team === 'ally' ? '#fff6e3' : PAL.r;
        fx.text(def.x + vrand(-4, 4), def.y - bodyH(def) - 4, crit ? dmg + '!' : String(dmg), col, { font: crit ? 'main' : 'small', scale: crit ? 2 : 1 });
        if (def.team === 'enemy') fx.burst(def.x, def.y - bodyH(def) / 2, crit ? 12 : 6, { speed: 60, ay: -20, drag: 2, life: 0.5, color: ['#1b1526', '#33274a', '#5b4a78'], sizes: [1, 2] });
        else fx.burst(def.x, def.y - bodyH(def) / 2, crit ? 10 : 5, { speed: 70, ay: 200, life: 0.5, color: ['#fff6e3', '#cdb892', '#e8405a'], floor: def.y });
        Sfx.play(def.team === 'enemy' ? 'enemy_hit' : 'hit', { crit, intensity: crit ? 1 : 0.7 });
        if (crit) { Engine.hitPause(0.05); Engine.shake(2.5, 0.15); if (vchance(0.5)) log(`${att.name} crits for ${dmg}!`); }
        break;
      }
      case 'heal': fx.text(d.u.x, d.u.y - bodyH(d.u) - 10, '+' + d.amount, '#9be38f'); break;
      case 'stun': fx.text(d.u.x, d.u.y - bodyH(d.u) - 16, 'STUN', PAL.L); Engine.shake(3, 0.2); break;
      case 'bleed': fx.text(d.u.x + vrand(-6, 6), d.u.y - bodyH(d.u) - 16, 'BLEED', '#e8405a'); break;
      case 'burn': fx.text(d.u.x, d.u.y - bodyH(d.u) - 16, 'BURN', '#ffb070'); break;
      case 'whip': fx.text(d.u.x, d.u.y - bodyH(d.u) - 14, 'WHIP!', '#e7a6f0'); break;
      case 'fireball':
        d.p.y = d.u.y - bodyH(d.u) + 8;
        Sfx.play('zap', { intensity: 0.5, pitch: 0.7 });
        break;
      case 'fireHit': fx.burst(d.p.x, d.p.y, 10, { speed: 50, life: 0.4, color: [PAL.A, PAL.L] }); break;
      case 'undying': {
        const u = d.u;
        fx.text(u.x, u.y - 70, 'UNDYING!', '#b56bd6', { font: 'main', life: 1.4 });
        fx.burst(u.x, u.y - 30, 24, { speed: 80, life: 0.8, color: ['#b56bd6', '#e7a6f0', '#0e0b16'] });
        Sfx.play('alive');
        log(`${u.name} refuses to stay dead.`);
        break;
      }
      case 'zap': {
        Sfx.play('thunder');
        Engine.flash('#c2f5ff', 0.2);
        Engine.shake(3, 0.3);
        bolts = d.healed.map(({ u }) => ({ x: u.x, y: u.y, t: 0, seed: vrandInt(1, 999) }));
        for (const { u, amount } of d.healed) {
          fx.text(u.x, u.y - 60, '+' + amount, '#9be38f', { font: 'main' });
          fx.burst(u.x, u.y - 30, 14, { speed: 60, life: 0.5, color: ['#c2f5ff', '#9be38f', '#fff'] });
        }
        break;
      }
      case 'kill': onKill(d.u, d.by); break;
    }
  }

  function onKill(u, by) {
    if (u.team === 'enemy') {
      Sfx.play('enemy_die');
      Engine.shake(u.K.boss ? 6 : 2, 0.3);
      if (u.K.boss) { Engine.hitPause(0.15); Engine.flash('#ff4040', 0.2); }
      for (let i = 0; i < 24 + (u.K.boss ? 40 : 0); i++) fx.add({ x: u.x + vrand(-10, 10), y: u.y - vrand(0, bodyH(u)), vx: vrand(-20, 20), vy: vrand(-50, -10), drag: 1.5, life: vrand(0.6, 1.3), color: vpick(['#0e0b16', '#1b1526', '#33274a', '#ff4040']), size: vpick([1, 2, 2, 3]) });
      if (by && by.traits.includes('golden')) fx.text(u.x, u.y - 30, '+1 TOKEN', PAL.L, { font: 'main' });
      if (by) log(`${by.name} dispatched a ${u.name}.`);
    } else {
      Sfx.play('creature_die');
      Music.duck(0.6, 1.2); // a small silence: the music leaves the room for a moment when one of yours falls
      Engine.shake(4, 0.35);
      Engine.hitPause(0.1);
      // dismember: every part flies off with a bit of physics
      const L = rigLayout(u.c.slots);
      const at = { head: L.neck, torso: [0, L.ty], armL: L.shL, armR: L.shR, legL: L.hipL, legR: L.hipR, heart: L.heart, back: L.back };
      for (const [slot, type] of Object.entries(u.c.slots)) {
        if (!type) continue;
        const pd = PART_DEFS[type];
        const p = at[slot] || [0, -20];
        debris.add({ kind: 'spr', spr: pd.chain ? 'p_vert' : pd.sprite, x: u.x + p[0], y: u.y + p[1], vx: vrand(-90, 90), vy: vrand(-170, -80), ay: 520, vr: vrand(-10, 10), life: 3.2, floor: u.y + vrand(-2, 3), bounce: 0.4, fade: true });
      }
      fx.burst(u.x, u.y - 30, 16, { speed: 90, ay: 300, life: 0.8, color: ['#fff6e3', '#cdb892', '#e8405a'], floor: u.y });
      log(`${u.name} fell apart. Literally.`);
      say(vpick(['I\'ll put those back in the machine.', 'Back to the pile with you.', 'Nothing\'s wasted here.']), 2.2);
    }
  }

  const announce = (s) => { if (typeof Announce !== 'undefined') Announce.say(s); };

  // The last blow lands. Give it room: music goes quiet, time slows, and only then do the results appear.
  // A win is short and bright; the final boss is long and quiet; a defeat is quiet and a little cruel.
  function beginEnding() {
    ending = true; endT = 0;
    const lose = !sim.won, final = sim.won && isFinalStage(Game.stage);
    if (lose || final) Music.stop(); // silence is the effect
    if (final) { Engine.slowmo(0.25, 1.4); Engine.hitPause(0.25); Engine.flash('#fff6e3', 0.5); Engine.shake(7, 0.8); }
    if (lose) { Engine.slowmo(0.4, 0.9); setTimeout(() => Sfx.play('heartbeat'), 300); setTimeout(() => Sfx.play('heartbeat'), 950); Sfx.play('defeat'); }
  }

  function finish(kind) {
    if (result) return;
    phase = 'done';
    resultT = 0;
    for (const u of sim.units) u.flashT = 0; // a unit hit in the last instant would otherwise stay a white silhouette on the result screen
    result = Game.applyBattle(sim, kind);
    coinsShown = 0;
    if (kind === 'win' && result.won) {
      Sfx.play('victory');
      say('Well. Somebody had to. The rent is... paid. Go on: take a bow.', 4);
      announce('The Landlord is down. You win.');
    } else if (kind === 'win') {
      Sfx.play('victory');
      Music.duck(0.8, 2.5);
      say(vpick(['The graveyard provides.', 'Look at them. My little war crimes.', 'Victory! Mostly intact, even.']), 3);
      announce('Stage cleared. ' + result.reward + ' tokens.');
    } else if (kind === 'lose') {
      say('Back to the pile they go. Nothing\'s wasted here. Give them better parts.', 4);
      announce('Defeated. ' + result.lost.length + ' creatures fell apart into the machine. ' + result.reward + ' tokens.');
    } else {
      say('Retreat! Live to rot another day.', 2.5);
      announce('Retreated. ' + result.reward + ' tokens.');
    }
    Telemetry.log('battleEnd', { kind, stage: fightStage, reward: result.reward, lost: result.lost.length });
  }

  S.cheatWin = function () { sim && sim.killEnemies(); };
  S.sim = () => sim; // read-only handle for tests and tools

  S.update = function (dt, realDt) {
    t += dt;
    Game.talk.update(dt);
    fx.update(dt); debris.update(dt);
    for (const b of bolts) b.t += dt;
    bolts = bolts.filter((b) => b.t < 0.35);
    if (phase === 'fight') {
      const speed = Game.fast ? 2 : 1;
      if (Game.fast) Telemetry.c.fastSecs += realDt;
      sim.step(dt * speed);
      const bdt = dt * CONFIG.battleSpeed * speed;
      for (const u of sim.units) {
        if (u.dead) continue;
        u.flashT = Math.max(0, u.flashT - dt);
        if (u.bleedT > 0 && vchance(bdt * 4)) fx.add({ x: u.x + vrand(-4, 4), y: u.y - bodyH(u) / 2, vy: 30, ay: 100, life: 0.4, color: '#e8405a' });
        if (u.burnT > 0 && vchance(bdt * 10)) fx.add({ x: u.x + vrand(-6, 6), y: u.y - vrand(4, bodyH(u)), vy: -30, life: 0.4, color: vpick([PAL.A, PAL.L, PAL.R]) });
      }
      for (const p of sim.projectiles) if (!p.done && vchance(0.6)) fx.add({ x: p.x, y: p.y + vrand(-2, 2), vx: -p.vx * 0.05, vy: vrand(-10, 10), life: 0.25, color: vpick([PAL.A, PAL.L, PAL.R]) });
      if (sim.over && !result) {
        if (!ending) beginEnding();
        endT += realDt;
        if (endT > (sim.won ? (isFinalStage(Game.stage) ? 2.4 : 0.6) : 1.6)) finish(sim.won ? 'win' : 'lose');
      }
    }
    if (phase === 'done') {
      resultT += realDt;
      if (coinsShown < result.reward && resultT > 0.8 + coinsShown * 0.18) { coinsShown++; Sfx.play('coins_count'); }
    }
    // input. The result screen ignores it for a moment so a mashed key or click at the last blow cannot skip
    // the rewards ("+4 tokens", "3 parts dropped into the machine") before they are read.
    const items = menuItems();
    if (phase === 'done' && resultT < 0.6) { UI.set([]); return; }
    if (Input.hit('up')) { menuSel = (menuSel + items.length - 1) % items.length; Sfx.play('ui_hover'); }
    if (Input.hit('down')) { menuSel = (menuSel + 1) % items.length; Sfx.play('ui_hover'); }
    menuSel = clamp(menuSel, 0, items.length - 1);
    if (Input.hit('a')) { const it = items[menuSel]; if (it && !it.disabled) it.act(); else Sfx.play('ui_deny'); }
    if (Input.hit('b') && phase === 'done') Engine.go(result.won ? 'end' : 'shop');
    UI.set(items.map((it, i) => ({ id: 'bm' + i, x: 12, y: 212 + i * 16, w: 94, h: 15, label: it.label, disabled: it.disabled, kind: 'menu', idx: i, silent: false,
      onClick: () => { menuSel = i; it.act(); } })));
  };

  function menuItems() {
    if (phase === 'done') {
      if (result.won) return [{ label: 'CONTINUE', act: () => Engine.go('end') }];
      const canGo = Game.canFight() && result.kind === 'win';
      return [
        { label: 'BACK TO SHOP', act: () => Engine.go('shop') },
        { label: 'FIGHT ON', disabled: !canGo, act: () => Engine.go('battle') },
      ];
    }
    const cd = sim.zapCd, over = sim.over;
    return [
      phase === 'ready' ? { label: 'FIGHT', act: start } : { label: cd > 0 ? `ZAP  ${Math.ceil(cd)}s` : 'ZAP', disabled: cd > 0 || over, act: zap },
      { label: Game.fast ? 'SPEED  x2' : 'SPEED  x1', act: () => { Game.fast = !Game.fast; Telemetry.c.speedToggles++; Sfx.play('ui_click'); Save.soon(); } },
      { label: 'RETREAT', disabled: over, act: retreat },
    ];
  }

  // ------------------------------------------------------------------ draw
  function drawEnemy(ctx, u) {
    const hover = Math.sin(t * 3 + u.bob) * 2 - u.K.hover;
    const atk = u.state === 'attack' && u.animT > 0.25 && u.animT < 0.75;
    const base = u.K.spr;
    const name = atk && SPR.has(base + '_atk') ? base + '_atk' : base + '_' + (Math.floor(t * 4 + u.bob) % 2);
    const lunge = u.state === 'attack' ? Math.sin(u.animT * Math.PI) * -6 : 0;
    if (SPR.has(name)) SPR.draw(ctx, name, u.x + lunge, u.y + hover, { solid: u.flashT > 0 ? '#fff6e3' : undefined });
    else { ctx.fillStyle = u.flashT > 0 ? '#fff' : '#1b1526'; ctx.fillRect(u.x - 8, u.y + hover - bodyH(u), 16, bodyH(u)); ctx.fillStyle = '#ff4040'; ctx.fillRect(u.x - 4, u.y + hover - bodyH(u) + 6, 2, 2); }
    if (u.stunT > 0) for (let i = 0; i < 3; i++) { const a = t * 6 + i * 2.1; ctx.fillStyle = PAL.L; ctx.fillRect(Math.round(u.x + Math.cos(a) * 8), Math.round(u.y - bodyH(u) - 4 + Math.sin(a) * 2), 1, 1); }
  }

  function drawBar(ctx, u) {
    const w = u.K && u.K.boss ? 40 : 24;
    const x = Math.round(u.x - w / 2), y = Math.round(u.y - bodyH(u) - 10);
    const k = clamp(u.hp / u.maxHp, 0, 1);
    Draw.rect(ctx, x - 1, y - 1, w + 2, 4, PAL.k);
    Draw.rect(ctx, x, y, w, 2, '#33274a');
    Draw.rect(ctx, x, y, Math.round(w * k), 2, u.team === 'ally' ? (k > 0.35 ? '#5fd3a0' : PAL.L) : '#e8405a');
    Draw.rect(ctx, x, y, Math.round(w * k), 1, u.team === 'ally' ? '#9bf5c8' : '#ff7d8a');
    // who is who and how hurt, without colour: a heart marks yours, a cross marks theirs, a hurt bar is dashed,
    // and your creatures show their health as a number
    Font.draw(ctx, u.team === 'ally' ? '♥' : '×', x - 7, y - 2, { font: 'small', color: u.team === 'ally' ? '#9bf5c8' : '#ff7d8a', shadow: PAL.k });
    if (k < 0.35) for (let i = 0; i < w * k; i += 2) Draw.rect(ctx, x + i, y, 1, 2, PAL.k);
    if (u.team === 'ally') Font.draw(ctx, String(Math.ceil(u.hp)), x + w + 3, y - 2, { font: 'small', color: k < 0.35 ? '#f6c64b' : '#cdb892', shadow: PAL.k });
  }

  S.draw = function (ctx) {
    BG.graveyard(ctx, t);
    // shadows
    for (const u of sim.units) {
      if (u.dead) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      const w = u.team === 'ally' ? 16 : u.K.w * 0.7;
      ctx.fillRect(Math.round(u.x - w / 2), u.y, Math.round(w), 2);
    }
    debris.draw(ctx);
    const order = sim.units.filter((u) => !u.dead).sort((a, b) => a.y - b.y);
    for (const u of order) {
      if (u.team === 'ally') {
        drawCreature(ctx, u.c.slots, u.x, u.y, { t: t + u.bob, anim: phase === 'fight' ? u.state : 'idle', animT: u.animT, flash: u.flashT > 0, eyes: u.hasteT > 0 ? '#c2f5ff' : '#9be38f', lookX: 1 });
        if (u.hasteT > 0 && vchance(0.3)) fx.add({ x: u.x - 10, y: u.y - vrand(5, 40), vx: -60, life: 0.2, color: '#c2f5ff' });
      } else drawEnemy(ctx, u);
    }
    for (const u of order) if (phase !== 'done' || u.team === 'ally') drawBar(ctx, u);
    for (const b of bolts) Draw.bolt(ctx, b.x + (Settings.v.reduceFlash ? 0 : vrand(-20, 20)), 0, b.x, b.y - 30, '#e7f7ff', 9, Settings.v.reduceFlash ? b.seed : b.seed + Math.floor(b.t * 30)); // reduceFlash: a steady bolt, not a flicker
    fx.draw(ctx);
    // projectiles
    for (const p of sim.projectiles) { Draw.glow(ctx, p.x, p.y, 10, '#ffb070', 0.5); Draw.rect(ctx, p.x - 2, p.y - 2, 4, 4, PAL.L); Draw.rect(ctx, p.x - 1, p.y - 1, 2, 2, '#fff'); }

    // HUD: stage title
    Font.draw(ctx, stageName(fightStage), 472, 7, { align: 'right', color: '#cdb892', shadow: PAL.k });
    Font.draw(ctx, stageTitle(fightStage), 472, 18, { align: 'right', color: '#a6aec2', shadow: PAL.k });
    if (SPR.has('ico_token')) SPR.draw(ctx, 'ico_token', 12, 12);
    Font.draw(ctx, String(Game.tokens + (phase === 'fight' ? sim.goldKills : 0)), 20, 8, { color: PAL.L, shadow: PAL.k });
    if (phase !== 'done') drawPrize(ctx);

    // menu
    const items = menuItems();
    Draw.panel(ctx, 8, 206, 102, 12 + items.length * 16, 'slate');
    items.forEach((it, i) => {
      const y = 212 + i * 16;
      const hot = UI.buttons[i] && UI.buttons[i].hover;
      if (hot || i === menuSel) { if (i === menuSel) Font.draw(ctx, '▶', 15, y + 3, { color: '#fff6e3' }); }
      Font.draw(ctx, it.label, 25, y + 3, { color: it.disabled ? '#4b4466' : hot || i === menuSel ? '#fff6e3' : '#cdb892' });
    });
    // narration box
    Draw.panel(ctx, 116, 222, 356, 42, 'slate');
    if (phase === 'done') drawResult(ctx);
    else if (Game.talk.visible()) Font.drawWrapped(ctx, Game.talk.text, 126, 229, 336, { color: '#ecdcbc', maxChars: Math.floor(Game.talk.shown) });
    else logLines.forEach((l, i) => Font.draw(ctx, l, 126, 229 + i * 12, { color: i === logLines.length - 1 ? '#ecdcbc' : '#7a6a9a' }));
    if (phase === 'ready' && Math.sin(t * 5) > 0) Draw.frame(ctx, 10, 210, 98, 17, '#ff8ac6');
  };

  // what winning pays: tokens plus the parts that will drop into the machine
  function drawPrize(ctx) {
    const prize = sim.prize, w = 72 + prize.length * 26, x = Math.round(240 - w / 2);
    Draw.panel(ctx, x, 4, w, 36, 'slate');
    Font.draw(ctx, 'IF YOU WIN', x + 6, 8, { font: 'small', color: '#a6aec2' });
    if (SPR.has('ico_token')) SPR.draw(ctx, 'ico_token', x + 10, 28);
    Font.draw(ctx, '+' + Game.battlePay(fightStage, 'win', 1, false), x + 18, 24, { color: PAL.L });
    prize.forEach((type, i) => drawPartIcon(ctx, type, x + 70 + i * 26, 24, 20, { outline: RARITY[PART_DEFS[type].rarity].glow || undefined }));
  }

  function drawResult(ctx) {
    const r = result;
    const title = r.kind === 'win' ? (r.won ? 'THE LANDLORD IS DOWN!' : 'STAGE CLEARED!') : r.kind === 'lose' ? 'DEFEATED' : 'RETREATED';
    const col = r.kind === 'win' ? '#9be38f' : r.kind === 'lose' ? '#e8405a' : '#cdb892';
    const k = clamp(resultT / 0.3, 0, 1);
    Font.draw(ctx, title, 240, 70 - Math.round((1 - easeOutBack(k)) * 20), { scale: 3, color: col, outline: PAL.k, shadow: '#0e0b16', align: 'center', alpha: k });
    if (r.lost.length) Font.draw(ctx, 'Lost: ' + r.lost.join(', '), 240, 100, { align: 'center', color: '#a6aec2', outline: PAL.k });
    // narration: rewards
    let x = 126;
    if (r.reward) {
      if (SPR.has('ico_token')) for (let i = 0; i < coinsShown; i++) SPR.draw(ctx, 'ico_token', x + 4 + i * 10, 234);
      Font.draw(ctx, `+${coinsShown} tokens`, x + 8 + r.reward * 10, 230, { color: PAL.L });
    }
    const back = [...r.restocked, ...r.deadParts.map((d) => d.type)];
    if (back.length) {
      Font.draw(ctx, 'BACK IN THE MACHINE', 126, 243, { font: 'small', color: '#7a6a9a' });
      back.slice(0, 9).forEach((type, i) => drawPartIcon(ctx, type, 252 + i * 22, 244, 16, { outline: RARITY[PART_DEFS[type].rarity].glow || undefined }));
      if (back.length > 9) Font.draw(ctx, '+' + (back.length - 9), 252 + 9 * 22, 241, { font: 'small', color: '#a6aec2' });
    }
    if (r.luck) Font.draw(ctx, '+' + r.luck + ' LUCK', 462, 230, { align: 'right', color: '#f6c64b' });
    if (!r.reward && !back.length) Font.draw(ctx, 'No reward. No shame. Well, some shame.', 126, 234, { color: '#7a6a9a' });
  }

  return S;
})();

// ==== 35_scene_shop.js ====
// ---------------------------------------------------------------------------
// SHOP SCENE — title screen and hub. The cabinet's window shows the live pile.
// COLLECT (claw) · COMBINE (slab) · COMMAND (graveyard).
// ---------------------------------------------------------------------------
Scenes.shop = (() => {
  const S = {};
  const fx = new Particles();
  let t = 0, titleT = 0, opened = false, zoom = null, blinkT = 0, chatT = 8, catT = 0, catMood = 0, lean = 0, tokenPop = 0;
  const MX = 6, MY = 4, MW = 194; // cabinet
  const GLX = MX + 7, GLY = 52; // glass (180x122 mini world)
  const REAPER_X = 300, REAPER_Y = 192, COUNTER_Y = 196; // body anchor: his robe stops at the counter's far edge (y 189)
  const say = (x, h, force = true) => Game.talk.say(x, h, force);
  const IDLE_LINES = [
    'Everything\'s used. Nothing\'s cheap. That\'s the deal.',
    'One token, one grab. Life is simple when you\'re dead.',
    'Bodies. Power. A brighter tomorrow. It\'s on the poster, so it\'s true.',
    'I\'m told the claw is rigged. I\'m told a lot of things.',
    'The cat is not for sale. I asked.',
    'Every part in there was someone\'s favourite part once.',
    'Give them better parts. They\'ll give you better days.',
  ];
  // only while the Rig is on (?rig=0 is the original game)
  const RIG_LINES = [
    'There\'s a panel on the side of the machine. I didn\'t put it there. Flip the switches.',
    'Bad luck isn\'t wasted here. I bank it. Ask me how I know.',
  ];
  const idleLine = () => vpick(Rig.on ? IDLE_LINES.concat(RIG_LINES) : IDLE_LINES);

  function hint() {
    if (Game.tokens > 0 && !Game.inventory.length && !Game.party.length) return 'collect';
    if (Game.inventory.length >= 3 && Game.party.length < 3 && (Game.tokens === 0 || Game.inventory.length >= 5)) return 'combine';
    if (Game.party.length && (Game.tokens === 0 || !Game.inventory.length)) return 'command';
    if (Game.tokens > 0) return 'collect';
    if (Game.inventory.length) return 'combine';
    return null;
  }

  S.enter = function (params) {
    Music.play('shop');
    zoom = null;
    if (opened) {
      if (Game.broke()) { Game.givePity(); say('Broke? Here. On the house. Death is patient.', 3.5); tokenPop = 1; }
      else if (Game.stage > 1 && !Game.seen['stage' + Game.stage]) { Game.seen['stage' + Game.stage] = 1; say(vpick(['Welcome back, champion. The machine restocked itself. Funny, that.', 'Fresh parts in the machine. Some of them are your old friends.']), 3.5); }
      else if (vchance(0.5)) say(vpick(['Welcome back.', 'Good parts make great friends.', 'The machine missed you. It told me.']), 2.4);
    }
    if (params && params.title) { opened = false; titleT = 0; } // back to the title screen: the Reaper waits for the player again
    if (params && params.skipIntro) open();
  };

  // The title screen (36_menu.js) calls this when the player picks START or CONTINUE.
  function open(resumed) {
    if (opened) return;
    opened = true;
    AudioSys.init();
    Sfx.play('coin');
    if (resumed) {
      say('Welcome back. I kept your place.', 2.6);
      Game.talk.say(`${Game.tokens} tokens. Stage ${Game.stage}. Shall we?`, 3, false);
    } else {
      say('Good parts make great friends.', 2.4);
      Game.talk.say(`Here. ${Game.tokens} tokens. The first ones are always free.`, 3.2, false);
    }
    tokenPop = 1;
    Telemetry.log('open');
  }
  S.open = open;

  function goClaw() {
    if (zoom) return;
    zoom = { t: 0 };
    Sfx.play('transition');
  }

  S.update = function (dt) {
    t += dt;
    Game.talk.update(dt);
    fx.update(dt);
    tokenPop = Math.max(0, tokenPop - dt * 2);
    blinkT -= dt;
    if (blinkT < -0.14) blinkT = vrand(2, 5);
    catT += dt;
    catMood = Math.max(0, catMood - dt);
    lean = approach(lean, Game.talk.visible() ? 1 : 0, dt * 3);
    if (!opened) {
      titleT += dt;
      UI.set([]);
      return;
    }
    if (zoom) {
      zoom.t += dt;
      if (zoom.t > 0.5) { Engine.go('claw', {}, 'dither'); zoom = null; }
      UI.set([]);
      return;
    }
    if (Input.hit('b') && opened && !Engine.overlays.length) Overlays.pause();
    chatT -= dt;
    if (chatT < 0 && !Game.talk.visible()) { chatT = vrand(14, 22); say(idleLine(), 3.2); }
    const h = hint();
    const signs = [
