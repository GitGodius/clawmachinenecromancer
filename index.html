  return S;
})();

// ==== 32_creature.js ====
// ---------------------------------------------------------------------------
// CREATURES — stats from parts, a name, and a paper-doll rig renderer used on
// the slab (2x), in battle and in portraits. Any combination of parts is legal:
// no legs = it crawls, no arms = it bites, no torso = it's mostly stitches.
// ---------------------------------------------------------------------------
SPR.def('p_lump', { // stand-in torso when none is stitched on
  rows: [
    '...kkkkkk...',
    '.kkFFFFFgkk.',
    'kfFFhFhFFFgk',
    'kFFFFhFFFFgk',
    'kFgFFFFFhFgk',
    'kFFhFFFFFhgk',
    'kgFFFFFhFFgk',
    '.kggFhFFFgk.',
    '..kkggggkk..',
    '....kkkk....',
  ],
  anchor: [6, 5],
  points: { neck: [6, 1], shL: [1, 3], shR: [10, 3], hipL: [3, 8], hipR: [8, 8], heart: [6, 4], back: [6, 4] },
});

const GHOST_SPRITE = { head: 'p_skull', torso: 'p_ribcage', armL: 'p_bonearm', armR: 'p_bonearm', legL: 'p_boneleg', legR: 'p_boneleg', heart: 'p_heart', back: 'p_wings' };

const CREATURE_NAMES = ['Gerald', 'Mortimer', 'Bonnie', 'Doug', 'Patches', 'Nibbles', 'Frank', 'Helga', 'Moss', 'Pip', 'Barnaby', 'Igor Jr.',
  'Clive', 'Mabel', 'Ruth', 'Lefty', 'Grub', 'Old Tom', 'Bartholomew', 'Ribsy', 'Wendell', 'Gus', 'Agatha', 'Norbert', 'Ingrid', 'Chad',
  'Beatrix', 'Humphrey', 'Dot', 'Sir Limbsworth', 'Lady Gristle', 'Kevin', 'Tibia', 'Femurella', 'Stanley', 'Marrow', 'Deborah', 'Knuckles'];
const TITLE_FALLBACK = ['the Stitched', 'the Unlikely', 'the Earnest', 'the Lumpy', 'the Brave', 'the Damp', 'the Adequate', 'the Probably Fine', 'the Reassembled', 'the Second-Hand'];

let _creatureId = 1;
class Creature {
  constructor(slots) {
    this.id = _creatureId++;
    this.slots = Object.assign({ head: null, torso: null, armL: null, armR: null, legL: null, legR: null, heart: null, back: null }, slots);
    this.compute();
    this.hp = this.maxHp;
    this.name = Creature.makeName(this.slots);
    this.born = 0;
    this.kills = 0;
  }
  parts() { return Object.values(this.slots).filter(Boolean); }
  has(trait) { return this.traits.includes(trait); }
  compute() {
    const S = this.slots, D = (t) => (t ? PART_DEFS[t] : null);
    const all = this.parts().map(D);
    const arms = [S.armL, S.armR].filter(Boolean).map(D);
    const legs = [S.legL, S.legR].filter(Boolean).map(D);
    const head = D(S.head);
    let hp = 8 + all.reduce((a, d) => a + (d.hp || 0), 0);
    let atk = arms.reduce((a, d) => a + (d.atk || 0), 0);
    if (head) atk += arms.length ? (head.atk || 0) * 0.4 : head.atk || 0; // no arms? it bites
    if (S.back && D(S.back).atk) atk += D(S.back).atk;
    if (atk <= 0) atk = 1; // it flops at them, aggressively
    const spd = legs.reduce((a, d) => a + (d.spd || 0), 0);
    this.traits = [...new Set(all.map((d) => d.trait).filter(Boolean))];
    this.maxHp = Math.round(hp);
    this.atk = Math.round(atk * 10) / 10;
    this.def = all.reduce((a, d) => a + (d.def || 0), 0);
    this.spd = spd;
    this.moveSpeed = (legs.length ? 12 + spd * 4 : 7) + (this.traits.includes('flutter') ? 10 : 0);
    this.atkTime = 1.25 + (arms.some((d) => d.trait === 'smash') ? 0.45 : 0) - Math.min(0.35, spd * 0.03);
    this.range = 26 + (this.traits.includes('reach') ? 22 : 0);
    const goats = legs.filter((d) => d.trait === 'nimble').length;
    this.dodge = Math.min(0.5, goats * 0.15 + (this.traits.includes('flutter') ? 0.25 : 0));
    this.crit = this.traits.includes('keen') ? 0.3 : 0.05;
    this.power = Math.round(this.maxHp * 0.5 + this.atk * 6 / this.atkTime + this.spd * 2);
  }
  static makeName(S) {
    const t = Object.values(S).filter(Boolean);
    const count = (pred) => t.filter((x) => pred(PART_DEFS[x], x)).length;
    let title = null;
    if (S.head === 'crownskull') title = 'the Magnificent';
    else if (S.heart === 'goldheart') title = 'Heart of Gold';
    else if (count((d, k) => k.startsWith('ogre')) >= 2) title = 'the Enormous';
    else if (t.includes('tentacle')) title = 'the Tentacular';
    else if (S.head === 'wolfskull') title = 'the Hungry';
    else if (S.head === 'eyeball') title = 'the Watcher';
    else if (S.head === 'demonskull') title = 'the Damned';
    else if (S.back === 'wings') title = 'the Flappy';
    else if (!S.legL && !S.legR) title = 'No-Legs';
    else if (!S.head) title = 'the Headless';
    else if ((S.legL === 'pegleg') !== (S.legR === 'pegleg') && S.legL && S.legR) title = 'the Lopsided';
    else if (count((d) => d.mat === 'bone') >= 4) title = 'the Rattly';
    else if (!S.heart && t.length >= 5) title = 'the Heartless';
    return pick(CREATURE_NAMES) + ' ' + (title || pick(TITLE_FALLBACK));
  }
}

// ------------------------------------------------------------------- rig
// Returns joint positions relative to the feet (0,0), in art px.
function rigLayout(S) {
  const spr = (t) => (t ? SPR.get(PART_DEFS[t].sprite) : null);
  const torso = spr(S.torso) || SPR.get('p_lump');
  const P = torso.pts;
  const lL = spr(S.legL), lR = spr(S.legR);
  const lenL = lL ? lL.h - lL.ay : 0, lenR = lR ? lR.h - lR.ay : 0;
  const hipH = Math.max(lenL, lenR);
  const hipAvgY = (P.hipL[1] + P.hipR[1]) / 2;
  const tx = 0;
  const ty = hipH > 0 ? -hipH - (hipAvgY - torso.ay) : -(torso.h - torso.ay);
  const j = (pt) => [tx + pt[0] - torso.ax, ty + pt[1] - torso.ay];
  let tilt = 0;
  if (lL && lR && lenL !== lenR) tilt = Math.atan2(lenR - lenL, (P.hipR[0] - P.hipL[0]) * 3) * 0.9;
  return {
    torso, tx, ty, tilt,
    neck: j(P.neck), shL: j(P.shL), shR: j(P.shR), hipL: j(P.hipL), hipR: j(P.hipR), heart: j(P.heart), back: j(P.back),
    lenL, lenR, hipH,
    top: ty - torso.ay - (S.head ? SPR.get(PART_DEFS[S.head].sprite).h : 0),
  };
}

// Draw a creature with its feet at (x, y).
// o: { scale, t, anim:'idle'|'walk'|'attack'|'dead', animT (0..1), flip, flash, alpha, eyes (color), ghost (empty-slot silhouettes), dim }
function drawCreature(ctx, slots, x, y, o = {}) {
  const L = rigLayout(slots);
  const t = o.t || 0;
  const sc = o.scale || 1;
  const anim = o.anim || 'idle';
  let bob = 0, legA = 0, armA = 0, armB = 0, lunge = 0, headDX = 0, headDY = 0, lean = 0;
  if (anim === 'idle') {
    bob = Math.round(Math.sin(t * 2.6) * 0.8 + 0.3);
    armA = Math.sin(t * 2.6) * 0.07; armB = -armA;
  } else if (anim === 'walk') {
    const w = t * 9;
    legA = Math.sin(w) * 0.42;
    bob = Math.round(Math.abs(Math.cos(w)) * -1.4 + 0.7);
    armA = -Math.sin(w) * 0.35; armB = -armA;
    if (!slots.legL && !slots.legR) { legA = 0; bob = Math.round(Math.sin(w) * 1); lean = Math.sin(w * 0.5) * 0.1; }
  } else if (anim === 'attack') {
    const a = o.animT || 0;
    if (a < 0.4) { const k = easeOutCubic(a / 0.4); armA = 0.7 * k; lunge = -1 * k; lean = -0.08 * k; }
    else if (a < 0.6) { const k = easeOutCubic((a - 0.4) / 0.2); armA = lerp(0.7, -1.9, k); armB = lerp(0, -0.6, k); lunge = lerp(-1, 5, k); lean = lerp(-0.08, 0.14, k); }
    else { const k = easeInOutQuad((a - 0.6) / 0.4); armA = lerp(-1.9, 0, k); armB = lerp(-0.6, 0, k); lunge = lerp(5, 0, k); lean = lerp(0.14, 0, k); }
    if (!slots.armL && !slots.armR) { headDX = lunge * 1.2; headDY = lunge > 2 ? 1 : 0; }
  }
  const S = slots;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (o.flip) ctx.scale(-sc, sc); else ctx.scale(sc, sc);
  ctx.translate(Math.round(lunge), 0);
  const alpha = o.alpha == null ? 1 : o.alpha;
  ctx.globalAlpha = alpha;
  const flash = o.flash ? '#fff6e3' : null;
  const ghost = o.ghost;
  const part = (slot, spX, spY, rot, extra = {}) => {
    const type = S[slot];
    if (!type) {
      if (ghost) SPR.draw(ctx, GHOST_SPRITE[slot], spX, spY, { rot, solid: ghost, alpha: 0.9 * alpha, flip: extra.flip });
      return;
    }
    const d = PART_DEFS[type];
    SPR.draw(ctx, d.sprite, spX, spY, Object.assign({ rot: rot || 0.0001, solid: flash || o.solid || undefined }, extra));
  };
  const up = bob; // negative = up
  // upper body pivot (pelvis) for lean/tilt
  const pelvisY = L.hipH > 0 ? -L.hipH : 0;
  ctx.save();
  ctx.translate(0, pelvisY);
  ctx.rotate(L.tilt + lean);
  ctx.translate(0, -pelvisY + up);
  // back parts
  if (S.back === 'wings' || (!S.back && ghost)) {
    const flap = S.back ? Math.sin(t * (anim === 'walk' ? 14 : 4)) * 0.12 : 0;
    part('back', L.back[0], L.back[1] + 2, flap);
  } else if (S.back === 'tail') {
    const n = 5;
    for (let i = 0; i < n; i++) {
      const k = i / (n - 1);
      const px = L.back[0] - 3 - i * 4 + Math.sin(t * 3 + i * 0.8) * i * 0.6;
      const py = L.hipL[1] - 2 + i * 1.5 - Math.sin(k * 3) * 3;
      SPR.draw(ctx, i === n - 1 ? 'p_tailtip' : 'p_vert', px, py, { rot: 0.0001 + i * 0.25, solid: flash || undefined });
    }
  }
  ctx.restore();
  // legs (not tilted, they carry the body)
  const legSwing = (side) => (anim === 'walk' ? (side ? legA : -legA) : 0);
  part('legR', L.hipR[0] + 1, L.hipR[1] + 1 + Math.max(0, up), legSwing(0) + 0.0001);
  part('legL', L.hipL[0] - 1, L.hipL[1] + 1 + Math.max(0, up), legSwing(1) + 0.0001, { flip: false });
  ctx.save();
  ctx.translate(0, pelvisY);
  ctx.rotate(L.tilt + lean);
  ctx.translate(0, -pelvisY + up);
  // heart sits behind the torso (visible through ribs)
  if (S.heart) {
    const beat = Math.sin(t * 7) > 0.6 ? 1 : 0;
    part('heart', L.heart[0] - beat * 0, L.heart[1], 0.0001);
  } else if (ghost && S.torso === 'ribcage') part('heart', L.heart[0], L.heart[1], 0.0001);
  // torso
  if (S.torso) part('torso', 0, L.ty, 0.0001);
  else {
    if (ghost) SPR.draw(ctx, GHOST_SPRITE.torso, 0, L.ty - 4, { solid: ghost });
    if (!o.noLump) SPR.draw(ctx, 'p_lump', 0, L.ty, { solid: flash || undefined });
  }
  // arms: far arm (right side of the picture = leading arm when facing right)
  part('armR', L.shR[0] + 1, L.shR[1], armA + 0.0001);
  part('armL', L.shL[0] - 1, L.shL[1], armB + 0.0001);
  // head
  const hx = L.neck[0] + headDX, hy = L.neck[1] + 1 + headDY + (anim === 'idle' ? Math.round(Math.sin(t * 2.6 - 0.6) * 0.5) : 0);
  if (S.head) {
    part('head', hx, hy, 0.0001);
    if (o.eyes && !flash) {
      const hs = SPR.get(PART_DEFS[S.head].sprite);
      const E = hs.pts;
      if (S.head === 'eyeball') drawIris(ctx, hx - hs.ax + E.iris[0], hy - hs.ay + E.iris[1], o.lookX || 1, 0, o.eyes);
      else if (E.eyeL) {
        ctx.fillStyle = o.eyes;
        const blink = Math.sin(t * 1.3 + x) > 0.985;
        if (!blink) {
          ctx.fillRect(Math.round(hx - hs.ax + E.eyeL[0]), Math.round(hy - hs.ay + E.eyeL[1]), 2, 1);
          ctx.fillRect(Math.round(hx - hs.ax + E.eyeR[0]), Math.round(hy - hs.ay + E.eyeR[1]), 2, 1);
        }
      }
    }
  } else if (ghost) part('head', hx, hy, 0);
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha = 1;
  return L;
}

// Eyeball iris (the eyeball part has no baked iris so it can look around)
function drawIris(ctx, cx, cy, dx, dy, tint) {
  const L = Math.hypot(dx, dy) || 1;
  const ox = Math.round((dx / L) * 1.6), oy = Math.round((dy / L) * 1.6);
  const x = Math.round(cx + ox), y = Math.round(cy + oy);
  ctx.fillStyle = tint && tint !== true ? tint : PAL.v;
  ctx.fillRect(x - 2, y - 1, 4, 2); ctx.fillRect(x - 1, y - 2, 2, 4);
  ctx.fillStyle = PAL.C; ctx.fillRect(x - 2, y - 1, 1, 1);
  ctx.fillStyle = PAL.k; ctx.fillRect(x - 1, y - 1, 2, 2);
  ctx.fillStyle = PAL.j; ctx.fillRect(x - 1, y - 1, 1, 1);
}

// Pixel-perfect icon of a part scaled to fit a box (used for inventory cells).
function drawPartIcon(ctx, type, cx, cy, maxSize = 22, opts = {}) {
  const d = PART_DEFS[type];
  const s = SPR.get(d.sprite);
  if (d.chain) { // bone tail: little curl of vertebrae
    for (let i = 0; i < 4; i++) SPR.draw(ctx, i === 3 ? 'p_tailtip' : 'p_vert', cx - 6 + i * 4, cy + Math.round(Math.sin(i * 1.2) * 3), { rot: 0.0001 + i * 0.3, alpha: opts.alpha });
    return;
  }
  const big = Math.max(s.w, s.h) > maxSize;
  const rot = big ? -Math.PI / 4 : 0.0001;
  const o = { rot, alpha: opts.alpha, solid: opts.solid };
  if (opts.outline) {
    const ol = SPR.outline(d.sprite, opts.outline);
    ctx.save(); ctx.translate(Math.round(cx), Math.round(cy)); ctx.rotate(rot); ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
    ctx.drawImage(ol, -s.w / 2 - 1, -s.h / 2 - 1); ctx.restore(); ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(rot);
  ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
  ctx.drawImage(o.solid ? SPR.solid(d.sprite, o.solid) : s.c, -Math.round(s.w / 2), -Math.round(s.h / 2));
  ctx.restore();
  ctx.globalAlpha = 1;
  if (type === 'eyeball') drawIris(ctx, cx, cy, 1, 0.3);
}

// ==== 33_scene_slab.js ====
// ---------------------------------------------------------------------------
// SLAB SCENE — stitch parts into a creature, then BRING TO LIFE.
// Click a part in the inventory to stitch it on; click a slot to take it off.
// ---------------------------------------------------------------------------
Scenes.slab = (() => {
  const S = {};
  const fx = new Particles();
  let t = 0, page = 0, jolt = 0, selected = null, life = null, lastStitch = null;
  let build = null; // { head: item|null, ... }
  const CELL_W = 34, CELL_H = 30, COLS = 3, ROWS = 5, PER = COLS * ROWS;
  const FEET_X = 240, FEET_Y = 208;
  const say = (x, h) => Game.talk.say(x, h);
  const emptyBuild = () => ({ head: null, torso: null, armL: null, armR: null, legL: null, legR: null, heart: null, back: null });
  const types = () => { const o = {}; for (const k in build) o[k] = build[k] ? build[k].type : null; return o; };
  const count = () => Object.values(build).filter(Boolean).length;

  S.enter = function () {
    if (!build) build = emptyBuild();
    Music.play('slab');
    life = null;
    selected = null;
    if (!Game.seen.slab) {
      Game.seen.slab = true;
      say(Game.inventory.length ? 'The slab. Click a part to stitch it on. Any combination works. Some work better.' : 'Nothing to stitch. The machine is that way.', 4);
    } else if (!Game.inventory.length && !count()) say('Empty-handed? The claw awaits.', 2.5);
  };
  S.exit = function () {};

  function stitch(item) {
    const d = PART_DEFS[item.type];
    let slot = d.slot;
    if (slot === 'arm') slot = !build.armR ? 'armR' : !build.armL ? 'armL' : 'armR';
    if (slot === 'leg') slot = !build.legR ? 'legR' : !build.legL ? 'legL' : 'legR';
    Game.takeItem(item.uid);
    if (build[slot]) Game.inventory.push(build[slot]);
    build[slot] = item;
    lastStitch = { slot, t: 0 };
    jolt = 0.25;
    Sfx.play('stitch');
    const L = rigLayout(types());
    const pt = { head: L.neck, torso: [0, L.ty], armL: L.shL, armR: L.shR, legL: L.hipL, legR: L.hipR, heart: L.heart, back: L.back }[slot] || [0, -30];
    fx.burst(FEET_X + pt[0] * 2, FEET_Y + pt[1] * 2, 10, { speed: 50, life: 0.45, ay: 60, color: ['#9be38f', '#fff6e3', '#4fae6c'] });
    Telemetry.log('stitch', { part: item.type, slot });
    if (chance(0.3)) say(pick(['Snug.', 'It fits. Mostly.', 'Needle, thread, hope.', 'Ooh, that suits them.', 'Stitch, stitch, stitch.', 'Lovely. Horrible. Lovely.']), 1.6);
    if (item.type === 'pegleg' && chance(0.6)) say('A peg leg. Classic look. Terrible posture.', 2.2);
  }
  function unstitchSlot(slot) {
    if (!build[slot]) return;
    Game.inventory.push(build[slot]);
    build[slot] = null;
    Sfx.play('unstitch');
    jolt = 0.15;
  }
  function canBring() { return count() > 0 && Game.party.length < 3 && !life; }

  function bringToLife() {
    if (!canBring()) return;
    const c = new Creature(types());
    life = { t: 0, c, bolts: [], stage: 0 };
    Music.duck(0.7, 3);
    Sfx.play('zap');
    Telemetry.c.creatures++;
    Telemetry.log('create', { name: c.name, parts: c.parts().join(',') });
  }

  function finishLife() {
    const c = life.c;
    c.born = Engine.t;
    Game.party.push(c);
    build = emptyBuild();
    life = null;
    say(pick(['Not pretty. But it\'ll fight.', 'Look at them go. Well. Look at them.', 'It\'s alive! Ish.', 'A face only a necromancer could love.']), 3);
    Game.talk.say(`Meet ${c.name}. Take them to the graveyard.`, 3.2, false);
  }

  function items() { return Game.inventory.slice().sort((a, b) => RARITY[PART_DEFS[b.type].rarity].order - RARITY[PART_DEFS[a.type].rarity].order || a.type.localeCompare(b.type)); }

  function partTip(type, extra) {
    const d = PART_DEFS[type], r = RARITY[d.rarity];
    const lines = [{ t: d.name, c: r.color }, { t: `${r.name} ${SLOT_NAMES[d.slot]}`, c: '#7a6a9a' }];
    const st = [];
    if (d.hp) st.push('HP +' + d.hp);
    if (d.atk) st.push('ATK +' + d.atk);
    if (d.spd) st.push('SPD +' + d.spd);
    if (d.def) st.push('DEF +' + d.def);
    if (st.length) lines.push({ t: st.join('  '), c: '#ecdcbc' });
    if (d.trait) lines.push({ t: TRAITS[d.trait].name + ': ' + TRAITS[d.trait].desc, c: '#9be38f' });
    if (extra) lines.push({ t: extra, c: '#a08962' });
    return lines;
  }

  S.update = function (dt) {
    t += dt;
    jolt = Math.max(0, jolt - dt);
    fx.update(dt);
    Game.talk.update(dt);
    if (lastStitch) lastStitch.t += dt;
    if (life) {
      life.t += dt;
      const lt = life.t;
      if (life.stage === 0 && lt > 0.45) {
        life.stage = 1;
        Sfx.play('thunder');
        Engine.flash('#e7f7ff', 0.25);
        Engine.shake(5, 0.5);
        Engine.hitPause(0.08);
        for (let i = 0; i < 3; i++) life.bolts.push({ x0: FEET_X + rand(-60, 60), seed: randInt(1, 999), t: 0 });
      }
      if (life.stage >= 1 && lt < 1.3 && chance(dt * 30)) {
        fx.burst(FEET_X + rand(-30, 30), FEET_Y - rand(10, 120), 3, { speed: 70, life: 0.25, color: ['#c2f5ff', '#fff', '#9be38f'] });
        if (chance(dt * 8)) Sfx.play('zap', { intensity: 0.4 });
      }
      if (life.stage === 1 && lt > 1.35) { life.stage = 2; Sfx.play('alive'); fx.burst(FEET_X, FEET_Y - 60, 30, { speed: 90, life: 0.8, ay: 40, color: ['#9be38f', '#fff6e3', '#4fae6c'] }); }
      if (life.stage === 2 && lt > 3.2) finishLife();
    }
    if (Input.hit('b') && !life) Engine.go('shop');
    if (Input.hit('a') && !life && canBring()) bringToLife();
    buildButtons();
  };

  function buildButtons() {
    const bs = [];
    const list = items();
    const pages = Math.max(1, Math.ceil(list.length / PER));
    page = clamp(page, 0, pages - 1);
    list.slice(page * PER, page * PER + PER).forEach((it, i) => {
      const x = 9 + (i % COLS) * (CELL_W + 2), y = 21 + Math.floor(i / COLS) * (CELL_H + 2);
      bs.push({ id: 'inv' + it.uid, x, y, w: CELL_W, h: CELL_H, label: '', item: it, kind: 'cell', silent: true, disabled: !!life,
        tip: partTip(it.type, 'click to stitch on'), onClick: () => stitch(it) });
    });
    if (pages > 1) {
      bs.push({ id: 'pgL', x: 9, y: 182, w: 18, h: 12, label: '◀', onClick: () => { page--; Sfx.play('page'); } });
      bs.push({ id: 'pgR', x: 97, y: 182, w: 18, h: 12, label: '▶', onClick: () => { page++; Sfx.play('page'); } });
    }
    RIG_SLOTS.forEach(([slot], i) => {
      const it = build[slot];
      bs.push({ id: 'slot' + slot, x: 366, y: 20 + i * 17, w: 106, h: 16, label: '', kind: 'slot', slot, silent: true, disabled: !it || !!life,
        tip: it ? partTip(it.type, 'click to unstitch') : null, onClick: () => unstitchSlot(slot) });
    });
    bs.push({ id: 'life', x: 364, y: 200, w: 110, h: 22, label: 'BRING TO LIFE', style: 'green', disabled: !canBring(), kind: 'big', sound: 'ui_click',
      tip: Game.party.length >= 3 ? 'Party is full (3). Unstitch someone first.' : count() ? null : 'Stitch at least one part on.', onClick: bringToLife });
    Game.party.forEach((c, i) => {
      bs.push({ id: 'pty' + c.id, x: 9 + i * 36, y: 214, w: 34, h: 40, label: '', kind: 'party', c, silent: true, disabled: !!life,
        tip: [{ t: c.name, c: '#9be38f' }, { t: `HP ${Math.ceil(c.hp)}/${c.maxHp}  ATK ${c.atk}  SPD ${c.spd}`, c: '#ecdcbc' }, ...c.traits.map((x) => ({ t: TRAITS[x].name, c: '#7a6a9a' })), { t: selected === c ? 'click again to UNSTITCH' : 'click to select', c: '#a08962' }],
        onClick: () => {
          if (selected === c) {
            Game.party = Game.party.filter((x) => x !== c);
            for (const tp of c.parts()) Game.inventory.push(makePartItem(tp));
            selected = null;
            Sfx.play('unstitch');
            Telemetry.c.unstitched++;
            say(pick([`${c.name.split(' ')[0]} is parts again. Circle of life.`, 'Back to bits. No hard feelings.']), 2.4);
          } else { selected = c; Sfx.play('ui_click'); }
        } });
    });
    bs.push({ id: 'back', x: 124, y: 4, w: 50, h: 14, label: '◀ SHOP', onClick: () => Engine.go('shop') });
    bs.push({ id: 'fight', x: 306, y: 4, w: 50, h: 14, label: 'FIGHT ▶', disabled: !Game.canFight() || !!life, style: 'red',
      tip: Game.canFight() ? null : 'Bring someone to life first.', onClick: () => Engine.go('battle') });
    S.buttons = bs;
    UI.set(bs);
  }

  S.draw = function (ctx) {
    BG.lab(ctx, t, { surge: life ? clamp(life.stage === 1 ? 1 - (life.t - 0.45) : life.stage === 2 ? 0.3 : life.t, 0, 1) : 0 });
    // creature on the slab
    const ty = types();
    const shakeX = life && life.stage === 1 ? rand(-2, 2) : jolt > 0 ? Math.round(Math.sin(jolt * 60) * 1) : 0;
    const shakeY = life && life.stage === 1 ? rand(-2, 2) : 0;
    if (life && life.stage >= 1 && life.t < 1.2) {
      ctx.fillStyle = 'rgba(14,11,22,0.55)'; ctx.fillRect(0, 0, W, H);
    }
    drawCreature(ctx, ty, FEET_X + shakeX, FEET_Y + shakeY, {
      scale: 2, t, anim: 'idle', ghost: life ? null : 'rgba(155,227,143,0.16)', noLump: !count(),
      eyes: life && life.stage >= 2 ? '#9be38f' : null,
      flash: life && life.stage === 1 && Math.sin(life.t * 50) > 0,
    });
    if (life && life.stage >= 1 && life.t < 1.3) {
      for (const b of life.bolts) {
        if (Math.sin(life.t * 40 + b.seed) > -0.3) {
          Draw.bolt(ctx, b.x0, 0, FEET_X + rand(-20, 20), FEET_Y - rand(40, 110), '#e7f7ff', 10, b.seed + Math.floor(life.t * 20));
          Draw.glow(ctx, FEET_X, FEET_Y - 70, 90, '#6fd3ff', 0.25);
        }
      }
    }
    fx.draw(ctx);
    if (life && life.stage >= 2) {
      const k = clamp((life.t - 1.35) / 0.3, 0, 1);
      const y = 40 - Math.round((1 - easeOutBack(k)) * 20);
      Font.draw(ctx, 'IT\'S ALIVE!', 240, y, { scale: 3, color: '#9be38f', outline: PAL.k, shadow: '#274536', align: 'center', alpha: k });
      Font.draw(ctx, life.c.name, 240, y + 28, { color: '#fff6e3', outline: PAL.k, align: 'center', alpha: k });
    }

    // inventory panel
    Draw.panel(ctx, 4, 4, 114, 196, 'slate');
    Font.draw(ctx, 'INVENTORY', 10, 9, { color: '#ecdcbc', shadow: PAL.k });
    Font.draw(ctx, String(Game.inventory.length), 112, 10, { font: 'small', color: '#7a6a9a', align: 'right' });
    const bs = S.buttons || [];
    const shownCells = bs.filter((b) => b.kind === 'cell').length;
    for (let i = 0; i < PER; i++) {
      const x = 9 + (i % COLS) * (CELL_W + 2), y = 21 + Math.floor(i / COLS) * (CELL_H + 2);
      if (i >= shownCells) { Draw.panel(ctx, x, y, CELL_W, CELL_H, 'dark'); }
    }
    for (const b of bs) {
      if (b.kind === 'cell') {
        const d = PART_DEFS[b.item.type], r = RARITY[d.rarity];
        Draw.panel(ctx, b.x, b.y, b.w, b.h, 'dark');
        if (r.glow) Draw.frame(ctx, b.x + 1, b.y + 1, b.w - 2, b.h - 2, r.glow);
        if (b.hover) Draw.frame(ctx, b.x - 1, b.y - 1, b.w + 2, b.h + 2, '#fff6e3');
        drawPartIcon(ctx, b.item.type, b.x + b.w / 2, b.y + b.h / 2 + (b.hover ? -1 : 0), 24);
      }
    }
    if (!Game.inventory.length) Font.drawWrapped(ctx, 'Empty. Win parts from the claw machine.', 12, 86, 100, { color: '#7a6a9a' });

    // parts list
    Draw.panel(ctx, 362, 4, 114, 192, 'slate');
    Font.draw(ctx, 'PARTS', 368, 9, { color: '#ecdcbc', shadow: PAL.k });
    for (const b of bs) {
      if (b.kind !== 'slot') continue;
      const it = build[b.slot];
      if (b.hover) Draw.rect(ctx, b.x, b.y, b.w, b.h, '#2d3344');
      Draw.frame(ctx, b.x + 1, b.y + 1, 14, 14, '#3b3654');
      if (it) {
        const d = PART_DEFS[it.type], r = RARITY[d.rarity];
        ctx.save(); ctx.beginPath(); ctx.rect(b.x + 2, b.y + 2, 12, 12); ctx.clip();
        drawPartIcon(ctx, it.type, b.x + 8, b.y + 8, 12);
        ctx.restore();
        Font.draw(ctx, d.name, b.x + 18, b.y + 1, { color: '#ecdcbc' });
        Font.draw(ctx, r.name, b.x + 18, b.y + 10, { font: 'small', color: r.color });
      } else {
        Font.draw(ctx, RIG_SLOT_LABEL[b.slot], b.x + 18, b.y + 4, { color: '#4b4466' });
      }
      if (lastStitch && lastStitch.slot === b.slot && lastStitch.t < 0.4) Draw.frame(ctx, b.x, b.y, b.w, b.h, '#9be38f');
    }
    // stats preview
    if (count()) {
      const c = new Creature(ty);
      const y0 = 158;
      const stat = (ico, label, v, x) => { if (SPR.has(ico)) SPR.draw(ctx, ico, x + 3, y0 + 4); Font.draw(ctx, label + ' ' + v, x + 9, y0, { color: '#ecdcbc' }); };
      stat('ico_heart', 'HP', c.maxHp, 366); stat('ico_sword', 'ATK', c.atk, 404); stat('ico_boot', 'SPD', c.spd, 444);
      const tr = c.traits.length ? c.traits.map((x) => TRAITS[x].name).join(' · ') : 'no special traits';
      Font.drawWrapped(ctx, tr, 369, y0 + 12, 104, { font: 'small', color: c.traits.length ? '#9be38f' : '#4b4466' });
      const pw = clamp(c.power / 80, 0, 1);
      Draw.rect(ctx, 400, y0 + 27, 72, 4, PAL.k);
      Draw.rect(ctx, 401, y0 + 28, Math.round(70 * pw), 2, pw > 0.66 ? PAL.L : pw > 0.33 ? PAL.d : PAL.B);
      Font.draw(ctx, 'POWER', 368, y0 + 26, { font: 'small', color: '#7a6a9a' });
    }

    // party roster
    Draw.panel(ctx, 4, 204, 114, 62, 'slate');
    Font.draw(ctx, 'PARTY ' + Game.party.length + '/3', 10, 207, { font: 'small', color: '#a6aec2' });
    for (let i = 0; i < 3; i++) {
      const x = 9 + i * 36, y = 214;
      const b = bs.find((q) => q.kind === 'party' && q.c === Game.party[i]);
      Draw.panel(ctx, x, y, 34, 40, b && (b.hover || selected === b.c) ? 'green' : 'dark');
      const c = Game.party[i];
      if (c) {
        ctx.save(); ctx.beginPath(); ctx.rect(x + 1, y + 1, 32, 38); ctx.clip();
        const L = rigLayout(c.slots);
        drawCreature(ctx, c.slots, x + 17, y + 5 - L.top, { t: t + i, anim: 'idle', eyes: '#9be38f' });
        ctx.restore();
        const k = c.hp / c.maxHp;
        Draw.rect(ctx, x + 3, y + 35, 28, 3, PAL.k);
        Draw.rect(ctx, x + 4, y + 36, Math.round(26 * k), 1, k > 0.5 ? PAL.d : k > 0.25 ? PAL.L : PAL.R);
        if (selected === c) Font.draw(ctx, 'UNSTITCH?', x + 17, y + 42, { font: 'small', color: PAL.R, align: 'center' });
      }
    }

    // buttons (life, nav, paging)
    for (const b of bs) if (!b.kind || b.kind === 'big') UI.drawButton(ctx, b);

    // dialogue box
    if (Game.talk.visible()) {
      Draw.panel(ctx, 124, 236, 232, 30, 'dark');
      if (SPR.has('reaper_face')) SPR.draw(ctx, Game.talk.talking() && Math.sin(t * 22) > 0 && SPR.has('reaper_face_talk') ? 'reaper_face_talk' : 'reaper_face', 138, 251);
      Font.drawWrapped(ctx, Game.talk.text, 152, 241, 198, { color: '#ecdcbc', maxChars: Math.floor(Game.talk.shown) });
    }
  };

  return S;
})();

// ==== 34_scene_battle.js ====
// ---------------------------------------------------------------------------
// BATTLE SCENE — "Graveyard of Second Chances". Your creations auto-fight the
// shades; you get one lever (ZAP: heal + haste) and the choice to retreat.
// Winning pays tokens and restocks the machine; the dead go back in the pile.
// ---------------------------------------------------------------------------
const ENEMY_KINDS = {
  wisp:   { name: 'Wisp',   hp: 10, atk: 2, atkTime: 1.1, speed: 34, range: 24, dodge: 0.1, spr: 'wisp', hover: 10, w: 14 },
  shade:  { name: 'Shade',  hp: 24, atk: 4, atkTime: 1.25, speed: 22, range: 28, dodge: 0.05, spr: 'shade', hover: 3, w: 22 },
  wraith: { name: 'Wraith', hp: 90, atk: 8, atkTime: 1.6, speed: 15, range: 38, dodge: 0, spr: 'wraith', hover: 4, w: 36, boss: true },
};
function stageEnemies(n) {
  const fixed = { 1: ['wisp', 'wisp'], 2: ['wisp', 'shade'], 3: ['shade', 'shade'], 4: ['shade', 'wisp', 'shade'], 5: ['wraith'] };
  if (fixed[n]) return fixed[n];
  if (n % 5 === 0) return ['wisp', 'wraith', 'wisp'];
  const list = [];
  let budget = 2 + n * 1.1;
  while (budget > 0.9 && list.length < 5) {
    const k = budget >= 2.2 && chance(0.6) ? 'shade' : 'wisp';
    list.push(k);
    budget -= k === 'shade' ? 2.2 : 1;
  }
  return list;
}
const STAGE_NAMES = ['Graveyard of Second Chances', 'The Leaning Crypts', 'Moonlit Ossuary', 'Hollow Hill', 'The Landlord\'s Plot'];

Scenes.battle = (() => {
  const S = {};
  const GROUND = 214;
  const fx = new Particles();
  const debris = new Particles();
  let t = 0, units = [], phase = 'ready', result = null, zapCd = 0, menuSel = 0, logLines = [], resultT = 0;
  let coinsShown = 0, reward = 0, restocked = [], bolts = [], fightStage = 1;
  const say = (x, h) => Game.talk.say(x, h);
  const allies = () => units.filter((u) => u.team === 'ally');
  const enemies = () => units.filter((u) => u.team === 'enemy');
  const alive = (arr) => arr.filter((u) => !u.dead);
  const log = (s) => { logLines.push(s); if (logLines.length > 2) logLines.shift(); };

  function makeAlly(c, i) {
    return {
      team: 'ally', c, name: c.name.split(' ')[0], x: 120 - i * 38, y: GROUND + [0, 11, -11][i],
      hp: c.hp, maxHp: c.maxHp, atk: c.atk, def: c.def, atkTime: c.atkTime, speed: c.moveSpeed, range: c.range,
      dodge: c.dodge, crit: c.crit, traits: c.traits, cd: rand(0.1, 0.5), state: 'idle', animT: 0, flashT: 0, kx: 0,
      stunT: 0, bleedT: 0, burnT: 0, hasteT: 0, hits: 0, revived: false, dead: false, bob: rand(0, 6),
    };
  }
  function makeEnemy(kind, i, n) {
    const K = ENEMY_KINDS[kind];
    const m = 1 + 0.2 * (Game.stage - 1);
    const hp = Math.round(K.hp * m * CONFIG.enemyHp);
    return {
      team: 'enemy', kind, K, name: K.name, x: 350 + i * 36 + (K.boss ? 20 : 0), y: GROUND + [0, 11, -11, 5, -5][i % 5],
      hp, maxHp: hp, atk: K.atk * m * CONFIG.enemyAtk, def: 0, atkTime: K.atkTime, speed: K.speed, range: K.range,
      dodge: K.dodge, crit: 0.05, traits: [], cd: rand(0.3, 0.9), state: 'idle', animT: 0, flashT: 0, kx: 0,
      stunT: 0, bleedT: 0, burnT: 0, hasteT: 0, hits: 0, dead: false, bob: rand(0, 6),
    };
  }

  S.enter = function () {
    t = 0; phase = 'ready'; result = null; zapCd = 0; menuSel = 0; logLines = []; resultT = 0; bolts = []; fightStage = Game.stage;
    fx.list = []; debris.list = [];
    units = [];
    Game.party.filter((c) => c.hp > 0).slice(0, 3).forEach((c, i) => units.push(makeAlly(c, i)));
    const kinds = stageEnemies(Game.stage);
    kinds.forEach((k, i) => units.push(makeEnemy(k, i, kinds.length)));
    Music.play('battle');
    const boss = kinds.includes('wraith');
    say(Game.stage === 1 ? 'Your creations fight for you. Give them better parts.' :
      boss ? 'That\'s a Wraith. It owes me money. Bring friends. Three of them, ideally.' :
      pick(['Stage ' + Game.stage + '. The shades are getting braver.', 'Back again? The graveyard remembers you.', 'Chin up, bones out.']), 3.8);
    Telemetry.c.battles++;
    Telemetry.log('battle', { stage: Game.stage, party: units.filter((u) => u.team === 'ally').length, enemies: kinds.join(',') });
  };
  S.exit = function () {};

  function start() {
    if (phase !== 'ready') return;
    phase = 'fight';
    Sfx.play('swing');
    Engine.shake(2, 0.2);
    log('The shades drift closer...');
  }

  function zap() {
    if (phase !== 'fight' || zapCd > 0) return Sfx.play('ui_deny');
    zapCd = CONFIG.zapCooldown;
    Telemetry.c.zaps++;
    Sfx.play('thunder');
    Engine.flash('#c2f5ff', 0.2);
    Engine.shake(3, 0.3);
    bolts = alive(allies()).map((u) => ({ x: u.x, y: u.y, t: 0, seed: randInt(1, 999) }));
    for (const u of alive(allies())) {
      const heal = Math.round(u.maxHp * 0.3);
      u.hp = Math.min(u.maxHp, u.hp + heal);
      u.hasteT = 4;
      fx.text(u.x, u.y - 60, '+' + heal, '#9be38f', { font: 'main' });
      fx.burst(u.x, u.y - 30, 14, { speed: 60, life: 0.5, color: ['#c2f5ff', '#9be38f', '#fff'] });
    }
    log('ZAP! Your creations surge with borrowed life.');
  }

  function retreat() {
    if (phase !== 'fight' && phase !== 'ready') return;
    Telemetry.c.retreats++;
    finish('retreat');
  }

  function nearestFoe(u) {
    let best = null, bd = 1e9;
    for (const o of units) {
      if (o.dead || o.team === u.team) continue;
      const d = Math.abs(o.x - u.x) + Math.abs(o.y - u.y) * 1.2; // prefer the foe in your own lane
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  }

  function royalBonus() { return alive(allies()).some((u) => u.traits.includes('royal')) ? 1.25 : 1; }

  function dealHit(att, def, opts = {}) {
    if (def.dead) return;
    const isAlly = att.team === 'ally';
    if (chance(def.dodge)) {
      fx.text(def.x, def.y - bodyH(def) - 6, 'MISS', '#a6aec2');
      Sfx.play('swing', { pitch: 1.3 });
      return;
    }
    let dmg = att.atk * rand(0.85, 1.15) * (opts.mult || 1);
    if (isAlly) dmg *= CONFIG.allyAtk * royalBonus();
    const crit = chance(att.crit);
    if (crit) dmg *= 2;
    dmg = Math.max(1, dmg - (def.def || 0));
    if (def.traits && def.traits.includes('hefty')) dmg *= 0.8;
    dmg = Math.round(dmg);
    def.hp -= dmg;
    def.flashT = 0.12;
    def.kx = (def.x > att.x ? 1 : -1) * (crit ? 120 : 60);
    const col = crit ? PAL.L : isAlly ? '#fff6e3' : PAL.r;
    fx.text(def.x + rand(-4, 4), def.y - bodyH(def) - 4, crit ? dmg + '!' : String(dmg), col, { font: crit ? 'main' : 'small', scale: crit ? 2 : 1 });
    if (def.team === 'enemy') fx.burst(def.x, def.y - bodyH(def) / 2, crit ? 12 : 6, { speed: 60, ay: -20, drag: 2, life: 0.5, color: ['#1b1526', '#33274a', '#5b4a78'], sizes: [1, 2] });
    else fx.burst(def.x, def.y - bodyH(def) / 2, crit ? 10 : 5, { speed: 70, ay: 200, life: 0.5, color: ['#fff6e3', '#cdb892', '#e8405a'], floor: def.y });
    Sfx.play(def.team === 'enemy' ? 'enemy_hit' : 'hit', { crit, intensity: crit ? 1 : 0.7 });
    if (crit) { Engine.hitPause(0.05); Engine.shake(2.5, 0.15); if (chance(0.5)) log(`${att.name} crits for ${dmg}!`); }
    // traits
    if (isAlly) {
      if (att.traits.includes('bite')) { const h = Math.round(dmg * 0.3); att.hp = Math.min(att.maxHp, att.hp + h); if (h) fx.text(att.x, att.y - bodyH(att) - 10, '+' + h, '#9be38f'); }
      if (att.traits.includes('rend')) def.bleedT = 3;
      if (att.traits.includes('smash') && chance(0.3)) { def.stunT = 1; fx.text(def.x, def.y - bodyH(def) - 16, 'STUN', PAL.L); Engine.shake(3, 0.2); }
      if (opts.fire) def.burnT = 3;
    }
    if (def.hp <= 0) kill(def, att);
  }

  function kill(u, by) {
    if (u.team === 'ally' && u.traits.includes('undying') && !u.revived) {
      u.revived = true;
      u.hp = Math.round(u.maxHp * 0.4);
      fx.text(u.x, u.y - 70, 'UNDYING!', '#b56bd6', { font: 'main', life: 1.4 });
      fx.burst(u.x, u.y - 30, 24, { speed: 80, life: 0.8, color: ['#b56bd6', '#e7a6f0', '#0e0b16'] });
      Sfx.play('alive');
      log(`${u.name} refuses to stay dead.`);
      return;
    }
    u.dead = true;
    u.hp = 0;
    if (u.team === 'enemy') {
      Sfx.play('enemy_die');
      Engine.shake(u.K.boss ? 6 : 2, 0.3);
      if (u.K.boss) { Engine.hitPause(0.15); Engine.flash('#ff4040', 0.2); }
      for (let i = 0; i < 24 + (u.K.boss ? 40 : 0); i++) fx.add({ x: u.x + rand(-10, 10), y: u.y - rand(0, bodyH(u)), vx: rand(-20, 20), vy: rand(-50, -10), drag: 1.5, life: rand(0.6, 1.3), color: pick(['#0e0b16', '#1b1526', '#33274a', '#ff4040']), size: pick([1, 2, 2, 3]) });
      if (by && by.traits.includes('golden')) { Game.tokens++; fx.text(u.x, u.y - 30, '+1 TOKEN', PAL.L, { font: 'main' }); }
      if (by) log(`${by.name} dispatched a ${u.name}.`);
      if (by && by.c) by.c.kills++;
    } else {
      Sfx.play('creature_die');
      Engine.shake(4, 0.35);
      Engine.hitPause(0.1);
      // dismember: every part flies off with a bit of physics
      const L = rigLayout(u.c.slots);
      const at = { head: L.neck, torso: [0, L.ty], armL: L.shL, armR: L.shR, legL: L.hipL, legR: L.hipR, heart: L.heart, back: L.back };
      for (const [slot, type] of Object.entries(u.c.slots)) {
        if (!type) continue;
        const d = PART_DEFS[type];
        const p = at[slot] || [0, -20];
        debris.add({ kind: 'spr', spr: d.chain ? 'p_vert' : d.sprite, x: u.x + p[0], y: u.y + p[1], vx: rand(-90, 90), vy: rand(-170, -80), ay: 520, vr: rand(-10, 10), life: 3.2, floor: u.y + rand(-2, 3), bounce: 0.4, fade: true });
      }
      fx.burst(u.x, u.y - 30, 16, { speed: 90, ay: 300, life: 0.8, color: ['#fff6e3', '#cdb892', '#e8405a'], floor: u.y });
      log(`${u.name} fell apart. Literally.`);
      say(pick(['I\'ll put those back in the machine.', 'Back to the pile with you.', 'Nothing\'s wasted here.']), 2.2);
    }
  }

  function bodyH(u) {
    if (u.team === 'ally') return -rigLayout(u.c.slots).top;
    return { wisp: 26, shade: 32, wraith: 48 }[u.kind];
  }

  function finish(kind) {
    if (result) return;
    phase = 'done';
    resultT = 0;
    const deadAllies = allies().filter((u) => u.dead);
    const survivors = allies().filter((u) => !u.dead);
    // write back to the party
    for (const u of allies()) u.c.hp = u.dead ? 0 : Math.max(1, Math.ceil(u.hp));
    const deadParts = deadAllies.flatMap((u) => u.c.parts());
    Game.party = Game.party.filter((c) => c.hp > 0);
    reward = 0;
    restocked = [];
    let luck = 0; // Luck banked from the result (the Rig)
    if (kind === 'win') {
      reward = CONFIG.winTokens + Game.stage;
      if (survivors.some((u) => u.traits.includes('golden'))) reward += 1;
      const boost = 1 + Game.stage * 0.2;
      for (let i = 0; i < CONFIG.restockParts; i++) restocked.push(randomPartType({ boost }));
      for (const c of Game.party) c.hp = c.maxHp; // the Reaper patches them up
      Telemetry.c.victories++;
      Telemetry.c.bestStage = Math.max(Telemetry.c.bestStage, Game.stage);
      Game.bestStage = Math.max(Game.bestStage, Game.stage);
      Game.stage++;
      luck = Rig.gain(CONFIG.luckBattle, 'battle');
      Sfx.play('victory');
      Music.duck(0.8, 2.5);
      say(pick(['The graveyard provides.', 'Look at them. My little war crimes.', 'Victory! Mostly intact, even.']), 3);
    } else if (kind === 'lose') {
      reward = 1;
      luck = Rig.gain(CONFIG.luckDefeat, 'defeat');
      Telemetry.c.defeats++;
      Sfx.play('defeat');
      say('Back to the pile they go. Nothing\'s wasted here. Give them better parts.', 4);
    } else {
      for (const c of Game.party) c.hp = Math.max(1, c.hp);
      say('Retreat! Live to rot another day.', 2.5);
    }
    Game.tokens += reward;
    coinsShown = 0;
    Game.restock([...restocked, ...deadParts]);
    result = { kind, reward, restocked, deadParts, lost: deadAllies.map((u) => u.name), luck };
    Telemetry.log('battleEnd', { kind, stage: Game.stage, reward, lost: deadAllies.length });
  }

  S.cheatWin = function () { for (const e of alive(enemies())) kill(e, null); };

  S.update = function (dt, realDt) {
    t += dt;
    Game.talk.update(dt);
    fx.update(dt); debris.update(dt);
    for (const b of bolts) b.t += dt;
    bolts = bolts.filter((b) => b.t < 0.35);
    const bdt = dt * CONFIG.battleSpeed;
    if (phase === 'fight') {
      zapCd = Math.max(0, zapCd - bdt);
      for (const u of units) {
        if (u.dead) continue;
        u.flashT = Math.max(0, u.flashT - dt);
        u.x += u.kx * bdt; u.kx *= Math.exp(-10 * bdt);
        u.x = clamp(u.x, 20, 460);
        // status effects
        if (u.bleedT > 0) { u.bleedT -= bdt; u.hp -= 2 * bdt; if (chance(bdt * 4)) fx.add({ x: u.x + rand(-4, 4), y: u.y - bodyH(u) / 2, vy: 30, ay: 100, life: 0.4, color: '#e8405a' }); }
        if (u.burnT > 0) { u.burnT -= bdt; u.hp -= 3 * bdt; if (chance(bdt * 10)) fx.add({ x: u.x + rand(-6, 6), y: u.y - rand(4, bodyH(u)), vy: -30, life: 0.4, color: pick([PAL.A, PAL.L, PAL.R]) }); }
        if (u.team === 'ally' && (u.traits.includes('regen') || u.traits.includes('golden'))) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * (u.traits.includes('golden') ? 0.03 : 0.02) * bdt);
        if (u.hp <= 0) { kill(u, null); continue; }
        if (u.stunT > 0) { u.stunT -= bdt; u.state = 'idle'; continue; }
        u.hasteT = Math.max(0, u.hasteT - bdt);
        const haste = u.hasteT > 0 ? 1.5 : 1;
        u.cd -= bdt * haste;
        const f = nearestFoe(u);
        if (!f) { u.state = 'idle'; continue; }
        const dir = f.x > u.x ? 1 : -1;
        u.facing = dir;
        const dist = Math.abs(f.x - u.x);
        if (u.state === 'attack') {
          const before = u.animT;
          u.animT += (bdt * haste) / 0.55;
          if (before < 0.5 && u.animT >= 0.5) {
            u.hits++;
            const fire = u.traits.includes('hellfire') && u.hits % 3 === 0;
            if (fire) {
              fx.add({ kind: 'proj', x: u.x + dir * 10, y: u.y - bodyH(u) + 8, vx: dir * 160, life: 1.2, color: PAL.A, target: f, from: u });
              Sfx.play('zap', { intensity: 0.5, pitch: 0.7 });
            } else if (dist <= u.range + 8) {
              dealHit(u, f);
              if (u.traits.includes('whip') && chance(0.25)) setTimeout(() => { if (!f.dead && !u.dead) dealHit(u, f, { mult: 0.6 }); }, 180);
            } else Sfx.play('swing');
          }
          if (u.animT >= 1) { u.state = 'idle'; u.animT = 0; }
        } else if (dist > u.range) {
          u.state = 'walk';
          u.x += dir * u.speed * bdt * haste;
        } else {
          u.state = 'idle';
          if (u.cd <= 0) { u.state = 'attack'; u.animT = 0; u.cd = u.atkTime; if (u.team === 'enemy' || chance(0.5)) Sfx.play('swing', { intensity: 0.4 }); }
        }
      }
      // keep teammates from stacking
      for (const team of ['ally', 'enemy']) {
        const list = alive(units.filter((u) => u.team === team)).sort((a, b) => a.x - b.x);
        for (let i = 1; i < list.length; i++) {
          const a = list[i - 1], b = list[i];
          const gap = Math.abs(a.y - b.y) < 6 ? 26 : 12; // same lane: don't overlap; different lanes: depth is enough
          if (b.x - a.x < gap) { const push = (gap - (b.x - a.x)) / 2; a.x -= push * 0.6; b.x += push * 0.6; }
        }
      }
      // projectiles (hellfire)
      for (const p of fx.list) {
        if (p.kind !== 'proj' || p.done) continue;
        if (chance(0.6)) fx.add({ x: p.x, y: p.y + rand(-2, 2), vx: -p.vx * 0.05, vy: rand(-10, 10), life: 0.25, color: pick([PAL.A, PAL.L, PAL.R]) });
        if (p.target.dead) { p.life = 0; continue; }
        if (Math.abs(p.x - p.target.x) < 8) { p.done = true; p.life = 0; dealHit(p.from, p.target, { mult: 1.6, fire: true }); fx.burst(p.x, p.y, 10, { speed: 50, life: 0.4, color: [PAL.A, PAL.L] }); }
      }
      if (!alive(enemies()).length) finish('win');
      else if (!alive(allies()).length) finish('lose');
    }
    if (phase === 'done') {
      resultT += realDt;
      if (coinsShown < result.reward && resultT > 0.8 + coinsShown * 0.18) { coinsShown++; Sfx.play('coins_count'); }
    }
    // input
    const items = menuItems();
    if (Input.hit('up')) { menuSel = (menuSel + items.length - 1) % items.length; Sfx.play('ui_hover'); }
    if (Input.hit('down')) { menuSel = (menuSel + 1) % items.length; Sfx.play('ui_hover'); }
    menuSel = clamp(menuSel, 0, items.length - 1);
    if (Input.hit('a')) { const it = items[menuSel]; if (it && !it.disabled) it.act(); else Sfx.play('ui_deny'); }
    if (Input.hit('b') && phase === 'done') Engine.go('shop');
    UI.set(items.map((it, i) => ({ id: 'bm' + i, x: 12, y: 212 + i * 16, w: 94, h: 15, label: it.label, disabled: it.disabled, kind: 'menu', idx: i, silent: false,
      onClick: () => { menuSel = i; it.act(); } })));
  };

  function menuItems() {
    if (phase === 'done') {
      const canGo = Game.canFight() && result.kind === 'win';
      return [
        { label: 'BACK TO SHOP', act: () => Engine.go('shop') },
        { label: 'FIGHT ON', disabled: !canGo, act: () => Engine.go('battle') },
      ];
    }
    return [
      phase === 'ready' ? { label: 'FIGHT', act: start } : { label: zapCd > 0 ? `ZAP  ${Math.ceil(zapCd)}s` : 'ZAP', disabled: zapCd > 0, act: zap },
      { label: 'ABILITIES', disabled: true, act: () => { say('Abilities come from parts. Try a Demon Skull. Or a Black Heart.', 3); } },
      { label: 'RETREAT', act: retreat },
    ];
  }

  // ------------------------------------------------------------------ draw
  function drawEnemy(ctx, u) {
    const hover = Math.sin(t * 3 + u.bob) * 2 - u.K.hover;
    const atk = u.state === 'attack' && u.animT > 0.25 && u.animT < 0.75;
    const base = u.K.spr;
    const name = atk && SPR.has(base + '_atk') ? base + '_atk' : base + '_' + (Math.floor(t * 4 + u.bob) % 2);
    const lunge = u.state === 'attack' ? Math.sin(u.animT * Math.PI) * -6 : 0;
    if (SPR.has(name)) SPR.draw(ctx, name, u.x + lunge, u.y + hover, { solid: u.flashT > 0 ? '#fff6e3' : undefined });
    else { ctx.fillStyle = u.flashT > 0 ? '#fff' : '#1b1526'; ctx.fillRect(u.x - 8, u.y + hover - bodyH(u), 16, bodyH(u)); ctx.fillStyle = '#ff4040'; ctx.fillRect(u.x - 4, u.y + hover - bodyH(u) + 6, 2, 2); }
    if (u.stunT > 0) for (let i = 0; i < 3; i++) { const a = t * 6 + i * 2.1; ctx.fillStyle = PAL.L; ctx.fillRect(Math.round(u.x + Math.cos(a) * 8), Math.round(u.y - bodyH(u) - 4 + Math.sin(a) * 2), 1, 1); }
  }

  function drawBar(ctx, u) {
    const w = u.K && u.K.boss ? 40 : 24;
    const x = Math.round(u.x - w / 2), y = Math.round(u.y - bodyH(u) - 10);
    const k = clamp(u.hp / u.maxHp, 0, 1);
    Draw.rect(ctx, x - 1, y - 1, w + 2, 4, PAL.k);
    Draw.rect(ctx, x, y, w, 2, '#33274a');
    Draw.rect(ctx, x, y, Math.round(w * k), 2, u.team === 'ally' ? (k > 0.35 ? '#5fd3a0' : PAL.L) : '#e8405a');
    Draw.rect(ctx, x, y, Math.round(w * k), 1, u.team === 'ally' ? '#9bf5c8' : '#ff7d8a');
  }

  S.draw = function (ctx) {
    BG.graveyard(ctx, t);
    // shadows
    for (const u of units) {
      if (u.dead) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      const w = u.team === 'ally' ? 16 : u.K.w * 0.7;
      ctx.fillRect(Math.round(u.x - w / 2), u.y, Math.round(w), 2);
    }
    debris.draw(ctx);
    const order = units.filter((u) => !u.dead).sort((a, b) => a.y - b.y);
    for (const u of order) {
      if (u.team === 'ally') {
        drawCreature(ctx, u.c.slots, u.x, u.y, { t: t + u.bob, anim: phase === 'fight' ? u.state : 'idle', animT: u.animT, flash: u.flashT > 0, eyes: u.hasteT > 0 ? '#c2f5ff' : '#9be38f', lookX: 1 });
        if (u.hasteT > 0 && chance(0.3)) fx.add({ x: u.x - 10, y: u.y - rand(5, 40), vx: -60, life: 0.2, color: '#c2f5ff' });
      } else drawEnemy(ctx, u);
    }
    for (const u of order) if (phase !== 'done' || u.team === 'ally') drawBar(ctx, u);
    for (const b of bolts) Draw.bolt(ctx, b.x + rand(-20, 20), 0, b.x, b.y - 30, '#e7f7ff', 9, b.seed + Math.floor(b.t * 30));
    fx.draw(ctx);
    // projectiles
    for (const p of fx.list) if (p.kind === 'proj') { Draw.glow(ctx, p.x, p.y, 10, '#ffb070', 0.5); Draw.rect(ctx, p.x - 2, p.y - 2, 4, 4, PAL.L); Draw.rect(ctx, p.x - 1, p.y - 1, 2, 2, '#fff'); }

    // HUD: stage title
    Font.draw(ctx, STAGE_NAMES[Math.floor((fightStage - 1) / 5) % STAGE_NAMES.length], 472, 7, { align: 'right', color: '#cdb892', shadow: PAL.k });
    Font.draw(ctx, 'Stage ' + fightStage + (fightStage % 5 === 0 ? '  ·  BOSS' : ''), 472, 18, { align: 'right', color: '#a6aec2', shadow: PAL.k });
    if (SPR.has('ico_token')) SPR.draw(ctx, 'ico_token', 12, 12);
    Font.draw(ctx, String(Game.tokens), 20, 8, { color: PAL.L, shadow: PAL.k });

    // menu
    Draw.panel(ctx, 8, 206, 102, 58, 'slate');
    menuItems().forEach((it, i) => {
      const y = 212 + i * 16;
      const hot = UI.buttons[i] && UI.buttons[i].hover;
      if (hot || i === menuSel) { if (i === menuSel) Font.draw(ctx, '▶', 15, y + 3, { color: '#fff6e3' }); }
      Font.draw(ctx, it.label, 25, y + 3, { color: it.disabled ? '#4b4466' : hot || i === menuSel ? '#fff6e3' : '#cdb892' });
    });
    // narration box
    Draw.panel(ctx, 116, 222, 356, 42, 'slate');
    if (phase === 'done') drawResult(ctx);
    else if (Game.talk.visible()) Font.drawWrapped(ctx, Game.talk.text, 126, 229, 336, { color: '#ecdcbc', maxChars: Math.floor(Game.talk.shown) });
    else logLines.forEach((l, i) => Font.draw(ctx, l, 126, 229 + i * 12, { color: i === logLines.length - 1 ? '#ecdcbc' : '#7a6a9a' }));
    if (phase === 'ready' && Math.sin(t * 5) > 0) Draw.frame(ctx, 10, 210, 98, 17, '#ff8ac6');
  };

  function drawResult(ctx) {
    const r = result;
    const title = r.kind === 'win' ? 'STAGE CLEARED!' : r.kind === 'lose' ? 'DEFEATED' : 'RETREATED';
    const col = r.kind === 'win' ? '#9be38f' : r.kind === 'lose' ? '#e8405a' : '#cdb892';
    const k = clamp(resultT / 0.3, 0, 1);
    Font.draw(ctx, title, 240, 70 - Math.round((1 - easeOutBack(k)) * 20), { scale: 3, color: col, outline: PAL.k, shadow: '#0e0b16', align: 'center', alpha: k });
    if (r.lost.length) Font.draw(ctx, 'Lost: ' + r.lost.join(', '), 240, 100, { align: 'center', color: '#a6aec2', outline: PAL.k });
    // narration: rewards
    let x = 126;
    if (r.reward) {
      if (SPR.has('ico_token')) for (let i = 0; i < coinsShown; i++) SPR.draw(ctx, 'ico_token', x + 4 + i * 10, 234);
      Font.draw(ctx, `+${coinsShown} tokens`, x + 8 + r.reward * 10, 230, { color: PAL.L });
    }
    const back = r.restocked.length + r.deadParts.length;
    if (back) Font.draw(ctx, `${back} part${back > 1 ? 's' : ''} dropped into the claw machine`, 126, 247, { color: '#7a6a9a' });
    if (r.luck) Font.draw(ctx, '+' + r.luck + ' LUCK', 462, 230, { align: 'right', color: '#f6c64b' });
    if (!r.reward && !back) Font.draw(ctx, 'No reward. No shame. Well, some shame.', 126, 234, { color: '#7a6a9a' });
  }

  return S;
})();

// ==== 35_scene_shop.js ====
// ---------------------------------------------------------------------------
// SHOP SCENE — title screen and hub. The cabinet's window shows the live pile.
// COLLECT (claw) · COMBINE (slab) · COMMAND (graveyard).
// ---------------------------------------------------------------------------
Scenes.shop = (() => {
  const S = {};
  const fx = new Particles();
  let t = 0, titleT = 0, opened = false, zoom = null, blinkT = 0, chatT = 8, catT = 0, catMood = 0, lean = 0, tokenPop = 0;
  const MX = 6, MY = 4, MW = 194; // cabinet
  const GLX = MX + 7, GLY = 52; // glass (180x122 mini world)
  const REAPER_X = 300, COUNTER_Y = 196;
  const say = (x, h, force = true) => Game.talk.say(x, h, force);
  const IDLE_LINES = [
    'Everything\'s used. Nothing\'s cheap. That\'s the deal.',
    'One token, one grab. Life is simple when you\'re dead.',
    'Bodies. Power. A brighter tomorrow. It\'s on the poster, so it\'s true.',
    'I\'m told the claw is rigged. I\'m told a lot of things.',
    'The cat is not for sale. I asked.',
    'Every part in there was someone\'s favourite part once.',
    'Give them better parts. They\'ll give you better days.',
  ];
  // only while the Rig is on (?rig=0 is the original game)
  const RIG_LINES = [
    'There\'s a panel on the side of the machine. I didn\'t put it there. Flip the switches.',
    'Bad luck isn\'t wasted here. I bank it. Ask me how I know.',
  ];
  const idleLine = () => pick(Rig.on ? IDLE_LINES.concat(RIG_LINES) : IDLE_LINES);

  function hint() {
    if (Game.tokens > 0 && !Game.inventory.length && !Game.party.length) return 'collect';
    if (Game.inventory.length >= 3 && Game.party.length < 3 && (Game.tokens === 0 || Game.inventory.length >= 5)) return 'combine';
    if (Game.party.length && (Game.tokens === 0 || !Game.inventory.length)) return 'command';
    if (Game.tokens > 0) return 'collect';
    if (Game.inventory.length) return 'combine';
    return null;
  }

  S.enter = function (params) {
    Music.play('shop');
    zoom = null;
    if (opened) {
      if (Game.broke()) { Game.givePity(); say('Broke? Here. On the house. Death is patient.', 3.5); tokenPop = 1; }
      else if (Game.stage > 1 && !Game.seen['stage' + Game.stage]) { Game.seen['stage' + Game.stage] = 1; say(pick(['Welcome back, champion. The machine restocked itself. Funny, that.', 'Fresh parts in the machine. Some of them are your old friends.']), 3.5); }
      else if (chance(0.5)) say(pick(['Welcome back.', 'Good parts make great friends.', 'The machine missed you. It told me.']), 2.4);
    }
    if (params && params.skipIntro) open();
  };

  function open() {
    if (opened) return;
    opened = true;
    AudioSys.init();
    Sfx.play('coin');
    say('Good parts make great friends.', 2.4);
    Game.talk.say(`Here. ${Game.tokens} tokens. The first ones are always free.`, 3.2, false);
    tokenPop = 1;
    Telemetry.log('open');
  }

  function goClaw() {
    if (zoom) return;
    zoom = { t: 0 };
    Sfx.play('transition');
  }

  S.update = function (dt) {
    t += dt;
    Game.talk.update(dt);
    fx.update(dt);
    tokenPop = Math.max(0, tokenPop - dt * 2);
    blinkT -= dt;
    if (blinkT < -0.14) blinkT = rand(2, 5);
    catT += dt;
    catMood = Math.max(0, catMood - dt);
    lean = approach(lean, Game.talk.visible() ? 1 : 0, dt * 3);
    if (!opened) {
      titleT += dt;
      if (Input.anyPressed || Input.mouse.pressed) open();
      UI.set([]);
      return;
    }
    if (zoom) {
      zoom.t += dt;
      if (zoom.t > 0.5) { Engine.go('claw', {}, 'dither'); zoom = null; }
      UI.set([]);
      return;
    }
    chatT -= dt;
    if (chatT < 0 && !Game.talk.visible()) { chatT = rand(14, 22); say(idleLine(), 3.2); }
    const h = hint();
    const signs = [
      { id: 'collect', label: 'COLLECT', y: 205, onClick: goClaw, tip: [{ t: 'The claw machine', c: '#ff8ac6' }, { t: `1 token per grab · you have ${Game.tokens}`, c: '#ecdcbc' }] },
      { id: 'combine', label: 'COMBINE', y: 223, onClick: () => Engine.go('slab'), tip: [{ t: 'The slab', c: '#9be38f' }, { t: `stitch parts into creatures · ${Game.inventory.length} parts`, c: '#ecdcbc' }] },
      { id: 'command', label: 'COMMAND', y: 241, disabled: !Game.canFight(), onClick: () => Engine.go('battle'),
        onDeny: () => say('You\'ll need a friend first. The slab is right there.', 2.6),
        tip: Game.canFight() ? [{ t: 'The graveyard', c: '#e8405a' }, { t: `stage ${Game.stage} · party of ${Game.party.length}`, c: '#ecdcbc' }] : 'Stitch a creature first.' },
    ].map((b) => Object.assign({ x: 398, w: 76, h: 16, style: 'wood', kind: 'sign', pulse: h === b.id }, b));
    signs.push({ id: 'machine', x: MX, y: MY, w: MW, h: 214, label: '', kind: 'hot', silent: true, onClick: goClaw, tip: 'Play the claw machine' });
    signs.push({ id: 'cat', x: 424, y: 176, w: 24, h: 20, label: '', kind: 'hot', silent: true, onClick: () => { catMood = 1.5; Sfx.play('meow'); say(pick(['The cat is not for sale.', 'He bites. Affectionately.', 'That\'s Mr. Whiskers. He\'s been dead for years. Don\'t tell him.']), 2.4); } });
    signs.push({ id: 'reaper', x: REAPER_X - 22, y: 150, w: 44, h: 46, label: '', kind: 'hot', silent: true, onClick: () => { say(idleLine(), 3); chatT = 18; } });
    S.signs = signs;
    UI.set(signs);
    const sg = signs.filter((b) => b.kind === 'sign');
    if (Input.hit('up')) { S.sel = ((S.sel == null ? 0 : S.sel) + 2) % 3; Sfx.play('ui_hover'); }
    if (Input.hit('down')) { S.sel = ((S.sel == null ? -1 : S.sel) + 1) % 3; Sfx.play('ui_hover'); }
    if (Input.hit('a')) {
      const b = sg[S.sel == null ? 0 : S.sel];
      if (b.disabled) { Sfx.play('ui_deny'); b.onDeny && b.onDeny(); } else { Sfx.play('ui_click'); b.onClick(); }
    }
  };

  function drawCabinet(ctx) {
    // body
    const body = '#5a1834', hi = '#8a2a4e', lo = '#34101f', dark = '#220913';
    Draw.rect(ctx, MX, MY + 44, MW, 216, dark);
    Draw.rect(ctx, MX + 1, MY + 45, MW - 2, 214, body);
    Draw.rect(ctx, MX + 1, MY + 45, 2, 214, hi);
    Draw.rect(ctx, MX + MW - 3, MY + 45, 2, 214, lo);
    // marquee
    Draw.rect(ctx, MX - 2, MY, MW + 4, 44, dark);
    Draw.rect(ctx, MX, MY + 2, MW, 40, '#2b0a1a');
    Draw.rect(ctx, MX + 3, MY + 5, MW - 6, 34, '#6d1438');
    Draw.rect(ctx, MX + 3, MY + 5, MW - 6, 1, '#b0224a');
    Draw.glow(ctx, MX + MW / 2, MY + 20, 90, '#e8405a', 0.18);
    Font.draw(ctx, 'THE GOOD PARTS', MX + MW / 2 - 8, MY + 8, { scale: 2, color: '#fff1d6', outline: '#3a0c20', shadow: '#1b0610', align: 'center' });
    if (SPR.has('skull_small')) SPR.draw(ctx, 'skull_small', MX + MW - 18, MY + 16); else if (SPR.has('ico_skull')) SPR.draw(ctx, 'ico_skull', MX + MW - 18, MY + 16);
    Font.draw(ctx, 'COLLECT · REANIMATE · CONQUER', MX + MW / 2, MY + 29, { font: 'small', color: '#ffb8c8', align: 'center' });
    // marquee bulbs
    for (let i = 0; i < 22; i++) {
      const x = MX + 4 + i * 9;
      const on = (i + Math.floor(t * 5)) % 3 === 0 || !opened && Math.sin(t * 6 + i) > 0.3;
      Draw.rect(ctx, x, MY + 1, 2, 2, on ? PAL.l : '#6b3a1c');
      Draw.rect(ctx, x, MY + 41, 2, 2, !on ? PAL.l : '#6b3a1c');
    }
    // glass with the live pile
    Draw.rect(ctx, GLX - 3, GLY - 3, 186, 128, lo);
    Draw.rect(ctx, GLX - 2, GLY - 2, 184, 126, '#6b6f86');
    Scenes.claw.drawMini(ctx, GLX, GLY);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.moveTo(GLX + 30, GLY); ctx.lineTo(GLX + 60, GLY); ctx.lineTo(GLX + 5, GLY + 122); ctx.lineTo(GLX - 25 > GLX ? GLX : GLX, GLY + 122); ctx.fill();
    Draw.glow(ctx, GLX + 90, GLY + 60, 110, '#b84a7c', 0.08);
    // control panel
    const py = GLY + 128;
    Draw.rect(ctx, MX + 4, py, MW - 8, 34, '#3a0f22');
    Draw.rect(ctx, MX + 4, py, MW - 8, 1, hi);
    // joystick
    Draw.rect(ctx, MX + 30, py + 18, 30, 10, '#1b0610');
    Draw.rect(ctx, MX + 44, py + 8, 2, 12, '#a6aec2');
    const jx = Input.held('left') ? -2 : Input.held('right') ? 2 : 0;
    Draw.rect(ctx, MX + 42 + jx, py + 5, 6, 6, '#e8405a');
    Draw.rect(ctx, MX + 43 + jx, py + 6, 2, 2, '#ff7d8a');
    Font.draw(ctx, '← →', MX + 45, py + 22, { font: 'small', color: '#ffb8c8', align: 'center' });
    // coin display
    Draw.panel(ctx, MX + 110, py + 6, 70, 22, 'dark');
    Font.draw(ctx, '1', MX + 118, py + 9, { scale: 2, color: '#ff8ac6' });
    Font.draw(ctx, 'TOKEN', MX + 132, py + 12, { color: '#ffb8c8' });
    // lower body: prize door
    const ly = py + 38;
    Draw.rect(ctx, MX + 20, ly + 6, 60, 30, '#220913');
    Draw.rect(ctx, MX + 22, ly + 8, 56, 26, '#2b0a1a');
    Font.draw(ctx, 'PRIZE', MX + 50, ly + 17, { font: 'small', color: '#8a2a4e', align: 'center' });
    Draw.rect(ctx, MX + 120, ly + 6, 50, 30, '#220913');
    for (let i = 0; i < 4; i++) Draw.rect(ctx, MX + 124, ly + 11 + i * 6, 42, 2, '#34101f');
  }

  S.draw = function (ctx) {
    ctx.save();
    if (zoom) {
      const k = easeInOutQuad(clamp(zoom.t / 0.5, 0, 1));
      const s = 1 + k * 1.6;
      const cx = GLX + 90, cy = GLY + 61;
      ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
    }
    BG.shop(ctx, t, { layer: 'back' });
    // the reaper behind the counter
    const talking = Game.talk.talking() && Math.sin(t * 24) > 0;
    let rs = 'reaper_idle';
    if (talking && SPR.has('reaper_talk')) rs = 'reaper_talk';
    else if (blinkT < 0 && SPR.has('reaper_blink')) rs = 'reaper_blink';
    if (lean > 0.5 && !talking && SPR.has('reaper_lean') && catMood <= 0) rs = 'reaper_lean';
    const breathe = Math.round(Math.sin(t * 1.6) * 1);
    if (SPR.has(rs)) SPR.draw(ctx, rs, REAPER_X, 202 + breathe);
    BG.shop(ctx, t, { layer: 'front' }); // counter in front of him
    drawCabinet(ctx);
    // cat with swishing tail
    if (SPR.has('cat_sit')) {
      const cx = 436, cy = COUNTER_Y + 1;
      const tail = 'cat_tail' + [0, 1, 2, 1][Math.floor(t * (catMood > 0 ? 8 : 2.5)) % 4];
      if (SPR.has(tail)) SPR.draw(ctx, tail, cx + 6, cy - 3);
      SPR.draw(ctx, Math.sin(t * 0.9) > 0.97 || catMood > 0 && Math.sin(t * 10) > 0 ? 'cat_blink' : 'cat_sit', cx, cy - (catMood > 1.2 ? 2 : 0));
    }
    // poster text
    const ink = '#4c2270';
    Font.draw(ctx, 'BODIES', 437, 54, { color: ink, align: 'center' });
    Font.draw(ctx, '> POWER', 437, 66, { font: 'small', color: ink, align: 'center' });
    Font.draw(ctx, '> A BRIGHTER', 437, 75, { font: 'small', color: ink, align: 'center' });
    Font.draw(ctx, 'TOMORROW', 437, 83, { font: 'small', color: ink, align: 'center' });
    if (SPR.has('ico_skull')) SPR.draw(ctx, 'ico_skull', 437, 101, { alpha: 0.7 });
    // signs
    for (const b of S.signs || []) {
      if (b.kind !== 'sign') continue;
      UI.drawButton(ctx, b);
      if (b.pulse && opened && Math.sin(t * 5) > 0) Draw.frame(ctx, b.x - 2, b.y - 2, b.w + 4, b.h + 4, '#ff8ac6');
      if (S.sel != null && (S.signs || []).filter((q) => q.kind === 'sign')[S.sel] === b) { Draw.frame(ctx, b.x - 1, b.y - 1, b.w + 2, b.h + 2, '#fff6e3'); Font.draw(ctx, '▶', b.x - 8, b.y + 4, { color: '#fff6e3' }); }
    }
    // HUD
    const hudLuck = Rig.on;
    Draw.panel(ctx, 206, 4, (hudLuck ? 104 : 70) + (Game.bestStage ? 38 : 0), 16, 'dark');
    if (SPR.has('ico_token')) SPR.draw(ctx, 'ico_token', 216, 12);
    Font.draw(ctx, String(Game.tokens), 224, 8 - Math.round(tokenPop * 3), { color: PAL.L });
    Font.draw(ctx, 'PARTY ' + Game.party.length, 270, 9, { font: 'small', color: '#a6aec2', align: 'right' });
    if (hudLuck) {
      SPR.has('ico_luck_s') && SPR.draw(ctx, 'ico_luck_s', 283, 12);
      Font.draw(ctx, String(Rig.luck), 290, 8, { color: '#f6c64b' });
    }
    if (Game.bestStage) Font.draw(ctx, 'BEST ' + Game.bestStage, hudLuck ? 346 : 308, 9, { font: 'small', color: '#9be38f', align: 'right' });
    // speech bubble
    if (Game.talk.visible()) Game.talk.drawBubble(ctx, REAPER_X - 70, 150, 170, REAPER_X - 8, 158, { anchorBottom: true });
    fx.draw(ctx);
    ctx.restore();
    // title overlay
    if (!opened) {
      ctx.fillStyle = 'rgba(14,11,22,0.45)'; ctx.fillRect(0, 0, W, H);
      const k = clamp(titleT / 0.8, 0, 1);
      Font.draw(ctx, 'THE GOOD PARTS', 240, 92 - Math.round((1 - easeOutBack(k)) * 30), { scale: 4, color: '#fff1d6', outline: '#3a0c20', shadow: '#b0224a', align: 'center', alpha: k });
      Font.draw(ctx, 'a claw machine necromancer prototype', 240, 132, { color: '#cdb892', align: 'center', alpha: k, outline: PAL.k });
      if (Math.sin(t * 4) > -0.2) Font.draw(ctx, Input.lastDevice === 'touch' ? 'TAP TO OPEN THE SHOP' : 'CLICK OR PRESS ANY KEY', 240, 176, { color: '#ff8ac6', align: 'center', outline: PAL.k });
      Font.draw(ctx, '← →  MOVE    SPACE  DROP    ' + (Rig.on ? 'Q E  NUDGE    1-4  RIG    ' : '') + 'ESC  BACK    M  MUTE    F  FULLSCREEN', 240, 252, { font: 'small', color: '#7a6a9a', align: 'center' });
    }
  };

  return S;
})();

// ==== 40_telemetry.js ====
// ---------------------------------------------------------------------------
// TELEMETRY — lightweight playtest log. Watch someone play, then press P (or
// the report button in the debug panel) to see what they actually did:
// grab odds, slips, "one more try" retries, time per scene, battles.
// ---------------------------------------------------------------------------
const Telemetry = {
  t0: (typeof performance !== 'undefined' ? performance.now() : 0),
  events: [],
  sceneTime: {},
  cur: null, curT: 0,
  c: {
    grabs: 0, wins: 0, slips: 0, misses: 0, doubles: 0, freebies: 0,
    retryFast: 0, retrySlow: 0, quitAfterFail: 0,
    bySlipWhy: {}, wonRarity: { common: 0, uncommon: 0, rare: 0, legendary: 0 },
    creatures: 0, unstitched: 0, battles: 0, victories: 0, defeats: 0, retreats: 0, zaps: 0,
    bestStage: 0, pity: 0, tokensSpent: 0,
    // the Rig (docs/RNG_LAYER.md)
    luckEarned: 0, luckSpent: 0, luckWasted: 0, luckBy: {},
    quakes: 0, nudges: 0, tilts: 0, irons: 0, ironDisarmed: 0, orders: 0, redos: 0,
    riggedGrabs: 0, riggedWins: 0, plainGrabs: 0, plainWins: 0, ironGrabs: 0, ironWins: 0,
  },
  curRigged: false, curIron: false,
  lastFailT: null,
  now() { return ((typeof performance !== 'undefined' ? performance.now() : 0) - this.t0) / 1000; },
  log(type, data) {
    const e = { t: +this.now().toFixed(1), type };
    if (data) Object.assign(e, data);
    this.events.push(e);
    if (this.events.length > 800) this.events.shift();
  },
  scene(name) {
    const n = this.now();
    if (this.cur) this.sceneTime[this.cur] = (this.sceneTime[this.cur] || 0) + (n - this.curT);
    // leaving the claw right after a failed grab (with tokens left) = frustration signal
    if (this.cur === 'claw' && this.lastFailT != null && n - this.lastFailT < 4 && typeof Game !== 'undefined' && Game.tokens > 0) this.c.quitAfterFail++;
    this.cur = name; this.curT = n;
    this.log('scene', { name });
  },
  // rigged: a lever was used since the last drop. iron: this drop has Iron Grip.
  grabStart(rigged, iron) {
    const n = this.now();
    this.curRigged = !!rigged; this.curIron = !!iron;
    if (iron) this.c.ironGrabs++;
    if (rigged || iron) this.c.riggedGrabs++; else this.c.plainGrabs++;
    this.c.grabs++;
    this.c.tokensSpent++;
    if (this.lastFailT != null) {
      if (n - this.lastFailT < 6) this.c.retryFast++; else this.c.retrySlow++;
    }
    this.lastFailT = null;
    this.log('grab');
  },
  grabEnd(result, won) {
    if (result === 'win') {
      this.c.wins++; if (won.length > 1) this.c.doubles++;
      if (this.curIron) this.c.ironWins++;
      if (this.curRigged || this.curIron) this.c.riggedWins++; else this.c.plainWins++;
    }
    else if (result === 'slip') this.c.slips++;
    else this.c.misses++;
    if (result !== 'win') this.lastFailT = this.now();
    this.log('grabEnd', { result, parts: won.map((p) => p.type).join(',') });
  },
  report() {
    const c = this.c;
    const st = Object.assign({}, this.sceneTime);
    if (this.cur) st[this.cur] = (st[this.cur] || 0) + (this.now() - this.curT);
    const pct = (a, b) => (b ? Math.round((100 * a) / b) + '%' : '-');
    const fails = c.slips + c.misses;
    const lines = [
      'THE GOOD PARTS — playtest report',
      `session ${Math.round(this.now() / 60)} min ${Math.round(this.now() % 60)} s`,
      '',
      `grabs ${c.grabs}   wins ${c.wins} (${pct(c.wins, c.grabs)})   slips ${c.slips}   misses ${c.misses}   doubles ${c.doubles}   free chute drops ${c.freebies}`,
      `won by rarity: ${Object.entries(c.wonRarity).map(([k, v]) => k + ' ' + v).join(', ')}`,
      `slip causes: ${Object.entries(c.bySlipWhy).map(([k, v]) => k + ' ' + v).join(', ') || '-'}`,
      `after a failed grab: retried within 6s ${c.retryFast}, retried later ${c.retrySlow}, left the machine ${c.quitAfterFail}   (one-more-try rate ${pct(c.retryFast, fails)})`,
      `creatures stitched ${c.creatures}   unstitched ${c.unstitched}`,
      `battles ${c.battles}   won ${c.victories}   lost ${c.defeats}   retreats ${c.retreats}   zaps used ${c.zaps}   best stage ${c.bestStage}`,
      `pity tokens given ${c.pity}`,
      `THE RIG: luck earned ${c.luckEarned} (${Object.entries(c.luckBy).map(([k, v]) => k + ' ' + v).join(', ') || '-'})  spent ${c.luckSpent}  wasted at cap ${c.luckWasted}`,
      `  levers: quakes ${c.quakes}  nudges ${c.nudges}  tilts ${c.tilts}  iron grips ${c.irons} (taken back ${c.ironDisarmed})  orders ${c.orders}  redos ${c.redos}`,
      `  grabs after a lever: ${c.riggedGrabs} (wins ${pct(c.riggedWins, c.riggedGrabs)})   plain grabs: ${c.plainGrabs} (wins ${pct(c.plainWins, c.plainGrabs)})   iron grabs: ${c.ironGrabs} (wins ${pct(c.ironWins, c.ironGrabs)})`,
      `time: ${Object.entries(st).map(([k, v]) => k + ' ' + Math.round(v) + 's').join(', ')}`,
      '',
      'last events:',
      ...this.events.slice(-40).map((e) => `  ${e.t}s ${e.type} ${Object.entries(e).filter(([k]) => k !== 't' && k !== 'type').map(([k, v]) => k + '=' + v).join(' ')}`),
    ];
    return lines.join('\n');
  },
};

// ==== 41_debug.js ====
// ---------------------------------------------------------------------------
// DEBUG PANEL — press ` (backquote) or the wrench to tune CONFIG live.
// "Copy values" puts the current CONFIG (diff from defaults) on the clipboard.
// Also: cheats for fast iteration and the playtest report (P).
// ---------------------------------------------------------------------------
const Debug = {
  el: null, open: false, reportEl: null,
  build() {
    const el = (this.el = document.getElementById('debug'));
    if (!el) return;
    const groups = {};
    for (const m of CONFIG_META) (groups[m[0]] ||= []).push(m);
    let html = `<div class="dbg-head"><b>TUNING</b><span>live — changes apply instantly</span><button data-act="close">×</button></div>
      <div class="dbg-btns">
        <button data-act="copy">Copy values</button><button data-act="reset">Reset</button><button data-act="report">Playtest report</button>
      </div>
      <div class="dbg-btns">
        <button data-act="tokens">+5 tokens</button><button data-act="refill">Refill machine</button><button data-act="rare">Drop a legendary in</button>
        <button data-act="parts">+6 random parts</button><button data-act="win">Win battle</button><button data-act="stage">Stage +1</button>
      </div>
      <div class="dbg-btns">
        <button data-act="luck">+5 luck</button><button data-act="quake">Quake now</button><button data-act="free">Free levers</button>
      </div>`;
    for (const g in groups) {
      html += `<details ${g === 'Claw' ? 'open' : ''}><summary>${g}</summary>`;
      for (const [, key, def, min, max, step, label] of groups[g]) {
        html += `<label title="${key}"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${CONFIG[key]}" data-key="${key}"><output data-out="${key}">${CONFIG[key]}</output></label>`;
      }
      html += '</details>';
    }
    el.innerHTML = html;
    el.addEventListener('input', (e) => {
      const k = e.target.dataset.key;
      if (!k) return;
      CONFIG[k] = parseFloat(e.target.value);
      el.querySelector(`[data-out="${k}"]`).textContent = CONFIG[k];
    });
    el.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (!act) return;
      this.action(act, e.target);
    });
    const tog = document.getElementById('dbgToggle');
    if (tog) tog.addEventListener('click', () => this.toggle());
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return; // Ctrl+F (find), Ctrl+P (print), Cmd+M (minimize) are not ours
      if (e.code === 'Backquote') { this.toggle(); e.preventDefault(); }
      if (e.code === 'KeyP' && !(e.target && e.target.tagName === 'INPUT')) this.showReport();
      if (e.code === 'KeyM') AudioSys.toggleMute();
      if (e.code === 'KeyF' && !(e.target && e.target.tagName === 'INPUT')) this.fullscreen();
    });
  },
  toggle() { this.open = !this.open; this.el.classList.toggle('open', this.open); },
  sync() { for (const inp of this.el.querySelectorAll('input[data-key]')) { inp.value = CONFIG[inp.dataset.key]; this.el.querySelector(`[data-out="${inp.dataset.key}"]`).textContent = CONFIG[inp.dataset.key]; } },
  action(act, btn) {
    if (act === 'close') this.toggle();
    if (act === 'copy') {
      const diff = {};
      for (const k in CONFIG) if (CONFIG[k] !== CONFIG_DEFAULTS[k]) diff[k] = CONFIG[k];
      const txt = JSON.stringify(Object.keys(diff).length ? diff : CONFIG, null, 1);
      const ok = () => { btn.textContent = 'Copied!'; setTimeout(() => (btn.textContent = 'Copy values'), 1200); };
      try { navigator.clipboard.writeText(txt).then(ok, () => this.showText(txt)); } catch (err) { this.showText(txt); }
    }
    if (act === 'reset') { Object.assign(CONFIG, CONFIG_DEFAULTS); this.sync(); }
    if (act === 'report') this.showReport();
    if (act === 'tokens') Game.tokens += 5;
    if (act === 'refill') { Game.sim.clearParts(); Game.sim.fillPile(CONFIG.partCount); }
    if (act === 'rare') Game.sim.queueSpawn(randomPartType({ rarity: 'legendary' }));
    if (act === 'parts') for (let i = 0; i < 6; i++) Game.addPart(randomPartType());
    if (act === 'win' && Engine.sceneName === 'battle') Scenes.battle.cheatWin();
    if (act === 'stage') Game.stage++;
    if (act === 'luck') Rig.luck = Math.min(CONFIG.luckMax, Rig.luck + 5);
    if (act === 'quake') Game.sim.quake();
    if (act === 'free') { CONFIG.rigFree = CONFIG.rigFree ? 0 : 1; this.sync(); btn.textContent = CONFIG.rigFree ? 'Free levers: ON' : 'Free levers'; }
  },
  // clipboard blocked (embedded page)? show the text selected, ready for Ctrl+C
  showText(txt) {
    let ta = document.getElementById('dbgText');
    if (!ta) {
      ta = document.createElement('textarea');
      ta.id = 'dbgText'; ta.readOnly = true;
      this.el.querySelector('.dbg-btns').after(ta);
    }
    ta.value = txt;
    ta.focus(); ta.select();
  },
  fullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (err) { /* not allowed here: fine */ }
  },
  showReport() {
    let r = this.reportEl;
    if (!r) {
      r = this.reportEl = document.createElement('div');
      r.id = 'report';
      r.innerHTML = '<div class="rep-head"><b>Playtest report</b><button data-r="copy">Copy</button><button data-r="close">×</button></div><pre></pre>';
      document.body.appendChild(r);
      r.addEventListener('click', (e) => {
        if (e.target.dataset.r === 'close') r.classList.remove('open');
        if (e.target.dataset.r === 'copy') {
          const pre = r.querySelector('pre');
          const select = () => { const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(rg); };
          try { navigator.clipboard.writeText(pre.textContent).catch(select); } catch (err) { select(); }
        }
      });
    }
    r.querySelector('pre').textContent = Telemetry.report();
    r.classList.toggle('open');
  },
  update() {},
};

// ==== 98_fallbacks.js ====
// ---------------------------------------------------------------------------
// FALLBACKS — keep the game running if an optional module is missing/broken.
// ---------------------------------------------------------------------------
if (typeof AudioSys === 'undefined') window.AudioSys = { init() {}, toggleMute() {}, setMuted() {}, setVolumes() {}, muted: false, ctx: null };
if (typeof Sfx === 'undefined') window.Sfx = { play() {}, motor() {}, voice() {} };
if (typeof Music === 'undefined') window.Music = { play() {}, stop() {}, duck() {} };
if (typeof BG === 'undefined') {
  window.BG = {
    fill(ctx, c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); },
    shop(ctx) { this.fill(ctx, '#1f1628'); },
    lab(ctx) { this.fill(ctx, '#12201a'); },
    graveyard(ctx) { this.fill(ctx, '#141430'); ctx.fillStyle = '#1d2a22'; ctx.fillRect(0, 214, W, 56); },
    dither(ctx, level, color) { if (level <= 0) return; ctx.globalAlpha = level / 16; ctx.fillStyle = color || '#0e0b16'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; },
  };
}

// ==== 99_main.js ====
// ---------------------------------------------------------------------------
// BOOT — ?scene=claw|slab|battle|shop jumps straight in; ?seed=123 for a fixed
// pile; ?parts=1 starts with a bag of parts; ?party=1 with a ready creature;
// ?luck=8 sets Luck; ?rig=0 turns the Rig (RNG layer) off.
// ---------------------------------------------------------------------------
(function boot() {
  const start = () => {
    const Q = new URLSearchParams(location.search);
    if (Q.get('seed')) RNG = mulberry32(+Q.get('seed'));
    if (Q.get('rig') === '0') CONFIG.rigOn = CONFIG_DEFAULTS.rigOn = 0; // the original claw, for A/B playtests (also survives the tuning panel's Reset)
    Engine.init();
    Debug.build();
    if (BG.prebuild) BG.prebuild();
    Game.newGame();
    for (const k in Scenes) Engine.add(k, Scenes[k]);
    if (Q.get('parts')) for (const t of ['skull', 'ribcage', 'bonearm', 'fleshArm', 'boneleg', 'goatleg', 'heart', 'wolfskull', 'tentacle', 'wings', 'ogrearm', 'pegleg']) Game.addPart(t);
    if (Q.get('party')) {
      Game.party.push(new Creature({ head: 'skull', torso: 'ribcage', armL: 'swordarm', armR: 'bonearm', legL: 'boneleg', legR: 'boneleg', heart: 'heart' }));
      Game.party.push(new Creature({ head: 'wolfskull', torso: 'ogregut', armL: 'ogrearm', armR: 'clawarm', legL: 'goatleg', legR: 'pegleg' }));
    }
    if (Q.get('tokens')) Game.tokens = +Q.get('tokens');
    if (Q.get('luck')) Rig.luck = clamp(+Q.get('luck') || 0, 0, CONFIG.luckMax);
    const first = Q.get('scene') || 'shop';
    Engine.go(Scenes[first] ? first : 'shop', { skipIntro: !!Q.get('scene') }, 'cut');
    const boot = document.getElementById('boot');
    if (boot) boot.remove();
    requestAnimationFrame((n) => Engine.loop(n));
    window.__game = { Game, Engine, CONFIG, Scenes, Telemetry, Input };
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
