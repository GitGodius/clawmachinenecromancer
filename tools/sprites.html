<!doctype html><html><head><meta charset="utf-8"><title>Sprite sheet</title>
<style>body{background:#1b1526;color:#ecdcbc;font:11px monospace;margin:8px}
.s{display:inline-block;margin:6px;vertical-align:top;text-align:center}
canvas{image-rendering:pixelated;background:
 repeating-conic-gradient(#2a2238 0 25%,#231d31 0 50%) 0 0/12px 12px;display:block;margin:0 auto 2px}</style></head>
<body>
<script src="../src/js/03_palette.js"></script>
<script src="../src/js/04_sprites_core.js"></script>
<script src="../src/js/05_sprites_parts.js"></script>
<script>try{document.write('<script src="../src/js/06_sprites_world.js"><\/script>')}catch(e){}</script>
<script>
const Z = +(new URLSearchParams(location.search).get('z') || 6);
const only = new URLSearchParams(location.search).get('only');
window.addEventListener('load', () => {
  for (const name of Object.keys(SPR.defs)) {
    if (only && !name.startsWith(only)) continue;
    const s = SPR.get(name);
    const d = document.createElement('div'); d.className = 's';
    const c = document.createElement('canvas'); c.width = s.w * Z; c.height = s.h * Z;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    g.drawImage(s.c, 0, 0, s.w * Z, s.h * Z);
    // anchor
    g.fillStyle = 'rgba(255,0,255,.8)'; g.fillRect(s.ax * Z - 1, s.ay * Z - 1, 3, 3);
    for (const k in s.pts) { const [px, py] = s.pts[k]; g.fillStyle = 'rgba(0,255,255,.9)'; g.fillRect(px * Z - 1, py * Z - 1, 3, 3); }
    d.appendChild(c); d.appendChild(document.createTextNode(name + ' ' + s.w + 'x' + s.h));
    document.body.appendChild(d);
  }
});
</script></body></html>
