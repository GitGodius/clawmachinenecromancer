<!doctype html><html><head><meta charset="utf-8"><title>World sprites</title>
<!-- Preview for src/js/06_sprites_world.js (loads only 03 + 04 + 06).
     ?z=6          zoom
     &only=a,b     comma-separated name prefixes
     &grid=1       pixel grid on the zoomed view
     &bg=%23261d35 background of the 1x/2x previews (default night purple)
     &marks=0      hide anchor/points markers
     &crop=x,y,w,h only show that sub-rectangle of each sprite in the zoomed view -->
<style>body{background:#140f1d;color:#ecdcbc;font:11px monospace;margin:8px}
.s{display:inline-block;margin:6px;vertical-align:top;text-align:center}
.row{display:flex;gap:6px;align-items:flex-end;justify-content:center}
canvas{image-rendering:pixelated;display:block}
canvas.z{background:repeating-conic-gradient(#2a2238 0 25%,#231d31 0 50%) 0 0/12px 12px}</style></head>
<body>
<script src="../src/js/03_palette.js"></script>
<script src="../src/js/04_sprites_core.js"></script>
<script src="../src/js/06_sprites_world.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const Z = +(Q.get('z') || 6);
const only = Q.get('only') ? Q.get('only').split(',') : null;
const GRID = Q.get('grid') === '1';
const BG = Q.get('bg') || '#261d35';
const MARKS = Q.get('marks') !== '0';
const CROP = Q.get('crop') ? Q.get('crop').split(',').map(Number) : null;
window.addEventListener('load', () => {
  for (const name of Object.keys(SPR.defs)) {
    if (only && !only.some((p) => name.startsWith(p))) continue;
    const s = SPR.get(name);
    const d = document.createElement('div'); d.className = 's';
    const row = document.createElement('div'); row.className = 'row';
    const [cx, cy, cw, ch] = CROP || [0, 0, s.w, s.h];
    const c = document.createElement('canvas'); c.className = 'z'; c.width = cw * Z; c.height = ch * Z;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    g.drawImage(s.c, cx, cy, cw, ch, 0, 0, cw * Z, ch * Z);
    g.translate(-cx * Z, -cy * Z);
    if (GRID) {
      g.fillStyle = 'rgba(255,255,255,.07)';
      for (let x = 0; x <= s.w; x++) g.fillRect(x * Z, 0, 1, s.h * Z);
      for (let y = 0; y <= s.h; y++) g.fillRect(0, y * Z, s.w * Z, 1);
      g.fillStyle = 'rgba(255,255,255,.18)';
      for (let x = 0; x <= s.w; x += 5) g.fillRect(x * Z, 0, 1, s.h * Z);
      for (let y = 0; y <= s.h; y += 5) g.fillRect(0, y * Z, s.w * Z, 1);
    }
    if (MARKS) {
      g.fillStyle = 'rgba(255,0,255,.9)'; g.fillRect(s.ax * Z - 2, s.ay * Z - 2, 4, 4);
      for (const k in s.pts) { const [px, py] = s.pts[k]; g.fillStyle = 'rgba(0,255,255,.9)'; g.fillRect(px * Z - 1, py * Z - 1, 3, 3); }
    }
    row.appendChild(c);
    // game scale (3x, as the 480x270 canvas is shown on a ~1440px screen) on a flat background
    const p = document.createElement('canvas'); p.width = s.w * 3 + 12; p.height = s.h * 3 + 12;
    const pg = p.getContext('2d'); pg.imageSmoothingEnabled = false;
    pg.fillStyle = BG; pg.fillRect(0, 0, p.width, p.height);
    pg.drawImage(s.c, 6, 6, s.w * 3, s.h * 3);
    row.appendChild(p);
    d.appendChild(row);
    d.appendChild(document.createTextNode(name + ' ' + s.w + 'x' + s.h + ' @' + s.ax + ',' + s.ay));
    document.body.appendChild(d);
  }
});
</script></body></html>
